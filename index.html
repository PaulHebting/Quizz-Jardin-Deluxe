<!DOCTYPE html>

<head>

            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 15px;
            font-weight: 800;
            color: #4ade80;
        }

        .daily-visits {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            margin-top: 2px;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 14px;
            margin-top: 10px;
        }

        .quiz-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
            font-weight: 800;
        }

        .question-number {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
        }

        .question-text {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.25;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.35;
            margin-top: 4px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;

            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;

            padding: 16px;
            display: flex;
            flex-direction: column;

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon { font-size: 24px; }
        .trophy-details h4 { font-size: 13px; color: #f8fafc; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #94a3b8; }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées du Jardinier</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>

        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">

    </div>

    <div class="app-content">
        <div class="user-profile-card">

            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="JardinierExpert" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="quiz-header-info">
                <div class="question-title">❓ QUESTION</div>
                <div class="question-number" id="q-num">1 / 150</div>
            </div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

        { t: "la taille des hortensias", p1: "Conserver les bois sains et couper les fleurs fanées au-dessus du premier bourgeon", p2: "Rabattre le pied à ras du sol chaque automne", p3: "Supprimer tout le vieux bois sans distinction", p4: "Tailler uniquement en plein mois de juillet", e: "Les hortensias fleurissent sur le bois de l'année précédente." },
        { t: "la plantation d'un arbre fruitier", p1: "Faire un trou 3 fois plus large que la motte et tuteurer sans blesser le tronc", p2: "Mettre le point de greffe profondément sous la terre", p3: "Remplir le trou uniquement avec de la tourbe pure", p4: "Comprimer la terre avec une masse lourde", e: "Le point de greffe doit impérativement rester au-dessus du niveau du sol." },
        { t: "le choix d'une haie brise-vue persistance", p1: "Mélanger des essences variées comme le laurier-tin, le photinia et l'élæagnus", p2: "Planter uniquement des bambous traçants sans barrière anti-rhizome", p3: "Installer des cyprès tous les 20 cm d'intervalle", p4: "Utiliser des arbres à feuilles caduques à pousse lente", e: "La diversité des essences limite la propagation des maladies et favorise la biodiversité." },
        { t: "la gestion du compost en permaculture", p1: "Alterner les couches de matières sèches brunes et humides vertes", p2: "N'utiliser que des restes de produits laitiers", p3: "Empêcher le compost de recevoir de l'air", p4: "Mettre des plastiques biodégradables non compostables", e: "L'aération et le ratio Carbone/Azote sont la clé d'un compost équilibré." },
        { t: "l'arrosage automatique du potager", p1: "Privilégier le goutte-à-goutte au pied tôt le matin", p2: "Arroser par aspersion en plein soleil à 14h", p3: "Mouiller généreusement le feuillage tous les soirs", p4: "Arroser une fois par mois avec un gros volume", e: "L'arrosage au pied limite les maladies fongiques et l'évaporation inutile." }
    ];

    const quizData = [...baseClientQuestions];

    while (quizData.length < 150) {
        let index = quizData.length + 1;
        let topic = clientTopics[index % clientTopics.length];
        
        quizData.push({
            q: `Quelle est la bonne méthode concernant ${topic.t} pour une intervention professionnelle n°${index} ?`,
            correct: `${topic.p1}`,
            wrongs: [
                `${topic.p2}`,
                `${topic.p3}`,
                `${topic.p4}`
            ],
            exp: topic.e,
            wiki: "https://fr.wikipedia.org/wiki/Jardinage"
        });
    }

    let score = 0;
    let currentQuestionIndex = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let correctButtonIndex = 0;
    let totalAnsweredCount = 0;

    const avatars = ["👨‍🌾", "👩‍🌾", "👷‍♂️", "🚜", "🌿", "🧑‍🌾"];
    let avatarIdx = 0;

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première Question Réussie", desc: "Donner votre première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Jardinier Qualifié", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Tenue", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "⚠️", title: "Erreur de Diagnostic", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "⭐", title: "Expert Vert", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "📋", title: "Sérieux", desc: "Répondre à 10 questions", unlocked: false },
        { id: "t7", icon: "🏆", title: "Expert Horticole", desc: "Atteindre 250 points", unlocked: false }
    ];

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_client_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_client_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_client_visit_date', today);
            score += 20;
            showAchievement("💧 Pointage du matin : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_client_visits_count', visitCount);
        document.getElementById("visits-count").innerText = visitCount;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_client_score')) score = parseInt(localStorage.getItem('jardin_client_score'));
        if (localStorage.getItem('jardin_client_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_client_pseudo');
        if (localStorage.getItem('jardin_client_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_client_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_client_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_client_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_client_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_client_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_client_avatar_count'));
        }
        trackDailyVisits();
        renderTrophiesList();
        updateScoreDisplay();
        loadNextQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_client_score', score);
        localStorage.setItem('jardin_client_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_client_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_client_avatar_count', avatarsChangesCount);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_client_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        if (avatarsChangesCount >= 3) unlockTrophy("t3");
        saveUserData();
    }

    function checkTrophies() {
        if (score >= 10) unlockTrophy("t1");
        if (score >= 100) unlockTrophy("t2");
        if (totalAnsweredCount >= 10) unlockTrophy("t6");
        if (score >= 250) unlockTrophy("t7");
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = `${score} Pts`;
        checkTrophies();
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadNextQuestion() {
        currentQuestionObj = quizData[currentQuestionIndex];
        
        document.getElementById("question").innerText = currentQuestionObj.q;
        document.getElementById("q-num").innerText = `${currentQuestionIndex + 1} / ${quizData.length}`;

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        shuffledOptionsCache = shuffleArray(allOptions);
        correctButtonIndex = shuffledOptionsCache.indexOf(currentQuestionObj.correct);

        const optsContainer = document.getElementById("options");
        optsContainer.innerHTML = "";

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        shuffledOptionsCache.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });

        currentQuestionIndex = (currentQuestionIndex + 1) % quizData.length;
    }

    function selectOption(selectedIndex) {
        totalAnsweredCount++;
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctButtonIndex) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const isCorrect = (selectedIndex === correctButtonIndex);
        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        
        if (isCorrect) {
            score += 10;
            pointsNotice.innerText = `✅ Bonne réponse ! (+10 pts)`;
            pointsNotice.style.color = "#4ade80";
            
            consecutiveSuccess++;
            consecutiveErrors = 0;
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
        } else {
            score = Math.max(0, score - 5);
            pointsNotice.innerText = `❌ Mauvaise réponse (-5 pts)`;
            pointsNotice.style.color = "#f87171";
            
            consecutiveErrors++;
            consecutiveSuccess = 0;
            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        explanationText.innerText = currentQuestionObj.exp;
        explanationBox.style.display = "block";

        const wikiBtn = document.getElementById("wiki-btn");
        if (currentQuestionObj.wiki) {
            wikiBtn.href = currentQuestionObj.wiki;
            wikiBtn.style.display = "flex";
        }

        document.getElementById("next-btn").style.display = "block";

        updateScoreDisplay();
        saveUserData();
    }

    function nextQuestion() {
        loadNextQuestion();
    }

    function shareScore() {
        const pseudo = document.getElementById("username-input").value || "Jardinier";
        const text = `${pseudo} a obtenu ${score} points sur Le Quiz Jardinier 🌿 !`;
        if (navigator.share) {
            navigator.share({ title: 'Quiz Jardinier', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
