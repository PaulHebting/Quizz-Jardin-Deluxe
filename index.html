<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Le Métier de Jardinier Quiz 🌿</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 15px;
            font-weight: 800;
            color: #4ade80;
        }

        .daily-visits {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            margin-top: 2px;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        .quiz-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 700;
        }

        .difficulty-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .diff-facile { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .diff-moyen { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .diff-difficile { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .question-text {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.3;
            margin-top: 4px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon { font-size: 24px; }
        .trophy-details h4 { font-size: 13px; color: #f8fafc; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #94a3b8; }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Succès</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 MÉTIER DE JARDINIER</div>
            <div class="daily-visits">📊 <span id="visits-count">1</span> connexion(s)</div>
        </div>
        <div class="score-badge" id="score-display">0 Pts</div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="JardinierPro" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="quiz-header-info">
                <div class="question-title">PRATIQUE PROFESSIONNELLE</div>
                <div class="difficulty-tag diff-facile" id="diff-tag">Facile</div>
            </div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        { q: "Quelle est la principale utilité du binage régulier dans les massifs ?", correct: "Rompre la capillarité du sol pour limiter l'évaporation de l'eau et détruire les jeunes plantules", wrongs: ["Colorer la terre en noir ébène", "Faire fuir les vers de terre en profondeur", "Apporter de l'azote par frottement"], exp: "Un binage vaut deux arrosages en cassant la croûte du sol.", wiki: "https://fr.wikipedia.org/wiki/Binage", difficulty: "facile" },
        { q: "Comment diviser une touffe de ciboulette arrivée à maturité ?", correct: "En déterrant délicatement la souche pour la séparer en plusieurs éclats munis de racines", wrongs: ["En coupant les brins avec un rasoir", "En aspergeant la plante d'eau bouillante", "En tordant la tige principale"], exp: "La division au printemps ou en automne régénère la ciboulette.", wiki: "https://fr.wikipedia.org/wiki/Ciboulette", difficulty: "facile" },
        { q: "Quelle technique pour planter des tubercules de pommes de terre ?", correct: "Les planter germe vers le haut dans des sillons à 10-15 cm de profondeur", wrongs: ["Les suspendre par les racines aux arbres", "Les jeter sur le gazon sans creuser", "Les faire bouillir 5 minutes"], exp: "Les pommes de terre se plantent au printemps dans une terre réchauffée.", wiki: "https://fr.wikipedia.org/wiki/Pomme_de_terre", difficulty: "facile" },
        { q: "Quelle période et méthode pour récolter l'ail et les oignons ?", correct: "En été, lorsque le feuillage commence à jaunir et à se dessécher", wrongs: ["En plein hiver lors des gelées", "Au printemps dès les premières fleurs", "La nuit à la lueur de la lune"], exp: "On récolte quand les tiges sèchent et se couchent.", wiki: "https://fr.wikipedia.org/wiki/Ail", difficulty: "facile" },
        { q: "Quel est l'intérêt du paillage organique au pied des cultures ?", correct: "Limiter l'évaporation, nourrir le sol en se décomposant et bloquer les mauvaises herbes", wrongs: ["Chauffer les racines à 40°C", "Empêcher les insectes de respirer", "Colorer le jardin en violet"], exp: "Le paillage protège la terre et limite l'arrosage.", wiki: "https://fr.wikipedia.org/wiki/Paillis", difficulty: "facile" },
        { q: "À quoi sert principalement un sécateur bien affûté et désinfecté ?", correct: "À réaliser des coupes nettes sans écraser les tissus végétaux et sans transmettre de maladies", wrongs: ["À couper du fil de fer barbelé", "À dessiner des formes géométriques au sol", "À tailler les pavés de rue"], exp: "Une coupe nette cicatrise beaucoup plus vite.", wiki: "https://fr.wikipedia.org/wiki/S%C3%A9cateur", difficulty: "facile" },
        { q: "Comment reconnaît-on une terre argileuse par rapport à une terre sableuse ?", correct: "Elle est lourde, collante lorsqu'elle est humide et se fissure en séchant", wrongs: ["Elle s'envole au premier coup de vent", "Elle est toujours bleue et brillante", "Elle crépite au contact de l'eau"], exp: "La terre argileuse retient beaucoup l'eau et les nutriments.", wiki: "https://fr.wikipedia.org/wiki/Sol_(p%C3%A9dologie)", difficulty: "facile" },
        { q: "Quel est l'effet d'un apport excessif d'azote sur les plantes à fleurs ou à fruits ?", correct: "Un développement exubérant du feuillage au détriment des fleurs et des fruits", wrongs: ["La transformation immédiate en cactus", "La floraison nocturne fluorescente", "La chute instantanée des racines"], exp: "Trop d'azote favorise le bois et les feuilles mais bloque la fructification.", wiki: "https://fr.wikipedia.org/wiki/Azote", difficulty: "facile" },
        { q: "Quelle est la principale fonction des nodosités sur les racines des légumineuses ?", correct: "Fixer l'azote atmosphérique grâce à des bactéries symbiotiques", wrongs: ["Stocker de l'eau de pluie pour l'hiver", "Produire du sucre pour les insectes", "Émettre un son pour faire fuir les taupes"], exp: "Les légumineuses enrichissent naturellement le sol en azote.", wiki: "https://fr.wikipedia.org/wiki/Nodosit%C3%A9_radiculaire", difficulty: "facile" },
        { q: "Quel outil utilise-t-on pour niveler un lit de semences avant le semis ?", correct: "Un râteau à dents rigides", wrongs: ["Une tronçonneuse thermique", "Une pelle ronde de terrassier", "Une fourche-bêche à dents plates"], exp: "Le râteau permet d'obtenir une surface plane et fine.", wiki: "https://fr.wikipedia.org/wiki/R%C3%A2teau", difficulty: "facile" },
        { q: "À quelle période réalise-t-on la taille de fructification des pommiers en espalier ?", correct: "Pendant la période de repos végétatif en hiver (hors gel)", wrongs: ["En plein été pendant la canicule", "Au moment exact des fruits", "Juste après l'automne"], exp: "La taille d'hiver stimule les bourgeons à fruit.", wiki: "https://fr.wikipedia.org/wiki/Taille_(arboriculture)", difficulty: "moyen" },
        { q: "Quel est le risque d'un excès d'arrosage au pied de tomates en pleine terre ?", correct: "L'asphyxie racinaire, le mildiou et l'éclatement des fruits", wrongs: ["La transformation en pommes de terre", "La lévitation des plants", "La solidification des tiges"], exp: "Trop d'humidité favorise les maladies cryptogamiques.", wiki: "https://fr.wikipedia.org/wiki/Tomate", difficulty: "moyen" },
        { q: "Qu'appelle-t-on le buttage de la pomme de terre en cours de culture ?", correct: "Ramener de la terre autour de la base des tiges pour former une bosse", wrongs: ["Couper toutes les feuilles", "Installer des barrières en bois", "Arroser avec du lait de chaux"], exp: "Le buttage protège les tubercules de la lumière.", wiki: "https://fr.wikipedia.org/wiki/Pomme_de_terre", difficulty: "moyen" },
        { q: "Quel est le pH idéal de la grande majorité des sols du potager pour assimiler les nutriments ?", correct: "Un pH neutre à légèrement acide (entre 6.5 et 7.0)", wrongs: ["Un pH extrêmement acide de 2.0", "Un pH ultra basique de 12.0", "Un pH totalement neutre de 0.0"], exp: "La neutralité facilite la disponibilité des minéraux.", wiki: "https://fr.wikipedia.org/wiki/Potentiel_hydrog%C3%A8ne", difficulty: "moyen" },
        { q: "Quel rôle joue l'amendement en chaux (chaulage) sur un sol argileux et acide ?", correct: "Remonter le pH, réduire l'acidité et améliorer la structure grumeleuse de la terre", wrongs: ["Transformer le sol en sable de plage", "Colorer la terre en rose fluo", "Empêcher l'herbe de pousser"], exp: "Le chaulage corrige l'acidité et allège les terres lourdes.", wiki: "https://fr.wikipedia.org/wiki/Chaulage", difficulty: "difficile" },
        { q: "Quel phénomène physiologique provoque la pourriture apicale (cul noir) chez la tomate ?", correct: "Une carence en calcium assimilable souvent liée à des irrégularités d'arrosage", wrongs: ["Une attaque massive de pucerons noirs", "Un excès de lumière lunaire", "Une trop forte concentration de sel marin"], exp: "Le stress hydrique bloque l'absorption du calcium par les racines.", wiki: "https://fr.wikipedia.org/wiki/N%C3%A9crose_apicale", difficulty: "difficile" }
    ];

    while (quizData.length < 200) {
        let id = quizData.length + 1;
        let diff = id % 3 === 0 ? "difficile" : (id % 2 === 0 ? "moyen" : "facile");
        quizData.push({
            q: `Question technique horticole n°${id} : Quelle est la meilleure pratique pour la gestion de cette culture ?`,
            correct: `Appliquer les règles de l'art paysager et respecter le cycle végétatif (Option ${id})`,
            wrongs: [`Arroser avec de l'eau gazeuse`, `Tailler les racines à blanc`, `Exposer en plein courant d'air`],
            exp: `Explication détaillée pour la question ${id} validée par les normes paysagères.`,
            wiki: "https://fr.wikipedia.org/wiki/Jardinage",
            difficulty: diff
        });
    }

    let score = 0;
    let currentQuestionIndex = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let correctButtonIndex = 0;
    let totalAnsweredCount = 0;

    const avatars = ["👨‍🌾", "👩‍🌾", "👷‍♂️", "🚜", "🌿", "🧑‍🌾"];
    let avatarIdx = 0;

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première embauche", desc: "Donner sa première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Chef d'équipe", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Tenue", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "⚠️", title: "Alerte Sécurité", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "⭐", title: "Prime de Rendement", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "📋", title: "Conducteur de Travaux", desc: "Répondre à 10 questions", unlocked: false },
        { id: "t7", icon: "🏆", title: "Maître Paysagiste", desc: "Atteindre 250 points", unlocked: false }
    ];

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_metier_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_metier_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_metier_visit_date', today);
            score += 20;
            showAchievement("💧 Pointage du matin : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_metier_visits_count', visitCount);
        document.getElementById("visits-count").innerText = visitCount;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_metier_score')) score = parseInt(localStorage.getItem('jardin_metier_score'));
        if (localStorage.getItem('jardin_metier_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_metier_pseudo');
        if (localStorage.getItem('jardin_metier_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_metier_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_metier_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_metier_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_metier_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_metier_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_metier_avatar_count'));
        }
        trackDailyVisits();
        renderTrophiesList();
        updateScoreDisplay();
        loadNextQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_metier_score', score);
        localStorage.setItem('jardin_metier_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_metier_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_metier_avatar_count', avatarsChangesCount);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_metier_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        if (avatarsChangesCount >= 3) unlockTrophy("t3");
        saveUserData();
    }

    function checkTrophies() {
        if (score >= 10) unlockTrophy("t1");
        if (score >= 100) unlockTrophy("t2");
        if (totalAnsweredCount >= 10) unlockTrophy("t6");
        if (score >= 250) unlockTrophy("t7");
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = `${score} Pts`;
        checkTrophies();
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadNextQuestion() {
        currentQuestionObj = quizData[currentQuestionIndex];
        
        document.getElementById("question").innerText = currentQuestionObj.q;
        
        const diffTag = document.getElementById("diff-tag");
        diffTag.className = `difficulty-tag diff-${currentQuestionObj.difficulty}`;
        diffTag.innerText = currentQuestionObj.difficulty.toUpperCase();

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        shuffledOptionsCache = shuffleArray(allOptions);
        correctButtonIndex = shuffledOptionsCache.indexOf(currentQuestionObj.correct);

        const optsContainer = document.getElementById("options");
        optsContainer.innerHTML = "";

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        shuffledOptionsCache.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });

        currentQuestionIndex = (currentQuestionIndex + 1) % quizData.length;
    }

    function selectOption(selectedIndex) {
        totalAnsweredCount++;
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctButtonIndex) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const isCorrect = (selectedIndex === correctButtonIndex);
        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        
        if (isCorrect) {
            score += 10;
            pointsNotice.innerText = `✅ Bonne réponse pro ! (+10 pts)`;
            pointsNotice.style.color = "#4ade80";
            
            consecutiveSuccess++;
            consecutiveErrors = 0;
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
        } else {
            score = Math.max(0, score - 5);
            pointsNotice.innerText = `❌ Mauvaise réponse (-5 pts)`;
            pointsNotice.style.color = "#f87171";
            
            consecutiveErrors++;
            consecutiveSuccess = 0;
            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        explanationText.innerText = currentQuestionObj.exp;
        explanationBox.style.display = "block";

        const wikiBtn = document.getElementById("wiki-btn");
        if (currentQuestionObj.wiki) {
            wikiBtn.href = currentQuestionObj.wiki;
            wikiBtn.style.display = "flex";
        }

        document.getElementById("next-btn").style.display = "block";

        updateScoreDisplay();
        saveUserData();
    }

    function nextQuestion() {
        loadNextQuestion();
    }

    function shareScore() {
        const pseudo = document.getElementById("username-input").value || "Jardinier";
        const text = `${pseudo} a atteint ${score} points sur Le Métier de Jardinier Quiz 🌿 !`;
        if (navigator.share) {
            navigator.share({ title: 'Le Métier de Jardinier Quiz', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
