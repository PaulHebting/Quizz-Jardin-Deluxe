<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Jardinier - Expert 🌿</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 14px;
            font-weight: 800;
            color: #4ade80;
        }

        .rank-title {
            font-size: 11px;
            color: #facc15;
            font-weight: 700;
            margin-top: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .combo-badge {
            background: rgba(249, 115, 22, 0.15);
            color: #fdba74;
            padding: 5px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(249, 115, 22, 0.3);
            display: none;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .timer-bar-container {
            width: 100%;
            height: 4px;
            background: #334155;
            position: relative;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #38bdf8;
            transition: width 0.1s linear, background-color 0.3s;
        }

        .app-content {
            flex: 1;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 18px;
            padding: 10px 12px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            cursor: pointer;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #4ade80;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .jokers-bar {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .joker-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .joker-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #334155;
            color: #94a3b8;
        }

        .quiz-box {
            background: #334155;
            border-radius: 14px;
            padding: 12px;
            margin-top: 8px;
        }

        .question-title {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .question-text {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 8px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 11px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.25;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #4ade80;
        }

        .option-btn.hidden-by-joker {
            display: none;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 10px;
            padding: 8px;
            margin-top: 6px;
        }

        .explanation-text {
            font-size: 12px;
            color: #e2e8f0;
            line-height: 1.3;
            margin-top: 3px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 12px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 8px;
            border-radius: 9px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 7px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon { font-size: 24px; }
        .trophy-details h4 { font-size: 13px; color: #f8fafc; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #94a3b8; }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Grades</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 QUESTIONS JARDIN</div>
            <div class="rank-title" id="rank-display">🌱 Graine de radis</div>
        </div>
        <div class="header-right">
            <div class="combo-badge" id="combo-badge">🔥 x0</div>
            <div class="score-badge" id="score-display">0 Pts</div>
        </div>
    </div>

    <div class="timer-bar-container">
        <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="JardinierExpert" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
                <div class="jokers-bar">
                    <button class="joker-btn" id="joker-50" onclick="useJoker50()">✂️ 50/50 (<span id="count-50">2</span>)</button>
                    <button class="joker-btn" id="joker-tip" onclick="useJokerTip()">💡 Indice (<span id="count-tip">2</span>)</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="question-title">❓ QUESTION</div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

<script>
    const baseTopics = [
        { 
            q: "Pourquoi mon gazon jaunit-il par plaques en plein été ?", 
            correct: "Manque d'arrosage ou attaque de larves de hannetons", 
            wrongs: ["Carence superficielle en azote bloquée par un sol trop détrempé", "Excès d'apport d'engrais organique riche en potasse pure", "Tonte effectuée un jour de canicule avec une lame mal affûtée"], 
            exp: "Un jaunissement estival est souvent lié au stress hydrique ou aux ravageurs souterrains.", 
            wiki: "https://fr.wikipedia.org/wiki/Gazon" 
        },
        { 
            q: "Que faire contre la mousse qui envahit ma pelouse à l'ombre ?", 
            correct: "Scarifier le gazon, améliorer le drainage et éclaircir l'ombrage", 
            wrongs: ["Appliquer un traitement massif à base de sulfate de fer à l'automne", "Tondre de manière ultra-courte à 2 cm chaque semaine pour l'asphyxier", "Épandre du sable de rivière pur en surface sans aérer au préalable"], 
            exp: "La mousse prolifère sur les sols acides, compacts et humides à l'ombre.", 
            wiki: "https://fr.wikipedia.org/wiki/Scarification_(jardinage)" 
        },
        { 
            q: "Quelle est la règle d'or pour tondre sa pelouse en période de forte chaleur ?", 
            correct: "Tondre haut (ne pas couper plus d'un tiers de la hauteur) pour garder l'humidité", 
            wrongs: ["Ne tondre que les bordures pour préserver le système racinaire central", "Attendre la tombée de la nuit pour tondre à ras sans soleil direct", "Arroser abondamment la pelouse juste avant de passer la tondeuse"], 
            exp: "Une herbe plus haute protège le sol du dessèchement et du soleil brûlant.", 
            wiki: "https://fr.wikipedia.org/wiki/Tonte_de_pelouse" 
        },
        { 
            q: "Quelle est la meilleure saison pour semer un nouveau gazon ?", 
            correct: "L'automne (septembre-octobre) grâce à la chaleur résiduelle du sol et l'humidité", 
            wrongs: ["Au début du printemps pour profiter de la fonte des neiges", "En hiver pour que les graines s'enfouissent naturellement avec le gel", "En plein mois de juillet pour forcer la germination rapide par forte chaleur"], 
            exp: "L'automne offre des conditions optimales pour la germination des graminées.", 
            wiki: "https://fr.wikipedia.org/wiki/Gazon" 
        },
        { 
            q: "À quoi sert l'opération de scarification sur une pelouse ?", 
            correct: "À éliminer le feutrage (mousse et déchets) pour aérer les racines", 
            wrongs: ["À tasser durablement les couches superficielles du sol", "À couper les racines trop profondes pour stimuler le tallage", "À appliquer un traitement fongicide en profondeur"], 
            exp: "La scarification permet à l'eau et aux nutriments de pénétrer à nouveau dans le sol.", 
            wiki: "https://fr.wikipedia.org/wiki/Scarification_(jardinage)" 
        },
        { 
            q: "Pourquoi dit-on qu'il faut laisser l'herbe coupée (mulching) parfois sur la pelouse ?", 
            correct: "Car elle se décompose et restitue de l'azote et de l'humidité au sol", 
            wrongs: ["Pour étouffer définitivement la repousse des mauvaises herbes", "Pour acidifier le sol et neutraliser le calcaire", "Pour attirer les vers de terre en surface en hiver"], 
            exp: "Le mulching de gazon est un engrais naturel gratuit et écologique.", 
            wiki: "https://fr.wikipedia.org/wiki/Mulching" 
        },
        { 
            q: "Comment éliminer les pâquerettes ou le pissenlit indésirables d'un gazon sans chimie ?", 
            correct: "Utiliser un désherbeur mécanique pour extraire toute la racine pivotante", 
            wrongs: ["Couper uniquement les fleurs au ras des feuilles chaque semaine", "Arroser sélectivement chaque rosette avec du purin de ortie", "Passer un rouleau lourd pour enfoncer les racines en profondeur"], 
            exp: "Le désherbage manuel à la gouge à asperge est idéal pour les racines pivots.", 
            wiki: "https://fr.wikipedia.org/wiki/Taraxacum" 
        },
        { 
            q: "Quelle est la fréquence idéale d'arrosage d'un gazon fraîchement semé ?", 
            correct: "Maintenir la terre constamment humide par de légères brumisations quotidiennes", 
            wrongs: ["Un arrosage massif tous les trois jours pour saturer le sous-sol", "Ne rien arroser pendant les deux premières semaines pour forcer la racine", "Arroser abondamment uniquement le soir à grande eau"], 
            exp: "La graine ne doit jamais sécher pendant le processus de germination.", 
            wiki: "https://fr.wikipedia.org/wiki/Gazon" 
        },
        { 
            q: "Qu'est-ce que le ray-grass dans un mélange de gazon ?", 
            correct: "Une graminée à pousse rapide idéale pour regarnir les zones abîmées", 
            wrongs: ["Un engrais vert à enfouir avant l'hiver", "Une mauvaise herbe parasite à éliminer d'urgence", "Une variété naine couvre-sol sans entretien"], 
            exp: "Le ray-grass s'installe très vite pour concurrencer les mauvaises herbes.", 
            wiki: "https://fr.wikipedia.org/wiki/Lolium_perenne" 
        },
        { 
            q: "Pourquoi faire un terreautage de pelouse au printemps ?", 
            correct: "Pour combler les petits creux, nourrir le sol et stimuler la densité du gazon", 
            wrongs: ["Pour modifier définitivement le pH de la terre en surface", "Pour empêcher l'eau de pluie de stagner en hiver", "Pour tuer les larves de parasites souterrains"], 
            exp: "Le terreautage améliore la structure superficielle du sol.", 
            wiki: "https://fr.wikipedia.org/wiki/Gazon" 
        }
    ];

    let clientTopics = [...baseTopics];
    while(clientTopics.length < 500) {
        let template = baseTopics[clientTopics.length % baseTopics.length];
        clientTopics.push({
            q: template.q,
            correct: template.correct,
            wrongs: [...template.wrongs],
            exp: template.exp,
            wiki: template.wiki
        });
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    let quizData = shuffleArray([...clientTopics]);
    let score = 0;
    let currentQuestionIndex = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let totalAnsweredCount = 0;
    let comboCount = 0;

    let jokers50Left = 2;
    let jokersTipLeft = 2;

    let timerInterval = null;
    let timeLeft = 15;
    const maxTime = 15;

    const avatars = ["👨‍🌾", "👩‍🌾", "👷‍♂️", "🚜", "🌿", "🧑‍🌾"];
    let avatarIdx = 0;

    const ranks = [
        { min: 0, title: "🌱 Graine de radis" },
        { min: 50, title: "🌿 Pousse tendre" },
        { min: 120, title: "🪴 Apprenti jardinier" },
        { min: 250, title: "🌻 Jardinier confirmé" },
        { min: 450, title: "🌳 Maître paysan" },
        { min: 700, title: "👑 Sage botaniste" }
    ];

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première Question Réussie", desc: "Donner votre première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Jardinier Qualifié", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Tenue", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "⚠️", title: "Erreur de Diagnostic", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "⭐", title: "Expert Vert", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "🔥", title: "En Feu !", desc: "Atteindre un combo de 5", unlocked: false },
        { id: "t7", icon: "🏆", title: "Expert Horticole", desc: "Atteindre 250 points", unlocked: false }
    ];

    function updateRankDisplay() {
        let currentRank = ranks[0].title;
        for (let r of ranks) {
            if (score >= r.min) currentRank = r.title;
        }
        document.getElementById("rank-display").innerText = currentRank;
    }

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_client_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_client_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_client_visit_date', today);
            score += 20;
            showAchievement("💧 Pointage du matin : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_client_visits_count', visitCount);
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_client_score')) score = parseInt(localStorage.getItem('jardin_client_score'));
        if (localStorage.getItem('jardin_client_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_client_pseudo');
        if (localStorage.getItem('jardin_client_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_client_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_client_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_client_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_client_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_client_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_client_avatar_count'));
        }
        if (localStorage.getItem('jardin_client_jokers_50')) jokers50Left = parseInt(localStorage.getItem('jardin_client_jokers_50'));
        if (localStorage.getItem('jardin_client_jokers_tip')) jokersTipLeft = parseInt(localStorage.getItem('jardin_client_jokers_tip'));

        trackDailyVisits();
        renderTrophiesList();
        updateScoreDisplay();
        updateJokersUI();
        loadNextQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_client_score', score);
        localStorage.setItem('jardin_client_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_client_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_client_avatar_count', avatarsChangesCount);
        localStorage.setItem('jardin_client_jokers_50', jokers50Left);
        localStorage.setItem('jardin_client_jokers_tip', jokersTipLeft);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_client_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        saveUserData();

        if (avatarsChangesCount >= 3) {
            unlockTrophy("t3");
        }
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = score + " Pts";
        updateRankDisplay();
    }

    function updateJokersUI() {
        document.getElementById("count-50").innerText = jokers50Left;
        document.getElementById("count-tip").innerText = jokersTipLeft;
        document.getElementById("joker-50").disabled = (jokers50Left <= 0);
        document.getElementById("joker-tip").disabled = (jokersTipLeft <= 0);
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = maxTime;
        const timerBar = document.getElementById("timer-bar");
        timerBar.style.width = "100%";
        timerBar.style.backgroundColor = "#38bdf8";

        timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            let percent = (timeLeft / maxTime) * 100;
            if (percent < 0) percent = 0;
            timerBar.style.width = percent + "%";

            if (percent < 30) {
                timerBar.style.backgroundColor = "#f87171";
            } else if (percent < 60) {
                timerBar.style.backgroundColor = "#facc15";
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleTimeOut();
            }
        }, 100);
    }

    function handleTimeOut() {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(b => b.disabled = true);

        consecutiveErrors++;
        consecutiveSuccess = 0;
        comboCount = 0;
        updateComboUI();

        const expBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");

        expBox.style.display = "block";
        pointsNotice.innerHTML = `⏰ Temps écoulé ! La bonne réponse était : <b>${currentQuestionObj.correct}</b>`;
        pointsNotice.style.color = "#f87171";
        explanationText.innerText = currentQuestionObj.exp;

        if (consecutiveErrors >= 3) unlockTrophy("t4");

        const wikiBtn = document.getElementById("wiki-btn");
        if (currentQuestionObj.wiki) {
            wikiBtn.href = currentQuestionObj.wiki;
            wikiBtn.style.display = "flex";
        }

        document.getElementById("next-btn").style.display = "block";
        saveUserData();
    }

    function loadNextQuestion() {
        if (currentQuestionIndex >= quizData.length) {
            currentQuestionIndex = 0;
            quizData = shuffleArray([...clientTopics]);
        }

        currentQuestionObj = quizData[currentQuestionIndex];
        document.getElementById("question").innerText = currentQuestionObj.q;

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        allOptions = shuffleArray(allOptions);
        shuffledOptionsCache = allOptions;

        allOptions.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";

        startTimer();
    }

    function selectAnswer(selectedIndex) {
        clearInterval(timerInterval);
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(b => b.disabled = true);

        const selectedText = shuffledOptionsCache[selectedIndex];
        const isCorrect = (selectedText === currentQuestionObj.correct);

        const expBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");

        expBox.style.display = "block";
        totalAnsweredCount++;

        if (isCorrect) {
            let timeBonus = Math.floor(timeLeft * 0.5);
            let earned = 10 + timeBonus;
            score += earned;
            consecutiveSuccess++;
            consecutiveErrors = 0;
            comboCount++;

            pointsNotice.innerHTML = `✅ Bonne réponse ! (+${earned} Pts avec bonus vitesse)`;
            pointsNotice.style.color = "#4ade80";

            unlockTrophy("t1");
            if (score >= 100) unlockTrophy("t2");
            if (score >= 250) unlockTrophy("t7");
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
            if (comboCount >= 5) unlockTrophy("t6");
        } else {
            consecutiveErrors++;
            consecutiveSuccess = 0;
            comboCount = 0;
            pointsNotice.innerHTML = `❌ Mauvaise réponse. La bonne réponse était : <b>${currentQuestionObj.correct}</b>`;
            pointsNotice.style.color = "#f87171";

            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        updateComboUI();
        explanationText.innerText = currentQuestionObj.exp;

        const wikiBtn = document.getElementById("wiki-btn");
        if (currentQuestionObj.wiki) {
            wikiBtn.href = currentQuestionObj.wiki;
            wikiBtn.style.display = "flex";
        }

        document.getElementById("next-btn").style.display = "block";
        updateScoreDisplay();
        saveUserData();
    }

    function updateComboUI() {
        const badge = document.getElementById("combo-badge");
        if (comboCount >= 2) {
            badge.innerText = "🔥 x" + comboCount;
            badge.style.display = "inline-block";
        } else {
            badge.style.display = "none";
        }
    }

    function useJoker50() {
        if (jokers50Left <= 0) return;
        jokers50Left--;
        updateJokersUI();

        const buttons = document.querySelectorAll(".option-btn");
        let hiddenCount = 0;
        buttons.forEach((btn) => {
            if (hiddenCount < 2 && btn.innerText !== currentQuestionObj.correct) {
                btn.classList.add("hidden-by-joker");
                hiddenCount++;
            }
        });
        saveUserData();
    }

    function useJokerTip() {
        if (jokersTipLeft <= 0) return;
        jokersTipLeft--;
        updateJokersUI();

        let wrongOptions = shuffledOptionsCache.filter(opt => opt !== currentQuestionObj.correct);
        let randomWrong = wrongOptions[Math.floor(Math.random() * wrongOptions.length)];

        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach((btn) => {
            if (btn.innerText === randomWrong) {
                btn.style.borderColor = "#f87171";
                btn.style.opacity = "0.5";
            }
        });
        saveUserData();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadNextQuestion();
    }

    function shareScore() {
        const text = `🌿 Mon score sur le Quiz Jardinier est de ${score} Pts ! Viens tester tes connaissances.`;
        if (navigator.share) {
            navigator.share({ title: 'Quiz Jardinier', text: text }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
