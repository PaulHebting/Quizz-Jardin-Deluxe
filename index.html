<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardin Quiz 🌿 (500 Questions)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 16px;
            font-weight: 800;
            color: #4ade80;
        }

        .daily-visits {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            position: relative;
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
            overflow: hidden;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .rank-badge {
            display: inline-block;
            background: #334155;
            color: #facc15;
            font-size: 10.5px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 3px;
        }

        .progress-box {
            margin-top: 5px;
            width: 100%;
        }

        .progress-bar-bg {
            background: #334155;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        .quiz-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 700;
        }

        .difficulty-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .diff-facile { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .diff-moyen { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .diff-difficile { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .question-text {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.3;
            margin-top: 4px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon {
            font-size: 24px;
        }

        .trophy-details h4 {
            font-size: 13px;
            color: #f8fafc;
            font-weight: 700;
        }

        .trophy-details p {
            font-size: 11px;
            color: #94a3b8;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }

        #achievement-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Succès</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 JARDIN QUIZ</div>
            <div class="daily-visits">📊 <span id="visits-count">1</span> visites aujourd'hui</div>
        </div>
        <div class="score-badge" id="score-display">0 Pts</div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()" title="Changer l'avatar">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="Jardinier123" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="rank-badge" id="rank-display">🌱 Débutant</div>
                
                <div class="progress-box">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="rank-progress-fill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="rank-next-title">Suivant: Apprenti</span>
                        <span id="rank-points-left">40 pts restants</span>
                    </div>
                </div>

                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="quiz-header-info">
                <div class="question-title">JARDINAGE</div>
                <div class="difficulty-tag diff-facile" id="diff-tag">Facile</div>
            </div>
            <div class="question-text" id="question">Chargement de la question...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">
                🌐 En savoir plus sur Wikipédia
            </a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">
                🚀 Question Suivante
            </button>
            <button class="share-btn" onclick="shareScore()">
                🔗 Inviter des amis & Partager mon score
            </button>
        </div>
    </div>
</div>

<script>
    let baseQuiz = [
        { 
            q: "Quelle est la principale utilité des œillets d'Inde plantés au milieu du potager ?", 
            correct: "Ils repoussent naturellement les pucerons et les nématodes.", 
            wrongs: ["Ils attirent massivement les taupes", "Ils font fuir les abeilles et bourdons", "Ils empêchent les tomates de mûrir"],
            exp: "Les racines de l'œillet d'Inde sécrètent une substance nématicide naturelle qui assainit la terre autour des cultures sensibles comme les tomates.",
            wiki: "https://fr.wikipedia.org/wiki/Œillet_d%27Inde",
            difficulty: "facile"
        },
        { 
            q: "À quel moment de la journée est-il conseillé d'arroser ses plantes en été ?", 
            correct: "Tôt le matin ou tard le soir", 
            wrongs: ["En plein midi sous le soleil", "Uniquement la nuit sous la pluie", "À minuit pile avec de l'eau glacée"],
            exp: "Cela évite l'évaporation trop rapide des gouttes d'eau sous l'effet de la chaleur et prévient les risques de brûlure des feuilles.",
            wiki: "https://fr.wikipedia.org/wiki/Arrosage",
            difficulty: "facile"
        },
        { 
            q: "Quel est l'intérêt principal du compostage des déchets organiques ?", 
            correct: "Transformer les déchets en un terreau riche et fertile", 
            wrongs: ["Produire du gaz pour chauffer la maison", "Créer des répulsifs anti-moustiques", "Éliminer définitivement les vers de terre"],
            exp: "Le processus de décomposition aérobie par les micro-organismes permet de recycler les nutriments pour nourrir les sols pauvres.",
            wiki: "https://fr.wikipedia.org/wiki/Compostage_(biodéchets)",
            difficulty: "facile"
        }
    ];

    let quizData = [...baseQuiz];
    const plantesCatalogue = [
        "carotte", "tomate", "pomme de terre", "fraise", "salade", "courgette", "haricot", "radis", "poireau", "oignon",
        "ail", "échalote", "concombre", "melon", "pastèque", "aubergine", "poivron", "piment", "potiron", "citrouille",
        "courge", "artichaut", "asperge", "rhubarbe", "épinard", "oseille", "bette", "céleri", "fenouil", "chou",
        "brocoli", "chou-fleur", "navet", "betterave", "panais", "patate douce", "pois", "lentille", "fève", "maïs",
        "tournesol", "lavande", "romarin", "thym", "basilic", "menthe", "ciboulette", "persil", "coriandre", "estragon",
        "sauge", "laurier", "origan", "aneth", "cerfeuil", "camomille", "verveine", "mélisse", "vigne", "pommier",
        "poirier", "pêcher", "abricotier", "cerisier", "prunier", "amandier", "figuier", "noyer", "chataignier", "noisette"
    ];

    const typesQuestions = [
        {
            q: (p) => `Quel type de sol convient le mieux pour réussir la culture de ${p} ?`,
            correct: "Un sol meuble, riche en humus et bien drainé",
            wrongs: ["De la roche pure sans aucun nutriment", "De l'asphalte bitumé compact", "Du sable marin stérile et salé"],
            exp: (p) => `La culture de ${p} prospère idéalement dans une terre vivante et structurée qui retient l'humidité sans l'accumuler excessivement.`
        },
        {
            q: (p) => `Quelle exposition lumineuse privilégier pour installer ${p} au jardin ?`,
            correct: "Une bonne luminosité adaptée (soleil ou mi-ombre selon la saison)",
            wrongs: ["L'obscurité totale d'une cave sombre", "Des lampadaires halogènes 24h/24", "Une ombre épaisse et permanente"],
            exp: (p) => `L'ensoleillement influence directement la photosynthèse et la saveur des récoltes de ${p}.`
        },
        {
            q: (p) => `Quel entretien régulier est particulièrement recommandé pour ${p} ?`,
            correct: "Un paillage régulier du pied et un désherbage soigneux",
            wrongs: ["L'application d'une peinture plastique", "Une taille drastique au ras du sol chaque semaine", "Un lavage au savon de Marseille quotidien"],
            exp: (p) => `Le paillage permet de conserver l'humidité naturelle du sol tout en limitant l'apparition des mauvaises herbes autour de ${p}.`
        }
    ];

    // Génération aléatoire et variée des 500 questions pour éviter les suites répétitives
    let diffs = ["facile", "moyen", "difficile"];
    for (let i = 1; i < 500; i++) {
        let randPlant = plantesCatalogue[Math.floor(Math.random() * plantesCatalogue.length)];
        let randType = typesQuestions[Math.floor(Math.random() * typesQuestions.length)];
        let randDiff = diffs[Math.floor(Math.random() * diffs.length)];
        
        quizData.push({
            q: randType.q(randPlant),
            correct: randType.correct,
            wrongs: randType.wrongs,
            exp: randType.exp(randPlant),
            wiki: `https://fr.wikipedia.org/wiki/${randPlant.charAt(0).toUpperCase() + randPlant.slice(1)}`,
            difficulty: randDiff
        });
    }

    let score = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let correctButtonIndex = 0;

    const avatars = ["👨‍🌾", "👩‍🌾", "🌻", "🌵", "🌴", "🧑‍🌾"];
    let avatarIdx = 0;

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première Pousse", desc: "Donner sa première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Main Verte", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Fashion Victim", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "🐹", title: "Taupe en Chef", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "🐞", title: "Chasseur de Pucerons", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "🌻", title: "Botaniste Fou", desc: "Répondre à 10 questions", unlocked: false },
        { id: "t7", icon: "🌳", title: "Maître de la Jungle", desc: "Atteindre 250 points", unlocked: false }
    ];

    // Les grades et les niveaux de difficulté autorisés selon les points
    const ranks = [
        { min: 0, max: 40, title: "🌱 Débutant", nextTitle: "Apprenti", allowedDiff: ["facile"] },
        { min: 40, max: 100, title: "🌿 Apprenti Jardinier", nextTitle: "Confirmé", allowedDiff: ["facile", "moyen"] },
        { min: 100, max: 200, title: "🪴 Jardinier Confirmé", nextTitle: "Expert", allowedDiff: ["facile", "moyen", "difficile"] },
        { min: 200, max: 400, title: "🌳 Expert Botanique", nextTitle: "Maître", allowedDiff: ["moyen", "difficile"] },
        { min: 400, max: Infinity, title: "🏆 Maître du Jardin", nextTitle: "Niveau Max", allowedDiff: ["difficile"] }
    ];

    function getCurrentRank() {
        const currentScore = Math.max(0, score);
        let currentRank = ranks[0];
        for (let r of ranks) {
            if (currentScore >= r.min) currentRank = r;
        }
        return currentRank;
    }

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_visit_date', today);
            score += 20;
            showAchievement("💧 Bonus quotidien : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_visits_count', visitCount);
        document.getElementById("visits-count").innerText = visitCount;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_score')) score = parseInt(localStorage.getItem('jardin_score'));
        if (localStorage.getItem('jardin_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_pseudo');
        if (localStorage.getItem('jardin_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_avatar_count'));
        }
        trackDailyVisits();
        renderTrophiesList();
        updateRankProgress();
        loadFilteredRandomQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_score', score);
        localStorage.setItem('jardin_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_avatar_count', avatarsChangesCount);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        if (avatarsChangesCount >= 3) unlockTrophy("t3");
        saveUserData();
    }

    let totalAnsweredCount = 0;
    function checkTrophies() {
        if (score >= 10) unlockTrophy("t1");
        if (score >= 100) unlockTrophy("t2");
        if (totalAnsweredCount >= 10) unlockTrophy("t6");
        if (score >= 250) unlockTrophy("t7");
    }

    function updateRankProgress() {
        const currentScore = Math.max(0, score);
        let currentRank = getCurrentRank();

        document.getElementById("rank-display").innerText = currentRank.title;
        document.getElementById("score-display").innerText = `${score} Pts`;

        const fillBar = document.getElementById("rank-progress-fill");
        const nextTitleElem = document.getElementById("rank-next-title");
        const pointsLeftElem = document.getElementById("rank-points-left");

        if (currentRank.max === Infinity) {
            fillBar.style.width = "100%";
            nextTitleElem.innerText = "Niveau Max !";
            pointsLeftElem.innerText = "🏆";
        } else {
            const range = currentRank.max - currentRank.min;
            const progress = currentScore - currentRank.min;
            const percentage = Math.min(100, Math.max(0, (progress / range) * 100));
            const pointsNeeded = currentRank.max - currentScore;

            fillBar.style.width = `${percentage}%`;
            nextTitleElem.innerText = `Suivant: ${currentRank.nextTitle}`;
            pointsLeftElem.innerText = `${pointsNeeded} pts restants`;
        }
        checkTrophies();
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadFilteredRandomQuestion() {
        const currentRank = getCurrentRank();
        // Filtre les questions en fonction des difficultés autorisées par le grade actuel
        let eligibleQuestions = quizData.filter(q => currentRank.allowedDiff.includes(q.difficulty));
        if (eligibleQuestions.length === 0) eligibleQuestions = quizData;

        const randomIndex = Math.floor(Math.random() * eligibleQuestions.length);
        currentQuestionObj = eligibleQuestions[randomIndex];
        
        document.getElementById("question").innerText = currentQuestionObj.q;
        
        const diffTag = document.getElementById("diff-tag");
        diffTag.className = `difficulty-tag diff-${currentQuestionObj.difficulty}`;
        diffTag.innerText = currentQuestionObj.difficulty.toUpperCase();

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        shuffledOptionsCache = shuffleArray(allOptions);
        correctButtonIndex = shuffledOptionsCache.indexOf(currentQuestionObj.correct);

        const optsContainer = document.getElementById("options");
        optsContainer.innerHTML = "";

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        shuffledOptionsCache.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        totalAnsweredCount++;
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctButtonIndex) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const isCorrect = (selectedIndex === correctButtonIndex);
        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        
        if (isCorrect) {
            let ptsEarned = currentQuestionObj.difficulty === 'difficile' ? 30 : (currentQuestionObj.difficulty === 'moyen' ? 20 : 10);
            score += ptsEarned;
            pointsNotice.innerText = `✅ Bonne réponse ! (+${ptsEarned} pts)`;
            pointsNotice.style.color = "#4ade80";
            
            consecutiveSuccess++;
            consecutiveErrors = 0;
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
        } else {
            score = Math.max(0, score - 5);
            pointsNotice.innerText = `❌ Mauvaise réponse (-5 pts)`;
            pointsNotice.style.color = "#f87171";
            
            consecutiveErrors++;
            consecutiveSuccess = 0;
            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        explanationText.innerText = currentQuestionObj.exp;
        explanationBox.style.display = "block";

        const wikiBtn = document.getElementById("wiki-btn");
        if (currentQuestionObj.wiki) {
            wikiBtn.href = currentQuestionObj.wiki;
            wikiBtn.style.display = "flex";
        }

        document.getElementById("next-btn").style.display = "block";

        updateRankProgress();
        saveUserData();
    }

    function nextQuestion() {
        loadFilteredRandomQuestion();
    }

    function shareScore() {
        const pseudo = document.getElementById("username-input").value || "Un jardinier";
        const text = `${pseudo} a atteint ${score} points sur Jardin Quiz 🌿 !`;
        if (navigator.share) {
            navigator.share({ title: 'Jardin Quiz', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
