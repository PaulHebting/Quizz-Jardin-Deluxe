<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Jardinier Professionnel</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .app { width: 100%; max-width: 400px; background: #1e293b; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .score { text-align: center; font-size: 1.2rem; color: #4ade80; margin-bottom: 20px; }
        .question { font-size: 1.1rem; margin-bottom: 20px; font-weight: bold; }
        .btn { display: block; width: 100%; padding: 12px; margin: 8px 0; background: #334155; border: 1px solid #475569; color: white; border-radius: 10px; cursor: pointer; text-align: left; }
        .btn:hover { background: #475569; }
        .correct { background: #166534 !important; }
        .wrong { background: #991b1b !important; }
        #next-btn { display: none; background: #2563eb; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="app">
    <div class="score" id="score">Score: 0</div>
    <div class="question" id="question">Chargement...</div>
    <div id="options"></div>
    <button id="next-btn" class="btn" onclick="next()">Question suivante</button>
</div>

<script>
    const data = [
        { q: "Utilité du binage ?", correct: "Rompre la capillarité", wrongs: ["Tasser la terre", "Chauffer le sol"] },
        { q: "Division ciboulette ?", correct: "Séparer la souche", wrongs: ["Couper les tiges", "Planter les fleurs"] }
        // ... (Ajoutez ici le reste de vos 200 questions)
    ];

    let current = 0, score = 0;

    function render() {
        const q = data[current];
        document.getElementById('question').innerText = q.q;
        const container = document.getElementById('options');
        container.innerHTML = '';
        [q.correct, ...q.wrongs].sort(() => Math.random() - 0.5).forEach(opt => {
            const b = document.createElement('button');
            b.className = 'btn';
            b.innerText = opt;
            b.onclick = () => {
                document.querySelectorAll('.btn').forEach(btn => btn.disabled = true);
                if (opt === q.correct) { b.classList.add('correct'); score += 10; }
                else { b.classList.add('wrong'); }
                document.getElementById('score').innerText = "Score: " + score;
                document.getElementById('next-btn').style.display = 'block';
            };
            container.appendChild(b);
        });
    }

    function next() {
        current = (current + 1) % data.length;
        document.getElementById('next-btn').style.display = 'none';
        render();
    }

    render();
</script>
</body>
</html>
