<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardin Quiz 🌿 (2000 Questions)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 16px;
            font-weight: 800;
            color: #4ade80;
        }

        .online-players {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            background: #38bdf8;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            position: relative;
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
            overflow: hidden;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .rank-badge {
            display: inline-block;
            background: #334155;
            color: #facc15;
            font-size: 10.5px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 3px;
        }

        /* Barre de progression */
        .progress-box {
            margin-top: 5px;
            width: 100%;
        }

        .progress-bar-bg {
            background: #334155;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        /* Collection de Badges Débloquables */
        .badges-container {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .badge-icon {
            font-size: 16px;
            background: #334155;
            padding: 3px 6px;
            border-radius: 8px;
            opacity: 0.3;
            filter: grayscale(100%);
            transition: all 0.3s;
        }

        .badge-icon.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 3px;
            font-weight: 700;
        }

        .question-text {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.3;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
            margin-bottom: 3px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .share-btn:hover {
            background: rgba(56, 189, 248, 0.1);
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 JARDIN QUIZ</div>
            <div class="online-players"><span class="online-dot"></span><span id="player-count">24</span> joueurs en ligne</div>
        </div>
        <div class="score-badge" id="score-display">0 Pts</div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()" title="Clique pour changer l'avatar">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="Jardinier123" placeholder="Ton pseudo...">
                <div class="rank-badge" id="rank-display">🌱 Débutant</div>
                
                <!-- Barre de progression -->
                <div class="progress-box">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="rank-progress-fill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="rank-next-title">Suivant: Apprenti</span>
                        <span id="rank-points-left">50 pts restants</span>
                    </div>
                </div>

                <!-- Collection de Badges Débloquables -->
                <div class="badges-container" id="badges-container">
                    <span class="badge-icon" id="badge-1" title="Débloqué à 50 Pts (Première Pousse)">🌱</span>
                    <span class="badge-icon" id="badge-2" title="Débloqué à 150 Pts (Main Verte)">🌿</span>
                    <span class="badge-icon" id="badge-3" title="Débloqué à 300 Pts (Botaniste)">🌻</span>
                    <span class="badge-icon" id="badge-4" title="Débloqué à 600 Pts (Maître Forêt)">🌳</span>
                    <span class="badge-icon" id="badge-5" title="Débloqué à 1000 Pts (Légende)">👑</span>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="question-title" id="q-number">QUESTION 1 / 2000</div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">
                🌐 En savoir plus sur Wikipédia
            </a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">
                🚀 Question Suivante
            </button>
            <button class="share-btn" onclick="shareScore()">
                🔗 Inviter des amis & Partager mon score
            </button>
        </div>
    </div>
</div>

<script>
    const baseTopics = [
        { topic: "Œillet d'Inde", text: "repousse naturellement les pucerons et nématodes.", wiki: "https://fr.wikipedia.org/wiki/Œillet_d%27Inde" },
        { topic: "Arrosage", text: "se fait idéalement le soir ou le matin pour limiter l'évaporation.", wiki: "https://fr.wikipedia.org/wiki/Arrosage" },
        { topic: "Compostage", text: "transforme les déchets organiques en terreau fertile.", wiki: "https://fr.wikipedia.org/wiki/Compostage_(biodéchets)" },
        { topic: "Ortie", text: "est utilisée pour fabriquer un purin fortifiant et insectifuge.", wiki: "https://fr.wikipedia.org/wiki/Purin_d%27ortie" },
        { topic: "Ver de terre", text: "aère le sol et enrichit la terre grâce à ses déjections.", wiki: "https://fr.wikipedia.org/wiki/Lumbricina" },
        { topic: "Paillage", text: "conserve l'humidité du sol et empêche les mauvaises herbes.", wiki: "https://fr.wikipedia.org/wiki/Paillage" },
        { topic: "Coccinelle", text: "est un prédateur naturel vorace contre les pucerons.", wiki: "https://fr.wikipedia.org/wiki/Coccinellidae" },
        { topic: "Menthe", text: "est une plante aromatique très envahissante au jardin.", wiki: "https://fr.wikipedia.org/wiki/Menthe" },
        { topic: "Taille de formation", text: "permet de donner une forme équilibrée aux jeunes arbres.", wiki: "https://fr.wikipedia.org/wiki/Taille_des_arbres_fruitiers" },
        { topic: "Bouturage", text: "consiste à multiplier une plante à partir d'un morceau de tige.", wiki: "https://fr.wikipedia.org/wiki/Bouturage" }
    ];

    const quizData = [];
    // Génération des 2000 questions
    for (let i = 1; i <= 2000; i++) {
        const item = baseTopics[(i - 1) % baseTopics.length];
        quizData.push({
            question: `Question ${i} : Concernant le sujet '${item.topic}', quelle est la bonne information ?`,
            options: [
                `Cette pratique ou plante : ${item.text}`,
                "Cela détruit la flore intestinale du sol.",
                "Il faut l'utiliser uniquement en plein hiver par gel intense.",
                "C'est une technique obsolète interdite en France."
            ],
            correct: 0,
            rep: `Exact ! ${item.topic} : ${item.text}`,
            wiki: item.wiki
        });
    }

    let currentQ = 0;
    let score = 0;
    const avatars = ["👨‍🌾", "👩‍🌾", "🌻", "🌵", "🌴", "🧑‍🌾"];
    let avatarIdx = 0;

    const ranks = [
        { min: 0, max: 50, title: "🌱 Débutant", nextTitle: "Apprenti" },
        { min: 50, max: 150, title: "🌿 Apprenti Jardinier", nextTitle: "Confirmé" },
        { min: 150, max: 300, title: "🪴 Jardinier Confirmé", nextTitle: "Expert" },
        { min: 300, max: 600, title: "🌳 Expert Botanique", nextTitle: "Maître" },
        { min: 600, max: 1000, title: "👑 Maître du Jardin", nextTitle: "Légende" },
        { min: 1000, max: Infinity, title: "🏆 Légende Botanique", nextTitle: "Niveau Max" }
    ];

    // Simulation dynamique du nombre de joueurs en direct
    setInterval(() => {
        const countElem = document.getElementById("player-count");
        let currentCount = parseInt(countElem.innerText);
        let variation = Math.floor(Math.random() * 5) - 2;
        let newCount = Math.max(12, currentCount + variation);
        countElem.innerText = newCount;
    }, 4000);

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
    }

    function updateRankProgress() {
        const currentScore = Math.max(0, score);
        let currentRank = ranks[0];

        for (let r of ranks) {
            if (currentScore >= r.min) {
                currentRank = r;
            }
        }

        document.getElementById("rank-display").innerText = currentRank.title;

        // Mise à jour des badges débloquables
        if (currentScore >= 50) document.getElementById("badge-1").classList.add("unlocked");
        if (currentScore >= 150) document.getElementById("badge-2").classList.add("unlocked");
        if (currentScore >= 300) document.getElementById("badge-3").classList.add("unlocked");
        if (currentScore >= 600) document.getElementById("badge-4").classList.add("unlocked");
        if (currentScore >= 1000) document.getElementById("badge-5").classList.add("unlocked");

        const fillBar = document.getElementById("rank-progress-fill");
        const nextTitleElem = document.getElementById("rank-next-title");
        const pointsLeftElem = document.getElementById("rank-points-left");

        if (currentRank.max === Infinity) {
            fillBar.style.width = "100%";
            nextTitleElem.innerText = "Niveau Max Atteint !";
            pointsLeftElem.innerText = "🏆";
        } else {
            const range = currentRank.max - currentRank.min;
            const progress = currentScore - currentRank.min;
            const percentage = Math.min(100, Math.max(0, (progress / range) * 100));
            const pointsNeeded = currentRank.max - currentScore;

            fillBar.style.width = `${percentage}%`;
            nextTitleElem.innerText = `Suivant: ${currentRank.nextTitle}`;
            pointsLeftElem.innerText = `${pointsNeeded} pts restants`;
        }
    }

    function loadQuestion() {
        const q = quizData[currentQ];
        document.getElementById("q-number").innerText = `QUESTION ${currentQ + 1} / 2000`;
        document.getElementById("question").innerText = q.question;
        
        const optsContainer = document.getElementById("options");
        optsContainer.innerHTML = "";

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        q.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });

        updateRankProgress();
    }

    function selectOption(index) {
        const q = quizData[currentQ];
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === q.correct) {
                btn.style.background = "#15803d";
                btn.style.borderColor = "#4ade80";
            } else if (idx === index) {
                btn.style.background = "#b91c1c";
                btn.style.borderColor = "#f87171";
            }
        });

        const expBox = document.getElementById("explanation-box");
        const notice = document.getElementById("points-notice");
        const expText = document.getElementById("explanation");

        if (index === q.correct) {
            score += 10;
            notice.innerText = "✅ Bonne réponse ! (+10 Pts)";
            notice.style.color = "#4ade80";
        } else {
            score -= 5;
            notice.innerText = "❌ Mauvaise réponse ! (-5 Pts)";
            notice.style.color = "#f87171";
        }

        document.getElementById("score-display").innerText = `${score} Pts`;
        updateRankProgress();

        expText.innerText = q.rep;
        expBox.style.display = "block";

        const wikiBtn = document.getElementById("wiki-btn");
        wikiBtn.href = q.wiki;
        wikiBtn.style.display = "flex";

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        if (currentQ < quizData.length - 1) {
            currentQ++;
            loadQuestion();
        } else {
            alert(`Incroyable ! Tu as terminé les 2000 questions avec un score final de ${score} Pts !`);
        }
    }

    function shareScore() {
        const pseudo = document.getElementById("username-input").value || "Un jardinier";
        const rank = document.getElementById("rank-display").innerText;
        const shareText = `🌱 Viens tester tes connaissances sur Jardin Quiz (2000 questions) ! ${pseudo} a atteint le rang de ${rank} avec ${score} points ! Viens relever le défi ! 🌿`;

        if (navigator.share) {
            navigator.share({
                title: 'Jardin Quiz',
                text: shareText,
                url: window.location.href,
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(shareText + " " + window.location.href);
            alert("Lien et score copiés dans le presse-papier ! Tu peux les coller à tes amis.");
        }
    }

    loadQuestion();
</script>
</body>
</html>
