<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardin Quiz 🌿 (Édition Niveaux)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 16px;
            font-weight: 800;
            color: #4ade80;
        }

        .daily-visits {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            position: relative;
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
            overflow: hidden;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .rank-badge {
            display: inline-block;
            background: #334155;
            color: #facc15;
            font-size: 10.5px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 3px;
        }

        .progress-box {
            margin-top: 5px;
            width: 100%;
        }

        .progress-bar-bg {
            background: #334155;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        .quiz-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 700;
        }

        .difficulty-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .diff-facile { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .diff-moyen { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .diff-difficile { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .question-text {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.3;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
            margin-bottom: 3px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .share-btn:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon {
            font-size: 24px;
        }

        .trophy-details h4 {
            font-size: 13px;
            color: #f8fafc;
            font-weight: 700;
        }

        .trophy-details p {
            font-size: 11px;
            color: #94a3b8;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }

        #achievement-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Succès</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 JARDIN QUIZ</div>
            <div class="daily-visits">📊 <span id="visits-count">1</span> visites aujourd'hui</div>
        </div>
        <div class="score-badge" id="score-display">0 Pts</div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()" title="Changer l'avatar">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="Jardinier123" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="rank-badge" id="rank-display">🌱 Débutant</div>
                
                <div class="progress-box">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="rank-progress-fill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="rank-next-title">Suivant: Apprenti</span>
                        <span id="rank-points-left">50 pts restants</span>
                    </div>
                </div>

                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="quiz-header-info">
                <div class="question-title" id="q-number">QUESTION 1</div>
                <div class="difficulty-tag diff-facile" id="diff-tag">Facile</div>
            </div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">
                🌐 En savoir plus sur Wikipédia
            </a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">
                🚀 Question Suivante
            </button>
            <button class="share-btn" onclick="shareScore()">
                🔗 Inviter des amis & Partager mon score
            </button>
        </div>
    </div>
</div>

<script>
    // Base de questions classées par niveau de difficulté
    const quizData = [
        // --- FACILE (Débutant / Apprenti) ---
        { 
            q: "Quelle est la principale utilité des œillets d'Inde plantés au milieu du potager ?", 
            correct: "Ils repoussent naturellement les pucerons et les nématodes.", 
            wrongs: ["Ils attirent massivement les taupes", "Ils font fuir les abeilles et bourdons", "Ils empêchent les tomates de mûrir"],
            wiki: "https://fr.wikipedia.org/wiki/Œillet_d%27Inde",
            difficulty: "facile"
        },
        { 
            q: "À quel moment de la journée est-il conseillé d'arroser ses plantes en été pour limiter l'évaporation ?", 
            correct: "Tôt le matin ou tard le soir", 
            wrongs: ["En plein midi sous le soleil", "Uniquement la nuit sous la pluie", "À minuit pile avec de l'eau glacée"],
            wiki: "https://fr.wikipedia.org/wiki/Arrosage",
            difficulty: "facile"
        },
        { 
            q: "Quel est l'intérêt principal du compostage des déchets organiques ?", 
            correct: "Transformer les déchets en un terreau riche et fertile", 
            wrongs: ["Produire du gaz pour chauffer la maison", "Créer des répulsifs anti-moustiques", "Éliminer définitivement les vers de terre"],
            wiki: "https://fr.wikipedia.org/wiki/Compostage_(biodéchets)",
            difficulty: "facile"
        },
        { 
            q: "Quel rôle primordial jouent les vers de terre dans un jardin ?", 
            correct: "Ils aèrent la terre et structurent le sol grâce à leurs déjections", 
            wrongs: ["Ils mangent toutes les racines des salades", "Ils polluent l'eau d'arrosage en surface", "Ils attirent les taupes carnivores"],
            wiki: "https://fr.wikipedia.org/wiki/Lumbricina",
            difficulty: "facile"
        },
        { 
            q: "Pourquoi les jardiniers aiment-ils voir des coccinelles dans leur potager ?", 
            correct: "Ce sont des prédateurs voraces qui mangent les pucerons", 
            wrongs: ["Elles pollinisent les fleurs de tomates", "Elles fertilisent le sol comme du fumier", "Elles chassent les oiseaux nuisibles"],
            wiki: "https://fr.wikipedia.org/wiki/Coccinellidae",
            difficulty: "facile"
        },
        {
            q: "Quel légume-racine est célèbre pour sa teneur en carotène et sa couleur orange ?",
            correct: "La carotte",
            wrongs: ["Le radis noir", "Le navet blanc", "Le panais"],
            wiki: "https://fr.wikipedia.org/wiki/Carotte",
            difficulty: "facile"
        },

        // --- MOYEN (Confirmé / Expert) ---
        { 
            q: "Que fabrique-t-on traditionnellement à partir de la macération d'orties ?", 
            correct: "Un purin fortifiant et insectifuge pour les plantes", 
            wrongs: ["Un désherbant chimique total", "Un engrais radioactif pour bulbes", "Un sirop sucré pour les fruits"],
            wiki: "https://fr.wikipedia.org/wiki/Purin_d%27ortie",
            difficulty: "moyen"
        },
        { 
            q: "Pourquoi met-on du paillage (BRF, paille, feuilles) au pied des plantations ?", 
            correct: "Pour conserver l'humidité et empêcher les mauvaises herbes", 
            wrongs: ["Pour attirer les escargots géants", "Pour chauffer excessivement les racines", "Pour colorer le sol en violet"],
            wiki: "https://fr.wikipedia.org/wiki/Paillage",
            difficulty: "moyen"
        },
        { 
            q: "Quelle est la particularité bien connue de la menthe au jardin ?", 
            correct: "C'est une plante très envahissante qui colonise tout l'espace", 
            wrongs: ["Elle meurt dès qu'on l'arrose un peu trop", "Elle attire les guêpes frelons", "Elle ne pousse que dans le désert"],
            wiki: "https://fr.wikipedia.org/wiki/Menthe",
            difficulty: "moyen"
        },
        {
            q: "Quelle est la meilleure période de l'année pour tailler la majorité des rosiers ?",
            correct: "À la fin de l'hiver (février-mars)",
            wrongs: ["En plein mois d'août sous canicule", "Juste après les premières gelées d'octobre", "Le jour de Noël"],
            wiki: "https://fr.wikipedia.org/wiki/Rosier",
            difficulty: "moyen"
        },
        {
            q: "Comment appelle-t-on la maladie cryptogamique qui recouvre les feuilles d'un dépôt blanc farineux ?",
            correct: "L'oïdium (ou blanc)",
            wrongs: ["La rouille", "Le mildiou", "La pourriture grise"],
            wiki: "https://fr.wikipedia.org/wiki/Oïdium",
            difficulty: "moyen"
        },
        {
            q: "Quel engrais naturel riche en azote et potasse obtient-on en faisant macérer des feuilles de consoude ?",
            correct: "Du purin de consoude",
            wrongs: ["Du thé de menthe", "De la décoction d'ail", "Du sirop d'érable"],
            wiki: "https://fr.wikipedia.org/wiki/Consoude",
            difficulty: "moyen"
        },

        // --- DIFFICILE (Maître / Légende) ---
        { 
            q: "Quel est l'objectif de la taille de formation sur un jeune arbre fruitier ?", 
            correct: "Lui donner une structure équilibrée et robuste", 
            wrongs: ["Le faire grandir deux fois plus vite", "Empêcher définitivement l'arbre de faire des fruits", "Le transformer en arbuste d'intérieur"],
            wiki: "https://fr.wikipedia.org/wiki/Taille_des_arbres_fruitiers",
            difficulty: "difficile"
        },
        { 
            q: "En quoi consiste la technique du bouturage ?", 
            correct: "Multiplier une plante à partir d'un fragment de tige ou de feuille", 
            wrongs: ["Planter uniquement des graines rares", "Couper toutes les racines pour forcer la floraison", "Greffer un légume sur un arbre"],
            wiki: "https://fr.wikipedia.org/wiki/Bouturage",
            difficulty: "difficile"
        },
        {
            q: "Qu'appelle-t-on le 'BRF' (Bois Raméal Fragmenté) très utilisé en permaculture ?",
            correct: "Des jeunes rameaux de bois broyés",
            wrongs: ["De la poussière de charbon", "Un engrais chimique puissant", "Du sable de rivière filtré"],
            wiki: "https://fr.wikipedia.org/wiki/Bois_raméal_fragmenté",
            difficulty: "difficile"
        },
        {
            q: "Quelle est l'utilité du purin d'ail pulvérisé au jardin ?",
            correct: "Il agit comme un répulsif naturel contre les champignons et insectes",
            wrongs: ["Il sert à sucrer les fruits", "Il attire les papillons rares", "Il colore les fleurs en bleu"],
            wiki: "https://fr.wikipedia.org/wiki/Ail",
            difficulty: "difficile"
        },
        {
            q: "Qu'est-ce qu'un sol argileux ?",
            correct: "Un sol compact qui retient beaucoup l'eau et colle aux chaussures",
            wrongs: ["Un sol sablonneux qui s'effondre tout de suite", "Un sol très léger rempli de cailloux blancs", "Un sol stérile composé de cendres"],
            wiki: "https://fr.wikipedia.org/wiki/Argile",
            difficulty: "difficile"
        },
        {
            q: "Quelle plante aromatique méditerranéenne craint l'excès d'humidité en hiver ?",
            correct: "La lavande",
            wrongs: ["Le cresson de fontaine", "La fougère des marais", "Le papyrus"],
            wiki: "https://fr.wikipedia.org/wiki/Lavande",
            difficulty: "difficile"
        }
    ];

    let currentQ = 0;
    let score = 0;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let activeQuizList = [];
    let shuffledOptionsCache = [];
    let correctButtonIndex = 0;

    const avatars = ["👨‍🌾", "👩‍🌾", "🌻", "🌵", "🌴", "🧑‍🌾"];
    let avatarIdx = 0;

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première Pousse", desc: "Donner sa première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Main Verte", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Fashion Victim", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "🐹", title: "Taupe en Chef", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "🐞", title: "Chasseur de Pucerons", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "🌻", title: "Botaniste Fou", desc: "Répondre à 20 questions", unlocked: false },
        { id: "t7", icon: "🌳", title: "Maître de la Jungle", desc: "Atteindre 500 points", unlocked: false }
    ];

    const ranks = [
        { min: 0, max: 50, title: "🌱 Débutant", nextTitle: "Apprenti", allowedDiff: ["facile"] },
        { min: 50, max: 150, title: "🌿 Apprenti Jardinier", nextTitle: "Confirmé", allowedDiff: ["facile"] },
        { min: 150, max: 300, title: "🪴 Jardinier Confirmé", nextTitle: "Expert", allowedDiff: ["facile", "moyen"] },
        { min: 300, max: 600, title: "🌳 Expert Botanique", nextTitle: "Maître", allowedDiff: ["facile", "moyen"] },
        { min: 600, max: 1000, title: "👑 Maître du Jardin", nextTitle: "Légende", allowedDiff: ["facile", "moyen", "difficile"] },
        { min: 1000, max: Infinity, title: "🏆 Légende Botanique", nextTitle: "Niveau Max", allowedDiff: ["facile", "moyen", "difficile"] }
    ];

    function getCurrentRank() {
        const currentScore = Math.max(0, score);
        let currentRank = ranks[0];
        for (let r of ranks) {
            if (currentScore >= r.min) currentRank = r;
        }
        return currentRank;
    }

    function filterQuestionsByRank() {
        const rank = getCurrentRank();
        // Filtre les questions selon les difficultés autorisées pour le rang actuel
        activeQuizList = quizData.filter(q => rank.allowedDiff.includes(q.difficulty));
        if (activeQuizList.length === 0) activeQuizList = quizData; // Sécurité
    }

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_visit_date', today);
            score += 20;
            showAchievement("💧 Bonus quotidien : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_visits_count', visitCount);
        document.getElementById("visits-count").innerText = visitCount;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_score')) score = parseInt(localStorage.getItem('jardin_score'));
        if (localStorage.getItem('jardin_q')) currentQ = parseInt(localStorage.getItem('jardin_q'));
        if (localStorage.getItem('jardin_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_pseudo');
        if (localStorage.getItem('jardin_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_avatar_count'));
        }
        trackDailyVisits();
        filterQuestionsByRank();
        renderTrophiesList();
    }

    function saveUserData() {
        localStorage.setItem('jardin_score', score);
        localStorage.setItem('jardin_q', currentQ);
        localStorage.setItem('jardin_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_avatar_count', avatarsChangesCount);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        if (avatarsChangesCount >= 3) unlockTrophy("t3");
        saveUserData();
    }

    function checkTrophies() {
        if (score >= 10) unlockTrophy("t1");
        if (score >= 100) unlockTrophy("t2");
        if (currentQ >= 20) unlockTrophy("t6");
        if (score >= 500) unlockTrophy("t7");
    }

    function updateRankProgress() {
        const currentScore = Math.max(0, score);
        let currentRank = getCurrentRank();

        document.getElementById("rank-display").innerText = currentRank.title;
        document.getElementById("score-display").innerText = `${score} Pts`;

        const fillBar = document.getElementById("rank-progress-fill");
        const nextTitleElem = document.getElementById("rank-next-title");
        const pointsLeftElem = document.getElementById("rank-points-left");

        if (currentRank.max === Infinity) {
            fillBar.style.width = "100%";
            nextTitleElem.innerText = "Niveau Max !";
            pointsLeftElem.innerText = "🏆";
        } else {
            const range = currentRank.max - currentRank.min;
            const progress = currentScore - currentRank.min;
            const percentage = Math.min(100, Math.max(0, (progress / range) * 100));
            const pointsNeeded = currentRank.max - currentScore;

            fillBar.style.width = `${percentage}%`;
            nextTitleElem.innerText = `Suivant: ${currentRank.nextTitle}`;
            pointsLeftElem.innerText = `${pointsNeeded} pts restants`;
        }
        checkTrophies();
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadQuestion() {
        filterQuestionsByRank(); // Met à jour les questions selon le rang actuel
        if (currentQ >= activeQuizList.length) currentQ = 0;
        
        const q = activeQuizList[currentQ];
        document.getElementById("q-number").innerText = `QUESTION ${currentQ + 1} / ${activeQuizList.length}`;
        document.getElementById("question").innerText = q.q;
        
        // Affichage de l'étiquette de difficulté
        const diffTag = document.getElementById("diff-tag");
        diffTag.className = `difficulty-tag diff-${q.difficulty}`;
        diffTag.innerText = q.difficulty.toUpperCase();

        let allOptions = [q.correct, ...q.wrongs];
        shuffledOptionsCache = shuffleArray(allOptions);
        correctButtonIndex = shuffledOptionsCache.indexOf(q.correct);

        const optsContainer = document.getElementById("options");
        optsContainer.innerHTML = "";

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        shuffledOptionsCache.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });

        updateRankProgress();
    }

    function selectOption(index) {
        const q = activeQuizList[currentQ];
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctButtonIndex) {
                btn.style.background = "#15803d";
                btn.style.borderColor = "#4ade80";
            } else if (idx === index) {
                btn.style.background = "#b91c1c";
                btn.style.borderColor = "#f87171";
            }
        });

        const expBox = document.getElementById("explanation-box");
        const notice = document.getElementById("points-notice");
        const expText = document.getElementById("explanation");

        // Bonus de points selon la difficulté
        let pointsEarned = q.difficulty === 'difficile' ? 20 : (q.difficulty === 'moyen' ? 15 : 10);
        let pointsLost = 5;

        if (index === correctButtonIndex) {
            score += pointsEarned;
            consecutiveSuccess++;
            consecutiveErrors = 0;
            notice.innerText = `✅ Bonne réponse ! (+${pointsEarned} Pts)`;
            notice.style.color = "#4ade80";
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
        } else {
            score -= pointsLost;
            consecutiveErrors++;
            consecutiveSuccess = 0;
            notice.innerText = `❌ Mauvaise réponse ! (-${pointsLost} Pts)`;
            notice.style.color = "#f87171";
            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        updateRankProgress();
        saveUserData();

        expText.innerText = `Le saviez-vous : ${q.correct}`;
        expBox.style.display = "block";

        const wikiBtn = document.getElementById("wiki-btn");
        wikiBtn.href = q.wiki;
        wikiBtn.style.display = "flex";

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        if (currentQ < activeQuizList.length - 1) {
            currentQ++;
            saveUserData();
            loadQuestion();
        } else {
            currentQ = 0;
            saveUserData();
            loadQuestion();
        }
    }

    function shareScore() {
        const pseudo = document.getElementById("username-input").value || "Un jardinier";
        const rank = document.getElementById("rank-display").innerText;
        const shareText = `🌱 Viens tester tes connaissances sur Jardin Quiz ! ${pseudo} a atteint le rang de ${rank} avec ${score} points ! Viens relever le défi ! 🌿`;

        if (navigator.share) {
            navigator.share({
                title: 'Jardin Quiz',
                text: shareText,
                url: window.location.href,
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(shareText + " " + window.location.href);
            alert("Lien et score copiés dans le presse-papier ! Tu peux les coller à tes amis.");
        }
    }

    loadUserData();
    loadQuestion();
</script>
</body>
</html>
