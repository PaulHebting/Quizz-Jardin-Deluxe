<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Jardinier - Expert Pro 🌿</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        @keyframes flashSuccess {
            0% { background: #1e293b; }
            50% { background: rgba(34, 197, 94, 0.4); transform: scale(1.01); }
            100% { background: #1e293b; transform: scale(1); }
        }

        @keyframes flashError {
            0% { background: #1e293b; transform: translateX(0); }
            20% { transform: translateX(-6px); background: rgba(239, 68, 68, 0.4); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); background: #1e293b; }
        }

        .mobile-container.success-anim {
            animation: flashSuccess 0.5s ease;
        }

        .mobile-container.error-anim {
            animation: flashError 0.5s ease;
        }

        /* Top Profile Section */
        .top-profile-section {
            background: #0f172a;
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .user-profile-card {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
            min-width: 0;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 2px solid #4ade80;
            flex-shrink: 0;
        }

        .profile-info {
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .profile-name-display {
            color: #f8fafc;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-subtitle {
            font-size: 10px;
            color: #38bdf8;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Progress Bar & Points Section */
        .progress-bar-container {
            background: #111827;
            padding: 10px 16px;
            border-bottom: 1px solid #334155;
        }

        .progress-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .rank-title {
            font-size: 11px;
            color: #facc15;
            font-weight: 700;
        }

        .score-badges-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .combo-badge {
            background: rgba(249, 115, 22, 0.15);
            color: #fdba74;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            border: 1px solid rgba(249, 115, 22, 0.3);
            display: none;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 3px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #facc15);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Jokers Bar */
        .jokers-bar {
            display: flex;
            gap: 6px;
            padding: 8px 16px 0 16px;
            background: #1e293b;
        }

        .joker-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .joker-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #334155;
            color: #94a3b8;
        }

        /* App Content */
        .app-content {
            flex: 1;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .quiz-box {
            background: #334155;
            border-radius: 12px;
            padding: 12px;
        }

        .question-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .question-text {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 8px 10px;
            border-radius: 9px;
            font-size: 11.5px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.25;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #4ade80;
        }

        .option-btn.hidden-by-joker {
            display: none;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 9px;
            padding: 8px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 11px;
            color: #e2e8f0;
            line-height: 1.25;
            margin-top: 2px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 11.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 7px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11.5px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 7px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11.5px;
            cursor: pointer;
            width: 100%;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon { font-size: 24px; }
        .trophy-details h4 { font-size: 13px; color: #f8fafc; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #94a3b8; }

        .profile-edit-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .avatar-selection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .avatar-option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            font-size: 28px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .avatar-option-btn.selected {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
        }

        .form-input {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 700;
            padding: 10px;
            border-radius: 10px;
            outline: none;
        }

        .form-input:focus {
            border-color: #38bdf8;
        }

        .save-profile-btn {
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container" id="main-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <!-- Modale Trophées -->
    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Grades</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <!-- Modale Espace Profil -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">⚙️ Mon Espace Profil</div>
                <button class="close-modal" onclick="toggleProfileModal()">×</button>
            </div>
            <div class="profile-edit-body">
                <div class="form-group">
                    <label class="form-label">Changer de prénom / pseudo :</label>
                    <input type="text" class="form-input" id="modal-username-input" placeholder="Ton prénom...">
                </div>
                <div class="form-group">
                    <label class="form-label">Choisir ton avatar :</label>
                    <div class="avatar-selection-grid" id="avatar-grid"></div>
                </div>
                <button class="save-profile-btn" onclick="saveProfileChanges()">Enregistrer les modifications</button>
            </div>
        </div>
    </div>

    <!-- 1. INTERFACE PROFIL EN HAUT (Avatar + Prénom) -->
    <div class="top-profile-section">
        <div class="user-profile-card" onclick="toggleProfileModal()">
            <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            <div class="profile-info">
                <div class="profile-name-display" id="profile-name-view">JardinierExpert</div>
                <div class="profile-subtitle">⚙️ Cliquer pour modifier le profil</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
        </div>
    </div>

    <!-- 2. BARRE DE PROGRESSION + SYSTEME DE POINTS (En dessous) -->
    <div class="progress-bar-container">
        <div class="progress-top-row">
            <div class="rank-title" id="rank-display">🌱 Graine de radis</div>
            <div class="score-badges-group">
                <div class="combo-badge" id="combo-badge">🔥 x0</div>
                <div class="score-badge" id="score-display">0 Pts</div>
            </div>
        </div>
        <div class="progress-info">
            <span id="progress-text-label">Grade suivant : Pousse tendre</span>
            <span id="progress-percent-label">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- Barre des Jokers -->
    <div class="jokers-bar">
        <button class="joker-btn" id="joker-50" onclick="useJoker50()">✂️ 50/50 (<span id="count-50">2</span>)</button>
        <button class="joker-btn" id="joker-tip" onclick="useJokerTip()">💡 Indice (<span id="count-tip">2</span>)</button>
    </div>

    <!-- Contenu du Quiz -->
    <div class="app-content">
        <div class="quiz-box">
            <div class="question-title">❓ QUESTION CLIENT</div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

<script>
    // Base de questions avec des distracteurs plus réalistes et nuancés
    const uniqueQuizPool = [
        { 
            q: "Un client vous demande : 'À quelle fréquence faut-il tondre ma pelouse au printemps ?'", 
            correct: "Toutes les semaines pour stimuler l'épaississement du gazon sans l'épuiser", 
            wrongs: [
                "Toutes les 3 semaines pour ne pas stresser le gazon en phase de démarrage", 
                "Uniquement en été quand l'herbe pousse le plus vite et drastiquement", 
                "Toutes les deux semaines en coupant à ras pour éliminer les vieilles tiges"
            ], 
            exp: "Au printemps, la pousse est rapide. Une coupe hebdomadaire favorise un tapis dense et vigoureux.", 
            wiki: "https://fr.wikipedia.org/wiki/Tonte_de_pelouse" 
        },
        { 
            q: "Un propriétaire s'inquiète de la mousse dans sa pelouse orientée au nord. Que lui conseillez-vous ?", 
            correct: "De scarifier le gazon pour éliminer la mousse et d'amender la terre avec un peu de chaux", 
            wrongs: [
                "D'appliquer un engrais riche en azote pour étouffer naturellement la mousse en surface", 
                "De tondre beaucoup plus court et d'arroser régulièrement pour forcer le gazon à percer", 
                "De semer du trèfle blanc par-dessus pour concurrencer et éliminer la mousse"
            ], 
            exp: "La mousse se développe sur les sols acides et humides. La scarification et un chaulage modéré aident grandement.", 
            wiki: "https://fr.wikipedia.org/wiki/Scarification_(horticulture)" 
        },
        { 
            q: "Un client demande : 'Quelle est la profondeur idéale pour creuser le trou de plantation d'un arbuste ?'", 
            correct: "Environ deux fois la taille de la motte en largeur, et la même profondeur", 
            wrongs: [
                "Trois fois la profondeur de la motte pour enterrer complètement le collet de la plante", 
                "Exactement de la même dimension que la motte pour éviter que la terre ne bouge", 
                "Profond mais très étroit pour maintenir la motte serrée contre la terre d'origine"
            ], 
            exp: "Ameublir la terre en largeur aide les jeunes racines à s'étaler facilement sans s'asphyxier.", 
            wiki: "https://fr.wikipedia.org/wiki/Plantation" 
        },
        { 
            q: "Que répondre à un client qui souhaite savoir pourquoi il faut 'praliner' les racines nues avant de planter ?", 
            correct: "Pour enrober les racines d'un mélange d'argile et d'eau afin d'éviter qu'elles ne se dessèchent", 
            wrongs: [
                "Pour fertiliser directement le sol avec un apport massif d'azote organique immédiat", 
                "Pour alourdir l'arbre et l'empêcher de pencher sous l'effet du vent dominant", 
                "Pour désinfecter les racines contre les champignons du sol avant la mise en terre"
            ], 
            exp: "Le pralinage protège la jeune plante contre la déshydratation et stimule le départ des radicelles.", 
            wiki: "https://fr.wikipedia.org/wiki/Pralinage" 
        },
        { 
            q: "Un client vous demande : 'À quel moment de la journée dois-je arroser mon potager en été ?'", 
            correct: "Tôt le matin ou tard le soir après le coucher du soleil", 
            wrongs: [
                "Uniquement à midi pour que l'eau profite immédiatement de la chaleur du sol", 
                "En continu toute la journée grâce à un système goutte-à-goutte permanent", 
                "Tous les trois jours en grande quantité mais uniquement en surface"
            ], 
            exp: "Cela limite l'évaporation de l'eau et évite l'effet loupe qui brûlerait le feuillage.", 
            wiki: "https://fr.wikipedia.org/wiki/Arrosage" 
        },
        { 
            q: "Que répondre à un client qui se plaint de devoir arroser trop souvent ses massifs ?", 
            correct: "Installez un paillage organique au pied des plantes pour retenir l'humidité", 
            wrongs: [
                "Bêcher la surface tous les matins pour casser la croûte de terre battue", 
                "Apporter un engrais chimique puissant pour stimuler la rétention d'eau interne", 
                "Planter un gazon dense autour pour absorber le surplus de chaleur du sol"
            ], 
            exp: "Le paillis (mulching) protège la terre du rayonnement direct et réduit l'évaporation de plus de 50%.", 
            wiki: "https://fr.wikipedia.org/wiki/Paillis" 
        },
        { 
            q: "Un client inquiet vous montre des jeunes pousses couvertes de petits insectes collants et de miellat. Qu'est-ce que c'est ?", 
            correct: "Des pucerons", 
            wrongs: [
                "Des cochenilles farineuses résistantes aux traitements classiques", 
                "Des acariens rouges provoqués par un excès d'humidité ambiante", 
                "Des thrips attirés par les carences en azote du sol"
            ], 
            exp: "Les pucerons pullulent au printemps sur les tiges tendres et sucent la sève de la plante.", 
            wiki: "https://fr.wikipedia.org/wiki/Aphidoidea" 
        },
        { 
            q: "Que conseiller à un client dont les feuilles de rosiers se couvrent d'une poudre blanche caractéristique ?", 
            correct: "Traiter contre l'oïdium (maladie du blanc) avec du purin de prêle ou un produit adapté", 
            wrongs: [
                "Apporter un engrais riche en azote pour fortifier rapidement le feuillage", 
                "Laisser faire la nature car cette poudre disparaît d'elle-même en hiver", 
                "Tailler sévèrement toutes les branches à ras du sol immédiatement"
            ], 
            exp: "L'oïdium est un champignon favorisé par l'alternance de nuits fraîches et de journées chaudes.", 
            wiki: "https://fr.wikipedia.org/wiki/O%C3%AFdium" 
        },
        { 
            q: "Un client vous demande : 'Quelle plante puis-je installer dans un coin de jardin totalement ombragé ?'", 
            correct: "Des fougères, des hostas ou des hortensias", 
            wrongs: [
                "Des géraniums zonales aux couleurs vives et lumineuses", 
                "Des rosiers buissons remontants pour illuminer le coin", 
                "Des agrumes en pot comme le calamondin"
            ], 
            exp: "Les hortensias et les hostas apprécient la mi-ombre et redoutent le plein soleil brûlant.", 
            wiki: "https://fr.wikipedia.org/wiki/Hydrangea" 
        },
        { 
            q: "Un client souhaite créer un massif très ensoleillé et sec. Que lui suggérez-vous ?", 
            correct: "De la lavande, du romarin et du ciste", 
            wrongs: [
                "Des hortensias paniculés nécessitant un sol frais et riche", 
                "Des graminées de berges de rivières très gourmandes en eau", 
                "Des hostas à large feuillage persistant d'ombre"
            ], 
            exp: "Ces plantes méditerranéennes supportent parfaitement la sécheresse et adorent le plein soleil.", 
            wiki: "https://fr.wikipedia.org/wiki/Lavande" 
        },
        {
        q: "Quel est le rôle principal des vers de terre dans la biologie du sol ?",
        correct: "Aérer le sol et transformer la matière organique en humus stable",

    { q: "Quelle exposition exige un rosier paysager pour fleurir abondamment ?", correct: "Le plein soleil (minimum 6 heures de soleil direct par jour)", wrongs: ["L'ombre complète d'un mur nord", "L'intérieur d'une cave sombre", "Sous un auvent sans lumière"], exp: "Le rosier est une plante héliophile : sans soleil, il végète et attrape plus facilement des maladies.", wiki: "https://fr.wikipedia.org/wiki/_Rosier" },
    { q: "Quel type de plante privilégie-t-on pour végétaliser un mur orienté plein Nord ?", correct: "Le lierre (Hedera) ou la vigne vierge d'ombre", wrongs: ["Le bougainvillier", "Le laurier-rose", "Le cactus"], exp: "Le mur nord ne reçoit jamais de soleil direct, il faut des plantes sciaphiles (qui aiment l'ombre).", wiki: "https://fr.wikipedia.org/wiki/Plante_d%27ombre" },
    { q: "Les conifères nains de rocaille se plaisent-ils plutôt au soleil ou à l'ombre ?", correct: "Au soleil ou à mi-ombre", wrongs: ["Exclusivement dans le noir total", "Sous l'eau", "Dans une pièce sans fenêtre"], exp: "La plupart des conifères ont besoin de lumière pour garder un port dense et une belle couleur.", wiki: "https://fr.wikipedia.org/wiki/Conifère" },
    { q: "Comment se comporte un buis (Buxus) face à l'exposition ?", correct: "Il s'adapte aussi bien au soleil qu'à l'ombre", wrongs: ["Il meurt obligatoirement au soleil", "Il ne pousse que dans l'obscurité absolue", "Il exige un ensoleillement tropical"], exp: "Le buis est très polyvalent en termes d'exposition, ce qui en fait un roi des parcs.", wiki: "https://fr.wikipedia.org/wiki/Buxus" },
    { q: "Les tomates (en tant que culture de production au jardin) ont besoin de quoi comme exposition ?", correct: "Plein soleil et un maximum de chaleur", wrongs: ["Ombre fraîche permanente", "Lumière artificielle bleue uniquement", "Exposition nord rigoureuse"], exp: "Originaire des zones chaudes, la tomate a besoin de soleil pour mûrir et développer ses sucres.", wiki: "https://fr.wikipedia.org/wiki/Tomate" },
    { q: "Où planter un érable du Japon (Acer palmatum) pour éviter que son feuillage délicat ne grille ?", correct: "À la mi-ombre, protégé des vents brûlants et du soleil de l'après-midi", wrongs: ["En plein soleil de midi en plein été", "Dans le noir complet d'une cave", "Au fond d'une piscine"], exp: "Le soleil direct d'été brûle le bout des feuilles de l'érable du Japon (phénomène d'échaudage).", wiki: "https://fr.wikipedia.org/wiki/Acer_palmatum" },
    { q: "Quelle exposition convient le mieux aux pelouses sportives ou d'agrément standard ?", correct: "Le plein soleil ou une très légère mi-ombre", wrongs: ["L'ombre dense sous des sapins", "L'obscurité d'un tunnel", "Un sous-bois sombre"], exp: "Les graminées à gazon ont besoin de photosynthèse intense pour rester denses et vigoureuses.", wiki: "https://fr.wikipedia.org/wiki/Gazon" },
    { q: "Où positionner de préférence un camélia dans un aménagement paysager de jardin ?", correct: "À la mi-ombre, à l'abri des vents froids et du soleil brûlant du midi", wrongs: ["En plein désert rocailleux", "Dans un local sombre sans fenêtres", "Au milieu d'une pelouse exposée plein sud sans ombrage"], exp: "Le camélia aime la fraîcheur et craint le soleil direct qui brûle ses boutons floraux.", wiki: "https://fr.wikipedia.org/wiki/Camellia" },
    { q: "Quelle est l'exposition de prédilection des yuccas et agaves en rocaille paysagère ?", correct: "Le plein soleil et une luminosité maximale", wrongs: ["L'ombre profonde d'un sous-bois", "Une cave humide", "Sous l'eau d'un bassin"], exp: "Ce sont des plantes xérophytes gorgées de soleil qui pourrissent à l'ombre humide.", wiki: "https://fr.wikipedia.org/wiki/Yucca" },
    { q: "Les fougères arborescentes de jardin nécessitent quelle exposition ?", correct: "L'ombrage et l'humidité constante", wrongs: ["Le plein soleil caniculaire", "Le vent sec permanent", "Un sol sablonneux aride"], exp: "Elles proviennent de sous-bois humides et redoutent le soleil direct.", wiki: "https://fr.wikipedia.org/wiki/Fougère" },
    { q: "Comment réagit un laurier-rose (Nerium oleander) face à l'ensoleillement ?", correct: "Il exige le plein soleil pour s'épanouir et fleurir abondamment", wrongs: ["Il dépérit immédiatement au soleil", "Il ne pousse que dans l'obscurité", "Il craint la chaleur"], exp: "Le laurier-rose est le symbole des ambiances méditerranéennes en plein cagnard.", wiki: "https://fr.wikipedia.org/wiki/Laurier-rose" },
    { q: "Où installer de préférence une haie de Photinia 'Red Robin' pour exalter la couleur rouge de ses jeunes pousses ?", correct: "Au soleil ou à mi-ombre lumineuse", wrongs: ["Dans l'obscurité totale d'un garage", "Au fond d'un puits", "Sous l'eau"], exp: "La lumière stimule la coloration vive rouge cuivrée des nouvelles feuilles du Photinia.", wiki: "https://fr.wikipedia.org/wiki/Photinia" },

    // --- Plantations & Techniques horticoles ---
    { q: "Qu'appelle-t-on une plante 'en conteneur' ?", correct: "Une plante cultivée et vendue dans un pot en plastique rigide", wrongs: ["Une plante enfermée dans une caisse en bois pour le transport maritime", "Une plante artificielle", "Une plante sans racines"], exp: "Elle peut se planter toute l'année (hors périodes de gel ou de forte canicule).", wiki: "https://fr.wikipedia.org/wiki/Pépinière" },
    { q: "Qu'est-ce qu'une plante en 'racines nues' ?", correct: "Un végétal arraché en pépinière, vendu sans terre autour des racines", wrongs: ["Une plante malade qu'on a dépouillée", "Une plante d'intérieur tropicale", "Une graine germée"], exp: "La plantation en racines nues se fait obligatoirement en période de repos végétatif (novembre à mars).", wiki: "https://fr.wikipedia.org/wiki/Racines_nues" },
    { q: "Qu'appelle-t-on le 'chignon racinaire' dans un conteneur ?", correct: "Un enchevêtrement serré de racines qui tournent en rond au fond du pot", wrongs: ["Une maladie du tronc", "Une coiffure pour tailler les arbustes", "Un type de greffe"], exp: "Il faut impérativement griffer ou défaire ce chignon à la plantation pour forcer les racines à s'étaler.", wiki: "https://fr.wikipedia.org/wiki/Racine" },
    { q: "À quelle hauteur doit se situer le 'collet' d'un arbre lors de la plantation ?", correct: "Exactement au niveau du sol (ni trop enterré, ni trop haut)", wrongs: ["50 cm sous la terre", "Totalement à l'air libre sur un monticule de 1 mètre", "C'est sans importance"], exp: "Enterrer le collet provoque l'asphyxie et le pourrissement du tronc de l'arbre.", wiki: "https://fr.wikipedia.org/wiki/Collet_(botanique)" },
    { q: "Qu'est-ce qu'une cuvette de plantation ?", correct: "Une dépression creusée en terre autour du végétal pour retenir l'eau d'arrosage", wrongs: ["Un seau en plastique posé à côté", "Un plat pour transporter les fleurs", "Une bassine pour laver les outils"], exp: "Elle permet à l'eau de bien s'infiltrer vers la motte lors des premiers arrosages.", wiki: "https://fr.wikipedia.org/wiki/Plantation" },
    { q: "Pourquoi réalise-t-on un 'pralinage' des racines nues avant plantation ?", correct: "Pour enrober les racines d'une boue argileuse protectrice et stimulante", wrongs: ["Pour colorer les racines en rouge", "Pour empoisonner les parasites du sol", "Pour alourdir l'arbre"], exp: "Le pralin évite le dessèchement des racines à l'air libre et favorise le contact avec la terre.", wiki: "https://fr.wikipedia.org/wiki/Pralinage" },
    { q: "Quelle est la règle d'or pour la distance de plantation d'une haie par rapport à la limite de propriété (en l'absence de PLU spécifique) ?", correct: "Minimum 2 mètres pour les arbres de plus de 2 mètres de haut, 0,50 m pour les autres", wrongs: ["Toujours exactement à 10 cm", "Au milieu de la route", "Interdit de planter près d'une limite"], exp: "Règle classique du Code civil français (art. 671) concernant les plantations mitoyennes.", wiki: "https://fr.wikipedia.org/wiki/Mitoyenneté_en_droit_français" },
    { q: "Qu'est-ce que le 'haubanage' d'un grand arbre nouvellement planté ?", correct: "Un système de fixations par câbles ou sangles pour maintenir l'arbre droit face au vent", wrongs: ["Une technique pour tailler les branches basses", "Un engrais liquide puissant", "Une méthode d'arrosage automatique"], exp: "Il stabilise l'arbre le temps que ses racines s'ancrent solidement dans le sol.", wiki: "https://fr.wikipedia.org/wiki/Haubanage" },
    { q: "Pourquoi tremper une motte de plante en conteneur dans l'eau avant de la mettre en terre ?", correct: "Pour saturer la motte en eau et chasser l'air contenu dans le substrat sec", wrongs: ["Pour laver les feuilles", "Pour tuer les insectes", "Pour colorer le pot"], exp: "Une motte sèche a du mal à réabsorber l'eau du jardin par la suite.", wiki: "https://fr.wikipedia.org/wiki/Plantation" },
    { q: "Qu'appelle-t-on une 'motte enrobée de toile de jute et grillage' ?", correct: "Un arbre de grand développement vendu avec sa terre d'origine protégée", wrongs: ["Un bulbe emballé dans du papier cadeau", "Une plante artificielle de paysagiste", "Une bouture d'intérieur"], exp: "La toile de jute et le grillage se biodigèrent ou s'enlèvent partiellement selon les consignes du pépiniériste.", wiki: "https://fr.wikipedia.org/wiki/Pépinière" },
    { q: "Quel est l'intérêt d'incorporer du terreau horticole enrichi dans le trou de plantation ?", correct: "Améliorer la structure du sol et stimuler la reprise racinaire initiale", wrongs: ["Rendre le sol étanche comme du ciment", "Changer la couleur des fleurs en bleu fluo", "Empêcher l'arbre de grandir"], exp: "Il apporte de la matière organique souple et aérée autour de la motte.", wiki: "https://fr.wikipedia.org/wiki/Terreau" },
    { q: "Qu'est-ce qu'un tuteurage 'en 3 tuteurs' (trépied) pour un arbre de plein vent ?", correct: "Trois tuteurs plantés en triangle autour de l'arbre reliés par des traverses et sangles", wrongs: ["Trois arbres plantés dans le même trou", "Un tuteur cassé en trois morceaux", "Un système électrique"], exp: "Il protège efficacement les grands sujets contre les vents violents venant de toutes directions.", wiki: "https://fr.wikipedia.org/wiki/Tuteurage" },
    { q: "Pourquoi évite-t-on de planter des arbres trop profondément dans le sol ?", correct: "Pour éviter l'asphyxie des racines et le pourrissement du collet", wrongs: ["Pour que l'arbre grandisse moins vite", "Pour économiser de la terre", "Pour voir les racines dépasser"], exp: "Les racines ont besoin d'oxygène présent dans les couches superficielles du sol.", wiki: "https://fr.wikipedia.org/wiki/Plantation" },
    { q: "Qu'appelle-t-on la période de 'repos végétatif' indispensable pour les plantations en racines nues ?", correct: "L'hiver (généralement de novembre à mars)", wrongs: ["Le mois d'août en plein soleil", "La canicule de juillet", "Le printemps en pleine floraison"], exp: "Pendant cette période, la sève descend et l'arbre supporte l'arrachage sans stress.", wiki: "https://fr.wikipedia.org/wiki/Caducité" },
    { q: "Qu'est-ce qu'un sujet 'topiaire' d'exception en pépinière ?", correct: "Un arbuste taillé artistiquement depuis des années (formes géométriques ou animales)", wrongs: ["Un arbre malade qu'on a coupé", "Une plante rampante sauvage", "Une simple graine en pot"], exp: "Ce sont des pièces maîtresses hautement décoratives pour les paysagistes.", wiki: "https://fr.wikipedia.org/wiki/Art_topiaire" },

    // --- Tailles & Entretien des végétaux ---
    { q: "À quelle période de l'année doit-on tailler la majorité des arbustes à floraison printanière (ex: Forsythia) ?", correct: "Juste après leur floraison (en fin de printemps)", wrongs: ["En plein cœur de l'hiver", "Au milieu de l'été", "Jamais"], exp: "Ils font leurs boutons floraux sur le bois de l'année précédente ; tailler en hiver supprimerait la floraison.", wiki: "https://fr.wikipedia.org/wiki/Taille_des_arbres_et_des_arbustes" },
    { q: "Quand taille-t-on les arbustes à floraison estivale (ex: Buddleia, Hibiscus) ?", correct: "À la fin de l'hiver ou au tout début du printemps", wrongs: ["En plein mois de juin", "Juste avant l'été", "Tous les soirs d'août"], exp: "Ils fleurissent sur le bois de l'année en cours, une taille hivernale stimule de vigoureuses pousses florales.", wiki: "https://fr.wikipedia.org/wiki/Taille_des_arbres_et_des_arbustes" },
    { q: "Qu'est-ce qu'une 'taille en igloo' ou 'boule' pratiquée sur un buis ou un troène ?", correct: "Une taille topiaire décorative géométrique", wrongs: ["Une taille d'urgence contre le gel", "Une coupe radicale au ras du sol", "Une technique de greffe"], exp: "La taille topiaire structure les jardins paysagers à la française.", wiki: "https://fr.wikipedia.org/wiki/Art_topiaire" },
    { q: "Quel est l'objectif d'une 'taille de formation' sur un jeune arbre fruitier ?", correct: "Léguer à l'arbre une charpente solide, équilibrée et bien ventilée", wrongs: ["L'empêcher de produire des fruits à vie", "Le faire grandir le plus vite possible en hauteur", "Le tordre artistiquement"], exp: "Elle définit la future silhouette de l'arbre (gobelet, pyramide, etc.).", wiki: "https://fr.wikipedia.org/wiki/Arboriculture_fruitière" },
    { q: "Qu'appelle-t-on les 'gourmands' (ou rejetons) sur un arbre fruitier ?", correct: "Des pousses vigoureuses verticales qui partent du pied ou du tronc et épuisent l'arbre", wrongs: ["Les fruits les plus sucrés de l'arbre", "Les racines principales", "Les feuilles malades"], exp: "Il faut les supprimer régulièrement pour rediriger la sève vers les branches productives.", wiki: "https://fr.wikipedia.org/wiki/Gourmand_(botanique)" },
    { q: "Pourquoi est-il conseillé de désinfecter les lames de son sécateur entre deux tailles de plantes différentes ?", correct: "Pour éviter de propager des maladies bactériennes ou virales d'une plante à l'autre", wrongs: ["Pour que le sécateur coupe mieux", "Pour éliminer la mauvaise odeur de la sève", "Pour colorer le métal"], exp: "L'alcool à brûler ou l'alcool isopropylique empêche la transmission de pathogènes.", wiki: "https://fr.wikipedia.org/wiki/Sécateur" },
    { q: "Qu'est-ce qu'une haie 'libre' ou 'champêtre' par rapport à une haie monospécifique taillée au cordeau ?", correct: "Une haie composée de multiples essences d'arbustes variées taillées de façon plus souple", wrongs: ["Une haie artificielle en plastique", "Une haie qui n'a pas besoin d'eau", "Une haie interdite en ville"], exp: "Elle favorise la biodiversité paysagère tout en protégeant des regards.", wiki: "https://fr.wikipedia.org/wiki/Haie" },
    { q: "Quelle est la règle pour tailler une haie de thuyas ou de cyprès (conifères) ?", correct: "Ne jamais tailler dans le bois vieux (sec et sans aiguilles vertes), sinon il ne repartira pas", wrongs: ["Les raser complètement jusqu'au tronc tous les 10 ans", "Ne jamais les tailler du tout", "Les tailler uniquement sous la pluie"], exp: "Les conifères ne reforment pas de bourgeons sur le bois âgé dépourvu de verdure.", wiki: "https://fr.wikipedia.org/wiki/Cyprès" },
    { q: "Qu'appelle-t-on 'l'éclaircissage' dans la taille des arbres fruitiers à pépins (pommiers/poiriers) ?", correct: "Supprimer des fruits surnuméraires en début de saison pour obtenir de plus beaux calibres", wrongs: ["Éclairer l'arbre avec des projecteurs la nuit", "Couper toutes les feuilles", "Enlever la moitié des racines"], exp: "L'arbre ne peut nourrir correctement qu'un nombre limité de fruits de qualité.", wiki: "https://fr.wikipedia.org/wiki/Éclaircissage" },
    { q: "Quel outil utilise-t-on de préférence pour tailler net une haie de paysagiste rectiligne ?", correct: "Un taille-haie thermique ou sur batterie", wrongs: ["Une tondeuse à gazon", "Une hache", "Un couteau de cuisine"], exp: "Le taille-haie permet une coupe nette, rapide et plane sur de grands linéaires.", wiki: "https://fr.wikipedia.org/wiki/Taille-haie" },
    { q: "Qu'est-ce qu'une haie 'marcescente' (composée de charmes ou de hêtres) ?", correct: "Une haie dont les feuilles mortes sèchent sur l'arbre en hiver et ne tombent qu'au printemps à l'apparition des nouvelles", wrongs: ["Une haie qui perd toutes ses feuilles dès septembre", "Une haie artificielle en métal", "Une haie qui change de couleur en bleu"], exp: "Elle offre un brise-vue naturel très apprécié en paysagisme tout au long de l'hiver.", wiki: "https://fr.wikipedia.org/wiki/Marcescence" },
    { q: "Quand doit-on tailler les graminées ornementales (comme les Stipas ou Miscanthus) ?", correct: "À la sortie de l'hiver (février-mars), avant le départ des nouvelles pousses", wrongs: ["En plein milieu de l'été sous le soleil", "Tous les soirs d'octobre", "Jamais de la vie"], exp: "Leur feuillage sec protège la souche du froid hivernal avant d'être rabattu proprement au ras du sol.", wiki: "https://fr.wikipedia.org/wiki/Poaceae" },
    { q: "Quel est l'intérêt d'une 'taille de rajeunissement' sur un vieux lilas ou un vieil arbuste dégarni de la base ?", correct: "Recouper sévèrement les vieux bois pour stimuler l'émission de rejets vigoureux depuis le pied", wrongs: ["Tuer définitivement la plante", "La faire grandir plus vite en hauteur", "Changer la couleur de ses fleurs"], exp: "Cela permet de relancer complètement la vigueur et la floraison d'un sujet fatigué.", wiki: "https://fr.wikipedia.org/wiki/Taille_des_arbres_et_des_arbustes" },
    { q: "Qu'appelle-t-on une coupe 'en biseau' lors de la taille d'une branche d'arbre ?", correct: "Une coupe inclinée orientée vers l'extérieur pour que l'eau de pluie perle sans stagner sur la plaie", wrongs: ["Une coupe plate et bien horizontale", "Une coupe en pointe de crayon", "Une entaille verticale profonde"], exp: "Cela évite le pourrissement du bois par stagnation d'eau au centre de la coupe.", wiki: "https://fr.wikipedia.org/wiki/Élagage" },
    { q: "Quel outil utilise-t-on pour scier de grosses branches maîtresses lors de l'élagage paysager ?", correct: "Une scie d'élagage à denture inversée ou une tronçonneuse", wrongs: ["Un sécateur de poche", "Un couteau suisse", "Une cisaille à gazon"], exp: "La scie d'élagage est conçue pour couper net le bois de gros diamètre sans effort excessif.", wiki: "https://fr.wikipedia.org/wiki/Scie_d%27élagage" },

    // --- Arrosage, Sols et Entretien paysager ---
    { q: "Quel est le meilleur moment de la journée pour arroser le jardin en été pour limiter les pertes par évaporation ?", correct: "Tôt le matin ou tard le soir", wrongs: ["En plein midi sous le soleil de plomb", "Exactement à minuit en hiver", "Uniquement pendant les orages"], exp: "Le matin ou le soir, la température est plus basse, ce qui évite que l'eau ne s'évapore instantanément.", wiki: "https://fr.wikipedia.org/wiki/Arrosage" },
    { q: "Qu'est-ce qu'un sol 'drainant' ?", correct: "Un sol qui laisse rapidement s'infiltrer l'eau sans la faire stagner", wrongs: ["Un sol imperméable comme du béton", "Un sol qui absorbe toute l'eau sans jamais la rendre", "Un sol sec en permanence"], exp: "Les sols sableux ou caillouteux sont très drainants, contrairement à l'argile.", wiki: "https://fr.wikipedia.org/wiki/Drainage_(agriculture)" },
    { q: "Pourquoi est-il préférable d'arroser moins souvent mais abondamment plutôt que tous les jours un tout petit peu ?", correct: "Pour inciter les racines à descendre en profondeur chercher l'eau", wrongs: ["Pour économiser de l'électricité", "Pour mouiller uniquement les feuilles du haut", "Parce que l'eau quotidienne abîme les tuyaux"], exp: "Un arrosage superficiel quotidien cantonne les racines en surface, les rendant vulnérables à la sécheresse.", wiki: "https://fr.wikipedia.org/wiki/Arrosage" },
    { q: "Qu'appelle-t-on le 'paillage organique' (mulching) au pied des massifs d'arbustes ?", correct: "L'installation d'une couche de matériaux végétaux (écorces, paillettes de lin) au sol", wrongs: ["La pose d'une bâche en plastique noir étanche et visible", "L'arrosage au tuyau poreux", "La mise en place de gravier blanc"], exp: "Il protège le sol, limite l'évaporation, empêche les mauvaises herbes et nourrit l'humus en se dégradant.", wiki: "https://fr.wikipedia.org/wiki/Paillis" },
    { q: "Quel est l'impact d'un sol lourd et argileux sur l'eau ?", correct: "Il retient très bien l'eau mais peut asphyxier les racines en cas de fortes pluies (stagnation)", wrongs: ["Il laisse passer l'eau comme une passoire", "Il transforme l'eau en glace instantanément", "Il évapore toute l'eau en 10 minutes"], exp: "L'argile est compacte et retient l'eau, ce qui demande une attention particulière au drainage.", wiki: "https://fr.wikipedia.org/wiki/Sol_argileux" },
    { q: "Qu'est-ce qu'un programmateur d'arrosage automatique ?", correct: "Un boîtier électronique qui déclenche les électrovannes d'arrosage à des heures et durées précises", wrongs: ["Un robot qui tond la pelouse", "Une application météo", "Un tuyau qui s'allume tout seul"], exp: "Il permet une gestion rigoureuse et automatisée de l'eau dans les grands jardins.", wiki: "https://fr.wikipedia.org/wiki/Arrosage_automatique" },
    { q: "Qu'appelle-t-on un sol 'limoneux' en paysagisme ?", correct: "Un sol aux particules de taille intermédiaire, très fertile mais sensible à la formation d'une croûte", wrongs: ["Un sol composé uniquement de gros cailloux", "Un sol rocheux de montagne", "Un sol de sable pur de dune"], exp: "Les limons sont faciles à travailler mais demandent un binage de surface après la pluie.", wiki: "https://fr.wikipedia.org/wiki/Limon_(pédologie)" },
    { q: "Quelle est l'utilité d'une bordure de jardin rigide (en métal, pavés ou bois) le long d'un massif ?", correct: "Séparer nettement la pelouse des massifs et empêcher le gazon de s'y infiltrer", wrongs: ["Empêcher les oiseaux de voler", "Chauffer la terre du massif", "Porter les tuyaux d'arrosage"], exp: "Elle structure le paysage et facilite grandement le passage de la tondeuse.", wiki: "https://fr.wikipedia.org/wiki/Bordure_de_jardin" },
    { q: "Qu'est-ce qu'un système d'arrosage par 'tuyau poreux' (ou goutte-à-goutte intégré) ?", correct: "Un tuyau qui suinte l'eau lentement et directement au pied des haies ou massifs", wrongs: ["Un tuyau troué qui arrose à 360 degrés en l'air", "Un tuyau percé par des rongeurs", "Un tuyau d'incendie de pompier"], exp: "Très efficace pour économiser l'eau en l'amenant directement à la zone racinaire.", wiki: "https://fr.wikipedia.org/wiki/Goutte-%C3%A0-goutte" },

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateRankDisplay() {
        let currentRank = ranks[0];
        for (let r of ranks) {
            if (score >= r.min) currentRank = r;
        }
        document.getElementById("rank-display").innerText = currentRank.title;

        let nextRankObj = ranks.find(r => r.min > score);
        let progressPercent = 100;
        let progressLabelText = "Niveau Max Atteint ! 👑";

        if (nextRankObj) {
            let span = nextRankObj.min - currentRank.min;
            let currentProgress = score - currentRank.min;
            progressPercent = Math.min(100, Math.max(0, Math.floor((currentProgress / span) * 100)));
            progressLabelText = `Suivant : ${nextRankObj.title}`;
        }

        document.getElementById("progress-text-label").innerText = progressLabelText;
        document.getElementById("progress-percent-label").innerText = progressPercent + "%";
        document.getElementById("progress-fill").style.width = progressPercent + "%";
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_client_score_500')) score = parseInt(localStorage.getItem('jardin_client_score_500'));
        
        let savedPseudo = localStorage.getItem('jardin_client_pseudo_500') || "JardinierExpert";
        document.getElementById("profile-name-view").innerText = savedPseudo;
        document.getElementById("modal-username-input").value = savedPseudo;

        if (localStorage.getItem('jardin_client_avatar_500')) {
            currentAvatar = localStorage.getItem('jardin_client_avatar_500');
            document.getElementById("avatar-display").innerText = currentAvatar;
        }
        selectedAvatarInModal = currentAvatar;

        if (localStorage.getItem('jardin_client_trophies_500')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_client_trophies_500'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_client_avatar_count_500')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_client_avatar_count_500'));
        }
        if (localStorage.getItem('jardin_client_jokers_50_500')) jokers50Left = parseInt(localStorage.getItem('jardin_client_jokers_50_500'));
        if (localStorage.getItem('jardin_client_jokers_tip_500')) jokersTipLeft = parseInt(localStorage.getItem('jardin_client_jokers_tip_500'));

        renderAvatarGrid();
        renderTrophiesList();
        updateScoreDisplay();
        updateJokersUI();
        loadNextQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_client_score_500', score);
        localStorage.setItem('jardin_client_pseudo_500', document.getElementById("profile-name-view").innerText);
        localStorage.setItem('jardin_client_avatar_500', currentAvatar);
        localStorage.setItem('jardin_client_avatar_count_500', avatarsChangesCount);
        localStorage.setItem('jardin_client_jokers_50_500', jokers50Left);
        localStorage.setItem('jardin_client_jokers_tip_500', jokersTipLeft);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_client_trophies_500', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function toggleProfileModal() {
        const modal = document.getElementById("profile-modal");
        if (modal.style.display === "flex") {
            modal.style.display = "none";
        } else {
            document.getElementById("modal-username-input").value = document.getElementById("profile-name-view").innerText;
            selectedAvatarInModal = currentAvatar;
            renderAvatarGrid();
            modal.style.display = "flex";
        }
    }

    function renderAvatarGrid() {
        const grid = document.getElementById("avatar-grid");
        grid.innerHTML = "";
        avatars.forEach(av => {
            const btn = document.createElement("button");
            btn.className = "avatar-option-btn " + (av === selectedAvatarInModal ? "selected" : "");
            btn.innerText = av;
            btn.onclick = () => {
                selectedAvatarInModal = av;
                renderAvatarGrid();
            };
            grid.appendChild(btn);
        });
    }

    function saveProfileChanges() {
        const newName = document.getElementById("modal-username-input").value.trim();
        if (newName) {
            document.getElementById("profile-name-view").innerText = newName;
        }

        if (currentAvatar !== selectedAvatarInModal) {
            currentAvatar = selectedAvatarInModal;
            document.getElementById("avatar-display").innerText = currentAvatar;
            avatarsChangesCount++;
            if (avatarsChangesCount >= 3) {
                unlockTrophy("t3");
            }
        }

        saveUserData();
        toggleProfileModal();
        showAchievement("✨ Profil mis à jour avec succès !");
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = score + " Pts";
        updateRankDisplay();
    }

    function updateJokersUI() {
        document.getElementById("count-50").innerText = jokers50Left;
        document.getElementById("count-tip").innerText = jokersTipLeft;
        document.getElementById("joker-50").disabled = (jokers50Left <= 0);
        document.getElementById("joker-tip").disabled = (jokersTipLeft <= 0);
    }

    function loadNextQuestion() {
        if (currentQuestionIndex >= quizData.length) {
            currentQuestionIndex = 0;
            quizData = shuffleArray([...uniqueQuizPool]);
        }

        currentQuestionObj = quizData[currentQuestionIndex];
        document.getElementById("question").innerText = currentQuestionObj.q;

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        allOptions = shuffleArray(allOptions);
        shuffledOptionsCache = allOptions;

        allOptions.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
    }

    function triggerAnimation(isSuccess) {
        const container = document.getElementById("main-container");
        container.classList.remove("success-anim", "error-anim");
        void container.offsetWidth;
        if (isSuccess) {
            container.classList.add("success-anim");
        } else {
            container.classList.add("error-anim");
        }
    }

    function selectAnswer(selectedIndex) {
        const selectedText = shuffledOptionsCache[selectedIndex];
        const isCorrect = (selectedText === currentQuestionObj.correct);

        triggerAnimation(isCorrect);

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            btn.disabled = true;
            if (shuffledOptionsCache[idx] === currentQuestionObj.correct) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex && !isCorrect) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        const wikiBtn = document.getElementById("wiki-btn");
        const nextBtn = document.getElementById("next-btn");
        const comboBadge = document.getElementById("combo-badge");

        explanationBox.style.display = "block";

        if (isCorrect) {
            consecutiveSuccess++;
            consecutiveErrors = 0;
            comboCount++;

            // +8 points pour la première bonne réponse, puis augmente avec le combo
            let earnedPoints = 8 + ((comboCount - 1) * 3);
            score += earnedPoints;

            pointsNotice.innerText = `✅ Bonne réponse ! (+${earnedPoints} Pts avec Combo x${comboCount})`;
            pointsNotice.style.color = "#4ade80";

            unlockTrophy("t1");
            if (score >= 150) unlockTrophy("t2");
            if (score >= 1000) unlockTrophy("t7");
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
            if (comboCount >= 5) {
                unlockTrophy("t6");
            }
        } else {
            consecutiveErrors++;
            consecutiveSuccess = 0;
            comboCount = 0;

            let penaltyPoints = 15;
            score = Math.max(0, score - penaltyPoints);

            pointsNotice.innerText = `❌ Mauvaise réponse ! (-${penaltyPoints} Pts)`;
            pointsNotice.style.color = "#f87171";

            if (consecutiveErrors >= 3) {
                unlockTrophy("t4");
            }
        }

        if (comboCount > 1) {
            comboBadge.style.display = "block";
            comboBadge.innerText = "🔥 x" + comboCount;
        } else {
            comboBadge.style.display = "none";
        }

        explanationText.innerText = currentQuestionObj.exp;

        if (currentQuestionObj.wiki) {
            wikiBtn.style.display = "flex";
            wikiBtn.href = currentQuestionObj.wiki;
        }

        nextBtn.style.display = "block";
        updateScoreDisplay();
        saveUserData();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadNextQuestion();
    }

    function useJoker50() {
        if (jokers50Left <= 0) return;
        jokers50Left--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        let hiddenCount = 0;

        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && hiddenCount < 2) {
                btn.classList.add("hidden-by-joker");
                hiddenCount++;
            }
        });
        saveUserData();
    }

    function useJokerTip() {
        if (jokersTipLeft <= 0) return;
        jokersTipLeft--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && !btn.classList.contains("hidden-by-joker")) {
                btn.style.opacity = "0.3";
            }
        });
        saveUserData();
    }

    function shareScore() {
        const text = `J'ai atteint ${score} points sur le Quiz Jardinier Pro ! Viens tester tes connaissances.`;
        if (navigator.share) {
            navigator.share({ title: 'Quiz Jardinier', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
