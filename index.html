<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Jardin, Parasites & Plantation</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --base-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #ffffff;
            --success-color: #4e9f3d;
            --error-color: #e94560;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Arrière-plan, base et expression unifiés[cite: 1] */
        .quiz-container {
            background-color: var(--base-color);
            border: 3px solid var(--accent-color);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            position: relative;
        }

        /* En-tête : Profil (Image + Nom) et Score (sans ligne de séparation) */
        .header-profile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #00cec9;
            object-fit: cover;
            background-color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        .user-name {
            font-size: 18px;
            font-weight: bold;
        }

        .score-board {
            text-align: right;
        }

        .score-board span {
            display: block;
            font-size: 14px;
            color: #b2bec3;
        }

        .score-board strong {
            font-size: 20px;
            color: #00cec9;
        }

        /* Barre de progression */
        .progress-bar-container {
            width: 100%;
            background-color: #0f3460;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #00cec9;
            transition: width 0.4s ease;
        }

        /* Zone de question et expression faciale[cite: 1] */
        .question-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .facial-expression {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            min-height: 60px;
        }

        /* Options de réponses */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-option {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: left;
        }

        .btn-option:hover {
            background-color: #1f4068;
            transform: translateY(-2px);
        }

        /* Effets visuels Victoire / Échec */
        .quiz-container.victory {
            border-color: var(--success-color);
            box-shadow: 0 0 30px var(--success-color);
        }

        .quiz-container.failure {
            border-color: var(--error-color);
            box-shadow: 0 0 30px var(--error-color);
        }

        /* Lien Wikipédia */
        .wiki-link-container {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .wiki-link {
            color: #74b9ff;
            text-decoration: none;
            font-size: 14px;
            font-style: italic;
        }

        .wiki-link:hover {
            text-decoration: underline;
        }

        /* Modal de choix d'avatar */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal h3 {
            margin-bottom: 15px;
            color: #00cec9;
        }

        .avatar-choices {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .avatar-choice {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            object-fit: cover;
            transition: transform 0.2s, border-color 0.2s;
        }

        .avatar-choice:hover {
            transform: scale(1.1);
            border-color: #00cec9;
        }

        .modal button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quizContainer">
        <!-- Modal de choix d'avatar -->
        <div class="modal" id="avatarModal">
            <h3>Choisissez votre avatar</h3>
            <div class="avatar-choices">
                <img src="https://images.unsplash.com/photo-1592417817098-8f3d692adb45?w=150" class="avatar-choice" onclick="selectAvatar(this.src)">
                <img src="https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=150" class="avatar-choice" onclick="selectAvatar(this.src)">
                <img src="https://images.unsplash.com/photo-1585320806297-9794b3e4eeae?w=150" class="avatar-choice" onclick="selectAvatar(this.src)">
                <img src="https://images.unsplash.com/photo-1558904541-efa843a88f0b?w=150" class="avatar-choice" onclick="selectAvatar(this.src)">
            </div>
            <button onclick="closeModal()">Fermer</button>
        </div>

        <!-- En-tête Profil & Score -->
        <div class="header-profile">
            <div class="user-info">
                <img src="https://via.placeholder.com/150" alt="Avatar" class="user-avatar" id="userAvatar" title="Cliquez pour changer d'avatar">
                <div class="user-name" id="userName">Utilisateur</div>
            </div>
            <div class="score-board">
                <span>Score</span>
                <strong id="scoreDisplay">0 pts</strong>
            </div>
        </div>

        <!-- Barre de progression -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Zone Question & Expression[cite: 1] -->
        <div class="question-section">
            <div class="facial-expression" id="facialExpression">😐</div>
            <div class="question-text" id="questionText">Chargement de la question...</div>
        </div>

        <!-- Options -->
        <div class="options-container" id="optionsContainer"></div>

        <!-- Lien Wikipédia -->
        <div class="wiki-link-container" id="wikiContainer"></div>
    </div>

    <script>
        // --- 1. GESTION DE LA MÉMOIRE DU JOUEUR & AVATAR ---
        let playerName = localStorage.getItem("quiz_player_name");
        if (!playerName) {
            playerName = prompt("Entrez votre nom de joueur :") || "Jardinier";
            localStorage.setItem("quiz_player_name", playerName);
        }
        document.getElementById("userName").innerText = playerName;

        let playerAvatar = localStorage.getItem("quiz_player_avatar");
        if (!playerAvatar) {
            playerAvatar = "https://images.unsplash.com/photo-1592417817098-8f3d692adb45?w=150";
            localStorage.setItem("quiz_player_avatar", playerAvatar);
        }
        const avatarImg = document.getElementById("userAvatar");
        avatarImg.src = playerAvatar;

        const modal = document.getElementById("avatarModal");
        avatarImg.onclick = () => {
            modal.style.display = "flex";
        };

        function selectAvatar(url) {
            playerAvatar = url;
            localStorage.setItem("quiz_player_avatar", playerAvatar);
            avatarImg.src = playerAvatar;
            modal.style.display = "none";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        let score = 0;
        let combo = 0;

        const quizContainer = document.getElementById("quizContainer");
        const questionText = document.getElementById("questionText");
        const optionsContainer = document.getElementById("optionsContainer");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const progressBar = document.getElementById("progressBar");
        const facialExpression = document.getElementById("facialExpression");
        const wikiContainer = document.getElementById("wikiContainer");

        function afficherQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionText.innerHTML = `Quiz terminé !<br>${playerName}, votre score final : ${score} points`;
                optionsContainer.innerHTML = "";
                wikiContainer.innerHTML = "";
                facialExpression.innerText = "🏆";
                progressBar.style.width = "100%";
                return;
            }

            // Mise à jour de la barre de progression
            const progressPercent = (currentQuestionIndex / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            const q = questions[currentQuestionIndex];
            questionText.innerText = q.question;
            facialExpression.innerText = "😐"; // Base neutre[cite: 1]
            optionsContainer.innerHTML = "";

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("btn-option");
                button.onclick = () => verifierReponse(index);
                optionsContainer.appendChild(button);
            });
        }

        function verifierReponse(selectedIndex) {
            const q = questions[currentQuestionIndex];
            
            // Affichage du lien Wikipédia de la question qui vient d'être traitée
            if (q.wiki) {
                wikiContainer.innerHTML = `<a href="${q.wiki}" target="_blank" class="wiki-link">📚 En savoir plus sur Wikipédia (${q.options[q.correct]})</a>`;
            }

            if (selectedIndex === q.correct) {
                // Victoire : +10 points de base + bonus de combo, effet vert et expression heureuse
                combo++;
                const pointsGagnes = 10 + (combo - 1) * 5;
                score += pointsGagnes;
                
                quizContainer.classList.add("victory");
                setTimeout(() => quizContainer.classList.remove("victory"), 600);
                
                facialExpression.innerText = "🎉";
            } else {
                // Échec : -15 points, réinitialisation du combo, effet rouge et expression triste
                score -= 15;
                combo = 0;
                
                quizContainer.classList.add("failure");
                setTimeout(() => quizContainer.classList.remove("failure"), 600);
                
                facialExpression.innerText = "❌";
            }

            scoreDisplay.innerText = `${score} pts`;
            currentQuestionIndex++;

            // Passer à la question suivante après un court délai
            setTimeout(() => {
                afficherQuestion();
            }, 1800);
        }

        // Lancement initial
        afficherQuestion();
