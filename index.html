<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Jardinier - Expert Pro 🌿</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        @keyframes flashSuccess {
            0% { background: #1e293b; }
            50% { background: rgba(34, 197, 94, 0.4); transform: scale(1.01); }
            100% { background: #1e293b; transform: scale(1); }
        }

        @keyframes flashError {
            0% { background: #1e293b; transform: translateX(0); }
            20% { transform: translateX(-6px); background: rgba(239, 68, 68, 0.4); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); background: #1e293b; }
        }

        .mobile-container.success-anim {
            animation: flashSuccess 0.5s ease;
        }

        .mobile-container.error-anim {
            animation: flashError 0.5s ease;
        }

        .app-header {
            padding: 12px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 13px;
            font-weight: 800;
            color: #4ade80;
        }

        .rank-title {
            font-size: 11px;
            color: #facc15;
            font-weight: 700;
            margin-top: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .combo-badge {
            background: rgba(249, 115, 22, 0.15);
            color: #fdba74;
            padding: 4px 7px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(249, 115, 22, 0.3);
            display: none;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .progress-bar-container {
            background: #0f172a;
            padding: 8px 14px;
            border-bottom: 1px solid #334155;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 10.5px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #facc15);
            width: 0%;
            transition: width 0.4s ease;
        }

        .app-content {
            flex: 1;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 16px;
            padding: 8px 10px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .user-profile-card:hover {
            border-color: #38bdf8;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            border: 2px solid #4ade80;
            flex-shrink: 0;
        }

        .profile-info {
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .profile-name-display {
            color: #f8fafc;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-subtitle {
            font-size: 10.5px;
            color: #38bdf8;
            font-weight: 600;
            margin-top: 1px;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 2px 6px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .jokers-bar {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .joker-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 3px 6px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .joker-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #334155;
            color: #94a3b8;
        }

        .quiz-box {
            background: #334155;
            border-radius: 12px;
            padding: 10px;
            margin-top: 6px;
        }

        .question-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 3px;
        }

        .question-text {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 8px 10px;
            border-radius: 9px;
            font-size: 11.5px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.2;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #4ade80;
        }

        .option-btn.hidden-by-joker {
            display: none;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 9px;
            padding: 7px;
            margin-top: 6px;
        }

        .explanation-text {
            font-size: 11.5px;
            color: #e2e8f0;
            line-height: 1.25;
            margin-top: 2px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 11.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 6px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 7px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11.5px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 7px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 6px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11.5px;
            cursor: pointer;
            width: 100%;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon { font-size: 24px; }
        .trophy-details h4 { font-size: 13px; color: #f8fafc; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #94a3b8; }

        .profile-edit-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .avatar-selection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .avatar-option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            font-size: 28px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .avatar-option-btn.selected {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
        }

        .form-input {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 700;
            padding: 10px;
            border-radius: 10px;
            outline: none;
        }

        .form-input:focus {
            border-color: #38bdf8;
        }

        .save-profile-btn {
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container" id="main-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <!-- Modale Trophées -->
    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Grades</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <!-- Modale Espace Profil -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">⚙️ Mon Espace Profil</div>
                <button class="close-modal" onclick="toggleProfileModal()">×</button>
            </div>
            <div class="profile-edit-body">
                <div class="form-group">
                    <label class="form-label">Changer de nom :</label>
                    <input type="text" class="form-input" id="modal-username-input" placeholder="Ton pseudo...">
                </div>
                <div class="form-group">
                    <label class="form-label">Choisir ton avatar :</label>
                    <div class="avatar-selection-grid" id="avatar-grid"></div>
                </div>
                <button class="save-profile-btn" onclick="saveProfileChanges()">Enregistrer les modifications</button>
            </div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 QUESTIONS JARDIN</div>
            <div class="rank-title" id="rank-display">🌱 Graine de radis</div>
        </div>
        <div class="header-right">
            <div class="combo-badge" id="combo-badge">🔥 x0</div>
            <div class="score-badge" id="score-display">0 Pts</div>
        </div>
    </div>

    <!-- Barre de progression vers le grade suivant -->
    <div class="progress-bar-container">
        <div class="progress-info">
            <span id="progress-text-label">Grade suivant : Pousse tendre</span>
            <span id="progress-percent-label">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="app-content">
        <!-- Carte Profil cliquable -->
        <div class="user-profile-card" onclick="toggleProfileModal()">
            <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            <div class="profile-info">
                <div class="profile-name-display" id="profile-name-view">JardinierExpert</div>
                <div class="profile-subtitle">⚙️ Cliquer pour modifier le profil</div>
                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="event.stopPropagation(); toggleTrophyModal();">🏆 Trophées</button>
                </div>
                <div class="jokers-bar">
                    <button class="joker-btn" id="joker-50" onclick="event.stopPropagation(); useJoker50()">✂️ 50/50 (<span id="count-50">2</span>)</button>
                    <button class="joker-btn" id="joker-tip" onclick="event.stopPropagation(); useJokerTip()">💡 Indice (<span id="count-tip">2</span>)</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="question-title">❓ QUESTION</div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

<script>
    // Base complète de questions axées sur les questions des clients (Sol, Plantation, Arrosage, Parasites, Exposition, Haies, Persistantes)
    const uniqueQuizPool = [
        // --- BIOLOGIE DU SOL ---
        { q: "Pourquoi les vers de terre sont-ils de véritables alliés pour la biologie du sol ?", correct: "Ils creusent des galeries et mélangent la matière organique pour structurer la terre", wrongs: ["Ils grignotent les racines des jeunes plants pour se nourrir", "Ils augmentent l'acidité excessive de la terre sablonneuse", "Ils empêchent l'eau de pluie de s'infiltrer en profondeur"], exp: "Les lombrics aèrent le sol, favorisent l'infiltration de l'eau et créent un humus fertile indispensable.", wiki: "https://fr.wikipedia.org/wiki/Lombric" },
        { q: "Quel est le rôle principal des champignons mycorhiziens dans le sol ?", correct: "Ils s'associent aux racines pour les aider à capter l'eau et les nutriments", wrongs: ["Ils détruisent systématiquement toutes les mauvaises herbes du potager", "Ils colorent les fleurs en bleu intense au printemps", "Ils dégagent une forte chaleur pour protéger du gel"], exp: "La mycorhize est une symbiose bénéfique entre champignons et racines qui décuple la vigueur de la plante.", wiki: "https://fr.wikipedia.org/wiki/Mycorhize" },
        { q: "Que signifie un sol au pH fortement acide (inférieur à 6) ?", correct: "Un sol qui convient parfaitement aux plantes de terre de bruyère comme les rhododendrons", wrongs: ["Un sol idéal et universel pour cultiver des melons et des artichauts", "Un sol entièrement stérile où rien ne pourra jamais pousser", "Un sol saturé en calcaire pur qui bloque le fer"], exp: "Les sols acides manquent de calcaire, ce qui plaît aux hortensias bleus, camélias et bruyères.", wiki: "https://fr.wikipedia.org/wiki/pH_du_sol" },
        
        // --- PLANTATION ---
        { q: "Qu'appelle-t-on le 'pralinage' des racines avant de planter un arbre à racines nues ?", correct: "Le fait de tremper les racines dans un mélange boueux d'argile et d'eau", wrongs: ["Le fait de saupoudrer les branches de sucre glace pour stimuler la sève", "L'action de tailler toutes les racines principales à ras du tronc", "Le fait de congeler l'arbre une nuit pour le réveiller ensuite"], exp: "Le pralin protège les racines de la déshydratation et favorise leur reprise dans le sol.", wiki: "https://fr.wikipedia.org/wiki/Pralinage" },
        { q: "Quelle est la meilleure période générale de l'année pour planter les arbres et arbustes en conteneur ?", correct: "L'automne, car la terre est chaude et les pluies favorisent l'enracinement", wrongs: ["En plein mois de juillet lors des canicules estivales", "Uniquement le 1er janvier en plein hiver gelé", "Pendant la floraison estivale en plein cagnard"], exp: "Planter en automne permet à l'arbuste de développer ses racines avant l'arrivée de l'été.", wiki: "https://fr.wikipedia.org/wiki/Plantation" },
        { q: "Pourquoi ne faut-il pas enterrer le 'collet' d'un arbuste lors de la plantation ?", correct: "Pour éviter que le tronc ne pourrisse sous l'effet de l'humidité de la terre", wrongs: ["Pour permettre à l'arbuste de se déplacer tout seul s'il le souhaite", "Pour que le vent puisse arracher plus facilement les feuilles", "Parce que cela donne une forme totalement carrée à la plante"], exp: "Le collet (jonction entre les racines et le tronc) doit toujours rester au niveau de la surface.", wiki: "https://fr.wikipedia.org/wiki/Collet_(botanique)" },
        
        // --- ARROSAGE ---
        { q: "Quel est le meilleur moment de la journée pour arroser son jardin en été ?", correct: "Tôt le matin ou tard le soir après le coucher du soleil", wrongs: ["À midi pile quand le soleil brille le plus fort", "Entre 14h et 16h pour rafraîchir les feuilles", "Uniquement en pleine nuit sous l'orage"], exp: "Cela limite l'évaporation rapide de l'eau et évite les brulures sur le feuillage.", wiki: "https://fr.wikipedia.org/wiki/Arrosage" },
        { q: "À quoi sert principalement le paillage (mulching) au pied des massifs ?", correct: "À retenir l'humidité du sol et à empêcher la pousse des mauvaises herbes", wrongs: ["À attirer un maximum de taupes et de rats taupiers", "À transformer la terre en un marbre blanc décoratif", "À chauffer intensément les racines en hiver"], exp: "Le paillis protège la terre du soleil direct, limite l'arrosage et nourrit progressivement le sol.", wiki: "https://fr.wikipedia.org/wiki/Paillis" },
        { q: "Comment faut-il de préférence arroser les tomates au potager pour éviter les maladies ?", correct: "Au pied, directement sur la terre, sans jamais mouiller le feuillage", wrongs: ["En aspergeant vigoureusement les feuilles et les fruits tous les soirs", "En immergeant entièrement le plant la tête en bas", "En utilisant exclusivement de l'eau de mer salée"], exp: "Mouiller le feuillage des tomates crée un milieu humide propice au mildiou.", wiki: "https://fr.wikipedia.org/wiki/Tomate" },
        
        // --- PARASITES (IMPORTANT) ---
        { q: "Quel insecte minuscule pique les jeunes pousses et excrète un miellat sucré apprécié des fourmis ?", correct: "Le puceron", wrongs: ["Le lombric géant", "La coccinelle carnivore", "Le papillon machaon"], exp: "Les pucerons pullulent au printemps sur les pousses tendres et affaiblissent la plante.", wiki: "https://fr.wikipedia.org/wiki/Aphidoidea" },
        { q: "Comment reconnaître une attaque de la pyrale du buis sur une haie ?", correct: "Par la présence de chenilles vertes et de feuilles grignotées reliées par des fils de soie", wrongs: ["Par un changement de couleur du bois qui devient entièrement bleu", "Par l'apparition de fruits ronds et sucrés sur les branches", "Par une odeur prononcée de menthe poivrée dans le jardin"], exp: "La pyrale est un ravageur redoutable qui peut décimer une haie de buis en très peu de temps.", wiki: "https://fr.wikipedia.org/wiki/Pyrale_du_buis" },
        { q: "Qu'est-ce que l'oïdium, maladie fréquente sur les rosiers et les courges ?", correct: "Un champignon qui forme un feutrage ou une poudre blanche sur les feuilles", wrongs: ["Une carence aiguë en fer dans les racines profondes", "Une brûlure instantanée causée par les rayons de la lune", "Un dépôt de calcaire dû à un arrosage à l'eau dure"], exp: "Aussi appelée maladie du blanc, elle se développe par temps chaud et humide.", wiki: "https://fr.wikipedia.org/wiki/O%C3%AFdium" },
        { q: "Quelle solution biologique utilise-t-on contre les chenilles dévoreuses de feuilles au potager ?", correct: "Le Bacillus thuringiensis (Bt), une bactérie naturelle ciblée", wrongs: ["De la javel pure diluée dans de l'eau", "Un répulsif sonore à ultrasons haute fréquence", "Un insecticide chimique à base de chlore"], exp: "C'est un traitement biologique très efficace et inoffensif pour les animaux domestiques.", wiki: "https://fr.wikipedia.org/wiki/Bacillus_thuringiensis" },
        
        // --- EXPOSITION ---
        { q: "Quelle exposition préfère généralement la lavande pour s'épanouir pleinement ?", correct: "Un plein soleil et une terre bien drainée", wrongs: ["Une ombre totale et profonde sous les grands arbres", "Un coin sombre, détrempé et gorgé d'eau", "Un couloir glacial exposé à tous les vents du nord"], exp: "La lavande est une plante méditerranéenne qui adore le soleil et redoute l'humidité stagnante.", wiki: "https://fr.wikipedia.org/wiki/Lavande" },
        { q: "Où vaut-il mieux planter un hortensia (Hydrangea) dans son jardin ?", correct: "À la mi-ombre, à l'abri du soleil brûlant de l'après-midi", wrongs: ["En plein cagnard au milieu d'un désert de sable", "Dans un local totalement sombre sans aucune lumière", "Au sommet d'une colline balayée par des vents secs"], exp: "Les hortensias n'aiment pas le soleil direct intense qui brûle leurs larges feuilles et leurs fleurs.", wiki: "https://fr.wikipedia.org/wiki/Hydrangea" },
        
        // --- HAIES ---
        { q: "Quel arbuste à croissance rapide et au feuillage persistant est très utilisé pour les haies occultantes ?", correct: "Le Photinia 'Red Robin' ou le Laurier-cerise", wrongs: ["Le rosier grimpant miniature à fleurs doubles", "Le cactus géant du Mexique", "Le bananier nain d'appartement"], exp: "Le photinia séduit avec ses jeunes pousses rouges flamboyantes et sa persistance toute l'année.", wiki: "https://fr.wikipedia.org/wiki/Photinia_%C3%97_fraseri" },
        { q: "Quel est l'avantage d'une haie 'mixte et champêtre' par rapport à une haie monospécifique de thuyas ?", correct: "Elle favorise la biodiversité et résiste mieux aux maladies et parasites", wrongs: ["Elle pousse dix fois plus vite qu'un mur en béton armé", "Elle ne nécessite absolument aucune taille au cours de sa vie", "Elle change de couleur pour devenir fluo en hiver"], exp: "Varier les essences (charme, noisetier, aubépine) protège la haie des ravageurs globaux.", wiki: "https://fr.wikipedia.org/wiki/Haie" },
        { q: "Quel arbuste caduc est traditionnellement utilisé pour composer des haies 'charmilles' rigoureuses ?", correct: "Le charme (Carpinus betulus)", wrongs: ["Le palmier à chanvre de Chine", "Le géranium vivace tapissant", "La fougère arborescente tropicale"], exp: "Le charme garde ses feuilles mortes une bonne partie de l'hiver (marcescence) et se taille à merveille.", wiki: "https://fr.wikipedia.org/wiki/Carpinus_betulus" },
        
        // --- PLANTES PERSISTANTES OU NON ---
        { q: "Quelle est la différence principale entre une plante persistante et une plante caduque ?", correct: "La persistante garde son feuillage toute l'année, la caduque le perd en hiver", wrongs: ["La caduque vit cent ans, la persistante ne vit que deux jours", "La persistante ne fait jamais de fleurs de toute sa vie", "La caduque pousse uniquement sous l'eau de mer"], exp: "Les persistantes (laurier, photinia, conifères) restent vertes, les caduques se dépouillent en automne.", wiki: "https://fr.wikipedia.org/wiki/Plante_persistante" },
        { q: "Parmi ces plantes, laquelle est un arbuste persistant très apprécié pour ses fleurs parfumées en hiver ?", correct: "Le Laurier-tin (Viburnum tinus)", wrongs: ["L'érable du Japon aux feuilles découpées", "Le rosier buisson à floraison estivale", "Le lilas commun printanier"], exp: "Le laurier-tin fleurit de décembre à avril avec de jolies inflorescences blanches et roses.", wiki: "https://fr.wikipedia.org/wiki/Viburnum_tinus" },
        { q: "Le hêtre (Fagus sylvatica) est-il un arbre persistant ou caduc ?", correct: "Il est caduc, mais ses feuilles sèches restent accrochées tout l'hiver (marcescence)", wrongs: ["Il perd toutes ses feuilles en plein mois de juin", "Il est totalement persistant comme un pin maritime", "C'est une plante aquatique sans feuilles"], exp: "C'est une particularité très utile pour composer des haies brise-vue naturelles même en hiver.", wiki: "https://fr.wikipedia.org/wiki/H%C3%B7tre" }
    ];

    let quizData = shuffleArray([...uniqueQuizPool]);
    let score = 0;
    let currentQuestionIndex = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let comboCount = 0;

    let jokers50Left = 2;
    let jokersTipLeft = 2;

    const avatars = ["👨‍🌾", "👩‍🌾", "👷‍♂️", "🚜", "🌿", "🧑‍🌾", "🌻", "🌲", "🍄"];
    let currentAvatar = "👨‍🌾";
    let selectedAvatarInModal = "👨‍🌾";

    const ranks = [
        { min: 0, max: 150, title: "🌱 Graine de radis" },
        { min: 150, max: 400, title: "🌿 Pousse tendre" },
        { min: 400, max: 800, title: "🪴 Apprenti jardinier" },
        { min: 800, max: 1500, title: "🌻 Jardinier confirmé" },
        { min: 1500, max: 3000, title: "👑 Sage botaniste" }
    ];

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première Question Réussie", desc: "Donner votre première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Jardinier Qualifié", desc: "Atteindre 150 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Tenue", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "⚠️", title: "Erreur de Diagnostic", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "⭐", title: "Expert Vert", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "🔥", title: "En Feu !", desc: "Atteindre un combo de 5", unlocked: false },
        { id: "t7", icon: "🏆", title: "Maître des Fleurs", desc: "Atteindre 1000 points", unlocked: false }
    ];

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateRankDisplay() {
        let currentRank = ranks[0];
        for (let r of ranks) {
            if (score >= r.min) currentRank = r;
        }
        document.getElementById("rank-display").innerText = currentRank.title;

        let nextRankObj = ranks.find(r => r.min > score);
        let progressPercent = 100;
        let progressLabelText = "Niveau Max Atteint ! 👑";

        if (nextRankObj) {
            let span = nextRankObj.min - currentRank.min;
            let currentProgress = score - currentRank.min;
            progressPercent = Math.min(100, Math.max(0, Math.floor((currentProgress / span) * 100)));
            progressLabelText = `Suivant : ${nextRankObj.title}`;
        }

        document.getElementById("progress-text-label").innerText = progressLabelText;
        document.getElementById("progress-percent-label").innerText = progressPercent + "%";
        document.getElementById("progress-fill").style.width = progressPercent + "%";
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_client_score_500')) score = parseInt(localStorage.getItem('jardin_client_score_500'));
        
        let savedPseudo = localStorage.getItem('jardin_client_pseudo_500') || "JardinierExpert";
        document.getElementById("profile-name-view").innerText = savedPseudo;
        document.getElementById("modal-username-input").value = savedPseudo;

        if (localStorage.getItem('jardin_client_avatar_500')) {
            currentAvatar = localStorage.getItem('jardin_client_avatar_500');
            document.getElementById("avatar-display").innerText = currentAvatar;
        }
        selectedAvatarInModal = currentAvatar;

        if (localStorage.getItem('jardin_client_trophies_500')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_client_trophies_500'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_client_avatar_count_500')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_client_avatar_count_500'));
        }
        if (localStorage.getItem('jardin_client_jokers_50_500')) jokers50Left = parseInt(localStorage.getItem('jardin_client_jokers_50_500'));
        if (localStorage.getItem('jardin_client_jokers_tip_500')) jokersTipLeft = parseInt(localStorage.getItem('jardin_client_jokers_tip_500'));

        renderAvatarGrid();
        renderTrophiesList();
        updateScoreDisplay();
        updateJokersUI();
        loadNextQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_client_score_500', score);
        localStorage.setItem('jardin_client_pseudo_500', document.getElementById("profile-name-view").innerText);
        localStorage.setItem('jardin_client_avatar_500', currentAvatar);
        localStorage.setItem('jardin_client_avatar_count_500', avatarsChangesCount);
        localStorage.setItem('jardin_client_jokers_50_500', jokers50Left);
        localStorage.setItem('jardin_client_jokers_tip_500', jokersTipLeft);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_client_trophies_500', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function toggleProfileModal() {
        const modal = document.getElementById("profile-modal");
        if (modal.style.display === "flex") {
            modal.style.display = "none";
        } else {
            document.getElementById("modal-username-input").value = document.getElementById("profile-name-view").innerText;
            selectedAvatarInModal = currentAvatar;
            renderAvatarGrid();
            modal.style.display = "flex";
        }
    }

    function renderAvatarGrid() {
        const grid = document.getElementById("avatar-grid");
        grid.innerHTML = "";
        avatars.forEach(av => {
            const btn = document.createElement("button");
            btn.className = "avatar-option-btn " + (av === selectedAvatarInModal ? "selected" : "");
            btn.innerText = av;
            btn.onclick = () => {
                selectedAvatarInModal = av;
                renderAvatarGrid();
            };
            grid.appendChild(btn);
        });
    }

    function saveProfileChanges() {
        const newName = document.getElementById("modal-username-input").value.trim();
        if (newName) {
            document.getElementById("profile-name-view").innerText = newName;
        }

        if (currentAvatar !== selectedAvatarInModal) {
            currentAvatar = selectedAvatarInModal;
            document.getElementById("avatar-display").innerText = currentAvatar;
            avatarsChangesCount++;
            if (avatarsChangesCount >= 3) {
                unlockTrophy("t3");
            }
        }

        saveUserData();
        toggleProfileModal();
        showAchievement("✨ Profil mis à jour avec succès !");
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = score + " Pts";
        updateRankDisplay();
    }

    function updateJokersUI() {
        document.getElementById("count-50").innerText = jokers50Left;
        document.getElementById("count-tip").innerText = jokersTipLeft;
        document.getElementById("joker-50").disabled = (jokers50Left <= 0);
        document.getElementById("joker-tip").disabled = (jokersTipLeft <= 0);
    }

    function loadNextQuestion() {
        if (currentQuestionIndex >= quizData.length) {
            currentQuestionIndex = 0;
            quizData = shuffleArray([...uniqueQuizPool]);
        }

        currentQuestionObj = quizData[currentQuestionIndex];
        document.getElementById("question").innerText = currentQuestionObj.q;

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        allOptions = shuffleArray(allOptions);
        shuffledOptionsCache = allOptions;

        allOptions.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
    }

    function triggerAnimation(isSuccess) {
        const container = document.getElementById("main-container");
        container.classList.remove("success-anim", "error-anim");
        void container.offsetWidth;
        if (isSuccess) {
            container.classList.add("success-anim");
        } else {
            container.classList.add("error-anim");
        }
    }

    function selectAnswer(selectedIndex) {
        const selectedText = shuffledOptionsCache[selectedIndex];
        const isCorrect = (selectedText === currentQuestionObj.correct);

        triggerAnimation(isCorrect);

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            btn.disabled = true;
            if (shuffledOptionsCache[idx] === currentQuestionObj.correct) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex && !isCorrect) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        const wikiBtn = document.getElementById("wiki-btn");
        const nextBtn = document.getElementById("next-btn");
        const comboBadge = document.getElementById("combo-badge");

        explanationBox.style.display = "block";

        if (isCorrect) {
            consecutiveSuccess++;
            consecutiveErrors = 0;
            comboCount++;

            let earnedPoints = 10 + (comboCount * 4);
            score += earnedPoints;

            pointsNotice.innerText = `✅ Bonne réponse ! (+${earnedPoints} Pts avec Combo x${comboCount})`;
            pointsNotice.style.color = "#4ade80";

            unlockTrophy("t1");
            if (score >= 150) unlockTrophy("t2");
            if (score >= 1000) unlockTrophy("t7");
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
            if (comboCount >= 5) {
                unlockTrophy("t6");
            }
        } else {
            consecutiveErrors++;
            consecutiveSuccess = 0;
            comboCount = 0;

            let penaltyPoints = 10;
            score = Math.max(0, score - penaltyPoints);

            pointsNotice.innerText = `❌ Mauvaise réponse ! (-${penaltyPoints} Pts)`;
            pointsNotice.style.color = "#f87171";

            if (consecutiveErrors >= 3) {
                unlockTrophy("t4");
            }
        }

        if (comboCount > 1) {
            comboBadge.style.display = "block";
            comboBadge.innerText = "🔥 x" + comboCount;
        } else {
            comboBadge.style.display = "none";
        }

        explanationText.innerText = currentQuestionObj.exp;

        if (currentQuestionObj.wiki) {
            wikiBtn.style.display = "flex";
            wikiBtn.href = currentQuestionObj.wiki;
        }

        nextBtn.style.display = "block";
        updateScoreDisplay();
        saveUserData();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadNextQuestion();
    }

    function useJoker50() {
        if (jokers50Left <= 0) return;
        jokers50Left--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        let hiddenCount = 0;

        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && hiddenCount < 2) {
                btn.classList.add("hidden-by-joker");
                hiddenCount++;
            }
        });
        saveUserData();
    }

    function useJokerTip() {
        if (jokersTipLeft <= 0) return;
        jokersTipLeft--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && !btn.classList.contains("hidden-by-joker")) {
                btn.style.opacity = "0.3";
            }
        });
        saveUserData();
    }

    function shareScore() {
        const text = `J'ai atteint ${score} points sur le Quiz Jardinier ! Viens tester tes connaissances.`;
        if (navigator.share) {
            navigator.share({ title: 'Quiz Jardinier', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
