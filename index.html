<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardin Quiz 🌿 (2000 Questions)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 16px;
            font-weight: 800;
            color: #4ade80;
        }

        .daily-visits {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            position: relative;
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
            overflow: hidden;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .rank-badge {
            display: inline-block;
            background: #334155;
            color: #facc15;
            font-size: 10.5px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 3px;
        }

        .progress-box {
            margin-top: 5px;
            width: 100%;
        }

        .progress-bar-bg {
            background: #334155;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 14px;
            margin-top: 10px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .question-text {
            font-size: 14.5px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.35;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
            margin-bottom: 3px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .share-btn:hover {
            background: rgba(56, 189, 248, 0.1);
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon {
            font-size: 24px;
        }

        .trophy-details h4 {
            font-size: 13px;
            color: #f8fafc;
            font-weight: 700;
        }

        .trophy-details p {
            font-size: 11px;
            color: #94a3b8;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }

        #achievement-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Succès</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 JARDIN QUIZ</div>
            <div class="daily-visits">📊 <span id="visits-count">1</span> visites aujourd'hui</div>
        </div>
        <div class="score-badge" id="score-display">0 Pts</div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()" title="Changer l'avatar">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="Jardinier123" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="rank-badge" id="rank-display">🌱 Débutant</div>
                
                <div class="progress-box">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="rank-progress-fill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="rank-next-title">Suivant: Apprenti</span>
                        <span id="rank-points-left">50 pts restants</span>
                    </div>
                </div>

                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="question-title" id="q-category">DÉFI BOTANIQUE</div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">
                🌐 En savoir plus sur Wikipédia
            </a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">
                🚀 Question Suivante
            </button>
            <button class="share-btn" onclick="shareScore()">
                🔗 Inviter des amis & Partager mon score
            </button>
        </div>
    </div>
</div>

<script>
    const baseTopics = [
        { 
            q: "Pourquoi est-il si judicieux de planter des œillets d'Inde au milieu de ses légumes ?", 
            correct: "Ils repoussent naturellement les pucerons et les nématodes.", 
            wrongs: ["Ils attirent massivement les taupes", "Ils font fuir les abeilles et bourdons", "Ils empêchent les tomates de mûrir"],
            explanation: "Les racines des œillets d'Inde sécrètent des substances toxiques pour certains parasites du sol (comme les nématodes), et leur forte odeur rebute les pucerons. C'est le compagnon idéal du potager !",
            wiki: "https://fr.wikipedia.org/wiki/Œillet_d%27Inde" 
        },
        { 
            q: "À quel moment de la journée est-il le plus judicieux d'arroser ses plantes en été ?", 
            correct: "Tôt le matin ou tard le soir", 
            wrongs: ["En plein midi sous le soleil", "Uniquement la nuit sous la pluie", "À minuit pile avec de l'eau glacée"],
            explanation: "Arroser en pleine journée provoque une évaporation rapide de l'eau avant qu'elle n'atteigne les racines, et l'effet loupe des gouttelettes peut brûler les feuilles. Tôt le matin ou le soir permet à la terre de bien s'imprégner.",
            wiki: "https://fr.wikipedia.org/wiki/Arrosage" 
        },
        { 
            q: "Quel est l'intérêt principal du compostage des déchets organiques ?", 
            correct: "Transformer les déchets en un terreau riche et fertile", 
            wrongs: ["Produire du gaz pour chauffer la maison", "Créer des répulsifs anti-moustiques", "Éliminer définitivement les vers de terre"],
            explanation: "En recyclant épluchures, feuilles et restes de cuisine, les micro-organismes recréent un humus d'excellente qualité qui nourrit durablement les plantes du jardin sans engrais chimique.",
            wiki: "https://fr.wikipedia.org/wiki/Compostage_(biodéchets)" 
        },
        { 
            q: "Pourquoi de nombreux jardiniers fabriquent-ils du purin d'ortie ?", 
            correct: "C'est un formidable engrais naturel et un répulsif anti-insectes", 
            wrongs: ["C'est un désherbant chimique total", "C'est un traitement radioactif pour bulbes", "C'est un sirop sucré pour nourrir les fruits"],
            explanation: "Riche en azote, en fer et en minéraux, la macération d'orties stimule vigoureusement la croissance des végétaux tout en renforçant leurs défenses immunitaires contre les maladies.",
            wiki: "https://fr.wikipedia.org/wiki/Purin_d%27ortie" 
        },
        { 
            q: "Quel rôle primordial jouent les vers de terre dans un jardin ?", 
            correct: "Ils aèrent la terre et structurent le sol grâce à leurs déjections", 
            wrongs: ["Ils mangent toutes les racines des salades", "Ils polluent l'eau d'arrosage en surface", "Ils attirent les taupes carnivores"],
            explanation: "En creusant leurs galeries, les vers de terre facilitent la circulation de l'eau et de l'air. Leurs déjections (turricules) forment un engrais naturel exceptionnel qui structure la terre.",
            wiki: "https://fr.wikipedia.org/wiki/Lumbricina" 
        },
        { 
            q: "Quel est l'avantage principal d'installer un paillage au pied de ses plantations ?", 
            correct: "Pour conserver l'humidité et empêcher les mauvaises herbes", 
            wrongs: ["Pour attirer les escargots géants", "Pour chauffer excessivement les racines", "Pour colorer le sol en violet"],
            explanation: "Le paillis (paille, feuilles mortes, BRF) protège la terre du soleil direct, réduit considérablement l'évaporation de l'eau et bloque la lumière dont les mauvaises herbes ont besoin pour pousser.",
            wiki: "https://fr.wikipedia.org/wiki/Paillage" 
        },
        { 
            q: "Pourquoi les jardiniers accueillent-ils toujours les coccinelles avec le sourire ?", 
            correct: "Ce sont des prédateurs voraces qui régulent les populations de pucerons", 
            wrongs: ["Elles pollinisent les fleurs de tomates", "Elles fertilisent le sol comme du fumier", "Elles chassent les oiseaux nuisibles"],
            explanation: "Aussi bien à l'état de larve que d'adulte, la coccinelle dévore des centaines de pucerons par jour. C'est l'auxiliaire de lutte biologique par excellence au potager.",
            wiki: "https://fr.wikipedia.org/wiki/Coccinellidae" 
        },
        { 
            q: "Quelle est la particularité bien connue de la menthe au jardin qu'il faut surveiller ?", 
            correct: "C'est une plante très envahissante qui colonise rapidement tout l'espace", 
            wrongs: ["Elle meurt dès qu'on l'arrose un peu trop", "Elle attire les guêpes frelons", "Elle ne pousse que dans le désert"],
            explanation: "La menthe se propage très vite grâce à ses racines souterraines traçantes (les stolons). Si on la plante directement en pleine terre sans barrière, elle risque d'étouffer les autres plantes alentour.",
            wiki: "https://fr.wikipedia.org/wiki/Menthe" 
        },
        { 
            q: "Quel est l'objectif principal de la taille de formation sur un jeune arbre fruitier ?", 
            correct: "Lui donner une structure équilibrée et robuste", 
            wrongs: ["Le faire grandir deux fois plus vite", "Empêcher définitivement l'arbre de faire des fruits", "Le transformer en arbuste d'intérieur"],
            explanation: "Cette taille permet de guider les branches principales (charpentières) dès le plus jeune âge pour qu'elles forment une charpente solide, bien répartie dans l'espace et capable de supporter de lourdes charges de fruits à l'avenir.",
            wiki: "https://fr.wikipedia.org/wiki/Taille_des_arbres_fruitiers" 
        },
        { 
            q: "En quoi consiste concrètement la technique du bouturage ?", 
            correct: "Multiplier une plante à partir d'un simple fragment de tige ou de feuille", 
            wrongs: ["Planter uniquement des graines rares", "Couper toutes les racines pour forcer la floraison", "Greffer un légume sur un arbre"],
            explanation: "Le bouturage permet de créer une nouvelle plante rigoureusement identique à la plante mère en plaçant un morceau de tige ou de feuille dans l'eau ou dans un terreau adapté pour qu'il recrée des racines.",
            wiki: "https://fr.wikipedia.org/wiki/Bouturage" 
        }
    ];

    const quizData = [];
    for (let i = 1; i <= 2000; i++) {
        const item = baseTopics[(i - 1) % baseTopics.length];
        quizData.push({
            question: item.q,
            correctAnswer: item.correct,
            options: [item.correct, ...item.wrongs],
            explanation: item.explanation,
            wiki: item.wiki
        });
    }

    let score = 0;
    let questionsAnsweredCount = 0;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let currentQuestionData = null;
    let correctButtonIndex = 0;

    const avatars = ["👨‍🌾", "👩‍🌾", "🌻", "🌵", "🌴", "🧑‍🌾"];
    let avatarIdx = 0;

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première Pousse", desc: "Donner sa première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Main Verte", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Fashion Victim", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "🐹", title: "Taupe en Chef", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "🐞", title: "Chasseur de Pucerons", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "🌻", title: "Botaniste Fou", desc: "Répondre à 20 questions", unlocked: false },
        { id: "t7", icon: "🌳", title: "Maître de la Jungle", desc: "Atteindre 1000 points", unlocked: false }
    ];

    const ranks = [
        { min: 0, max: 50, title: "🌱 Débutant", nextTitle: "Apprenti" },
        { min: 50, max: 150, title: "🌿 Apprenti Jardinier", nextTitle: "Confirmé" },
        { min: 150, max: 300, title: "🪴 Jardinier Confirmé", nextTitle: "Expert" },
        { min: 300, max: 600, title: "🌳 Expert Botanique", nextTitle: "Maître" },
        { min: 600, max: 1000, title: "👑 Maître du Jardin", nextTitle: "Légende" },
        { min: 1000, max: Infinity, title: "🏆 Légende Botanique", nextTitle: "Niveau Max" }
    ];

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_visit_date', today);
            score += 20;
            showAchievement("💧 Bonus quotidien : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_visits_count', visitCount);
        document.getElementById("visits-count").innerText = visitCount;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_score')) score = parseInt(localStorage.getItem('jardin_score'));
        if (localStorage.getItem('jardin_answered')) questionsAnsweredCount = parseInt(localStorage.getItem('jardin_answered'));
        if (localStorage.getItem('jardin_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_pseudo');
        if (localStorage.getItem('jardin_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_avatar_count'));
        }
        trackDailyVisits();
        renderTrophiesList();
    }

    function saveUserData() {
        localStorage.setItem('jardin_score', score);
        localStorage.setItem('jardin_answered', questionsAnsweredCount);
        localStorage.setItem('jardin_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_avatar_count', avatarsChangesCount);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        if (avatarsChangesCount >= 3) unlockTrophy("t3");
        saveUserData();
    }

    function checkTrophies() {
        if (score >= 10) unlockTrophy("t1");
        if (score >= 100) unlockTrophy("t2");
        if (questionsAnsweredCount >= 20) unlockTrophy("t6");
        if (score >= 1000) unlockTrophy("t7");
    }

    function updateRankProgress() {
        const currentScore = Math.max(0, score);
        let currentRank = ranks[0];

        for (let r of ranks) {
            if (currentScore >= r.min) currentRank = r;
        }

        document.getElementById("rank-display").innerText = currentRank.title;
        document.getElementById("score-display").innerText = `${score} Pts`;

        const fillBar = document.getElementById("rank-progress-fill");
        const nextTitleElem = document.getElementById("rank-next-title");
        const pointsLeftElem = document.getElementById("rank-points-left");

        if (currentRank.max === Infinity) {
            fillBar.style.width = "100%";
            nextTitleElem.innerText = "Niveau Max !";
            pointsLeftElem.innerText = "🏆";
        } else {
            const range = currentRank.max - currentRank.min;
            const progress = currentScore - currentRank.min;
            const percentage = Math.min(100, Math.max(0, (progress / range) * 100));
            const pointsNeeded = currentRank.max - currentScore;

            fillBar.style.width = `${percentage}%`;
            nextTitleElem.innerText = `Suivant: ${currentRank.nextTitle}`;
            pointsLeftElem.innerText = `${pointsNeeded} pts restants`;
        }
        checkTrophies();
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadQuestion() {
        const randomIndex = Math.floor(Math.random() * quizData.length);
        currentQuestionData = quizData[randomIndex];

        document.getElementById("question").innerText = currentQuestionData.question;
        
        const shuffledOptions = shuffleArray(currentQuestionData.options);
        correctButtonIndex = shuffledOptions.indexOf(currentQuestionData.correctAnswer);

        const optsContainer = document.getElementById("options");
        optsContainer.innerHTML = "";

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        shuffledOptions.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });

        updateRankProgress();
    }

    function selectOption(index) {
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctButtonIndex) {
                btn.style.background = "#15803d";
                btn.style.borderColor = "#4ade80";
            } else if (idx === index) {
                btn.style.background = "#b91c1c";
                btn.style.borderColor = "#f87171";
            }
        });

        const expBox = document.getElementById("explanation-box");
        const notice = document.getElementById("points-notice");
        const expText = document.getElementById("explanation");

        questionsAnsweredCount++;

        if (index === correctButtonIndex) {
            score += 10;
            consecutiveSuccess++;
            consecutiveErrors = 0;
            notice.innerText = "✅ Bonne réponse ! (+10 Pts)";
            notice.style.color = "#4ade80";
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
        } else {
            score -= 5;
            consecutiveErrors++;
            consecutiveSuccess = 0;
            notice.innerText = "❌ Mauvaise réponse ! (-5 Pts)";
            notice.style.color = "#f87171";
            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        updateRankProgress();
        saveUserData();

        expText.innerText = currentQuestionData.explanation;
        expBox.style.display = "block";

        const wikiBtn = document.getElementById("wiki-btn");
        wikiBtn.href = currentQuestionData.wiki;
        wikiBtn.style.display = "flex";

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        loadQuestion();
    }

    function shareScore() {
        const pseudo = document.getElementById("username-input").value || "Un jardinier";
        const rank = document.getElementById("rank-display").innerText;
        const shareText = `🌱 Viens tester tes connaissances sur Jardin Quiz ! ${pseudo} a atteint le rang de ${rank} avec ${score} points ! Viens relever le défi ! 🌿`;

        if (navigator.share) {
            navigator.share({
                title: 'Jardin Quiz',
                text: shareText,
                url: window.location.href,
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(shareText + " " + window.location.href);
            alert("Lien et score copiés dans le presse-papier !");
        }
    }

    loadUserData();
    loadQuestion();
</script>
</body>
</html>
