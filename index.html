<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Jardinier - Expert Pro 🌿</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        @keyframes flashSuccess {
            0% { background: #1e293b; }
            50% { background: rgba(34, 197, 94, 0.4); transform: scale(1.01); }
            100% { background: #1e293b; transform: scale(1); }
        }

        @keyframes flashError {
            0% { background: #1e293b; transform: translateX(0); }
            20% { transform: translateX(-6px); background: rgba(239, 68, 68, 0.4); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); background: #1e293b; }
        }

        .mobile-container.success-anim {
            animation: flashSuccess 0.5s ease;
        }

        .mobile-container.error-anim {
            animation: flashError 0.5s ease;
        }

        /* Top Profile Section */
        .top-profile-section {
            background: #0f172a;
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .user-profile-card {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            flex: 1;
            min-width: 0;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 2px solid #4ade80;
            flex-shrink: 0;
        }

        .profile-info {
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .profile-name-display {
            color: #f8fafc;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-subtitle {
            font-size: 10px;
            color: #38bdf8;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 5px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Progress Bar & Points Section */
        .progress-bar-container {
            background: #111827;
            padding: 10px 16px;
            border-bottom: 1px solid #334155;
        }

        .progress-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .rank-title {
            font-size: 11px;
            color: #facc15;
            font-weight: 700;
        }

        .score-badges-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .combo-badge {
            background: rgba(249, 115, 22, 0.15);
            color: #fdba74;
            padding: 3px 6px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
            border: 1px solid rgba(249, 115, 22, 0.3);
            display: none;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 3px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #facc15);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Jokers Bar */
        .jokers-bar {
            display: flex;
            gap: 6px;
            padding: 8px 16px 0 16px;
            background: #1e293b;
        }

        .joker-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .joker-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #334155;
            color: #94a3b8;
        }

        /* App Content */
        .app-content {
            flex: 1;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .quiz-box {
            background: #334155;
            border-radius: 12px;
            padding: 12px;
        }

        .question-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .question-text {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 8px 10px;
            border-radius: 9px;
            font-size: 11.5px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.25;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #4ade80;
        }

        .option-btn.hidden-by-joker {
            display: none;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 9px;
            padding: 8px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 11px;
            color: #e2e8f0;
            line-height: 1.25;
            margin-top: 2px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 11.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 7px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11.5px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 7px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11.5px;
            cursor: pointer;
            width: 100%;
        }

        /* Modals */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon { font-size: 24px; }
        .trophy-details h4 { font-size: 13px; color: #f8fafc; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #94a3b8; }

        .profile-edit-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .avatar-selection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .avatar-option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            font-size: 28px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .avatar-option-btn.selected {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
        }

        .form-input {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 700;
            padding: 10px;
            border-radius: 10px;
            outline: none;
        }

        .form-input:focus {
            border-color: #38bdf8;
        }

        .save-profile-btn {
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container" id="main-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <!-- Modale Trophées -->
    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Grades</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <!-- Modale Espace Profil -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">⚙️ Mon Espace Profil</div>
                <button class="close-modal" onclick="toggleProfileModal()">×</button>
            </div>
            <div class="profile-edit-body">
                <div class="form-group">
                    <label class="form-label">Changer de prénom / pseudo :</label>
                    <input type="text" class="form-input" id="modal-username-input" placeholder="Ton prénom...">
                </div>
                <div class="form-group">
                    <label class="form-label">Choisir ton avatar :</label>
                    <div class="avatar-selection-grid" id="avatar-grid"></div>
                </div>
                <button class="save-profile-btn" onclick="saveProfileChanges()">Enregistrer les modifications</button>
            </div>
        </div>
    </div>

    <!-- 1. INTERFACE PROFIL EN HAUT (Avatar + Prénom) -->
    <div class="top-profile-section">
        <div class="user-profile-card" onclick="toggleProfileModal()">
            <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            <div class="profile-info">
                <div class="profile-name-display" id="profile-name-view">JardinierExpert</div>
                <div class="profile-subtitle">⚙️ Cliquer pour modifier le profil</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
        </div>
    </div>

    <!-- 2. BARRE DE PROGRESSION AVEC SYSTEME DE POINTS (En dessous) -->
    <div class="progress-bar-container">
        <div class="progress-top-row">
            <div class="rank-title" id="rank-display">🌱 Graine de radis</div>
            <div class="score-badges-group">
                <div class="combo-badge" id="combo-badge">🔥 x0</div>
                <div class="score-badge" id="score-display">0 Pts</div>
            </div>
        </div>
        <div class="progress-info">
            <span id="progress-text-label">Grade suivant : Pousse tendre</span>
            <span id="progress-percent-label">0%</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- Barre des Jokers -->
    <div class="jokers-bar">
        <button class="joker-btn" id="joker-50" onclick="useJoker50()">✂️ 50/50 (<span id="count-50">2</span>)</button>
        <button class="joker-btn" id="joker-tip" onclick="useJokerTip()">💡 Indice (<span id="count-tip">2</span>)</button>
    </div>

    <!-- Contenu du Quiz (Questions client jardinier) -->
    <div class="app-content">
        <div class="quiz-box">
            <div class="question-title">❓ QUESTION CLIENT</div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

<script>
    // Questions axées exclusivement sur les questions que les clients posent à un jardinier (Plantation, Parasites, Pelouse, Arrosage, Exposition, etc.)
    const uniqueQuizPool = [
        // --- PELOUSE / GAZON ---
        { q: "Un client vous demande : 'À quelle fréquence faut-il tondre ma pelouse au printemps ?'", correct: "Toutes les semaines pour stimuler l'épaississement du gazon sans l'épuiser", wrongs: ["Une seule fois par mois pour laisser monter les fleurs", "Tous les jours à ras pour brûler les racines", "Jamais, la pelouse s'entretient toute seule"], exp: "Au printemps, la pousse est rapide. Une coupe hebdomadaires favorise un tapis dense et vigoureux.", wiki: "https://fr.wikipedia.org/wiki/Tonte_de_pelouse" },
        { q: "Un propriétaire s'inquiète de la mousse dans sa pelouse orientée au nord. Que lui conseillez-vous ?", correct: "De scarifier le gazon pour éliminer la mousse et d'amender la terre avec un peu de chaux", wrongs: ["De verser de l'eau de Javel pure sur toute la surface", "De retourner entièrement le jardin avec un bulldozer", "D'arroser abondamment tous les soirs avec de l'eau salée"], exp: "La mousse se développe sur les sols acides et humides. La scarification et un chaulage modéré aident grandement.", wiki: "https://fr.wikipedia.org/wiki/Scarification_(horticulture)" },
        { q: "Comment répondre à un client qui demande quand semer une nouvelle pelouse ?[cite: 1]", correct: "De préférence en automne ou au printemps, quand la terre est humide et tempérée", wrongs: ["En plein mois d'août pendant la canicule sous le soleil brûlant", "En plein hiver lorsque le sol est totalement gelé", "Uniquement la nuit sous la pleine lune"], exp: "L'automne offre une terre encore chaude et des pluies régulières idéales pour la germination des graines de gazon.", wiki: "https://fr.wikipedia.org/wiki/Gazon" },

        // --- PLANTATION ---
        { q: "Un client demande : 'Quelle est la profondeur idéale pour creuser le trou de plantation d'un arbuste ?'", correct: "Environ deux fois la taille de la motte en largeur, et la même profondeur", wrongs: ["Un trou minuscule d'à peine 5 centimètres de profondeur", "Un trou immense de 3 mètres de profondeur pour cacher les racines", "Pas besoin de trou, il suffit de poser l'arbuste sur la pelouse"], exp: "Ameublir la terre en largeur aide les jeunes racines à s'étaler facilement sans s'asphyxier.", wiki: "https://fr.wikipedia.org/wiki/Plantation" },
        { q: "Que répondre à un client qui souhaite savoir pourquoi il faut 'praliner' les racines nues avant de planter ?[cite: 1]", correct: "Pour enrober les racines d'un mélange d'argile et d'eau afin d'éviter qu'elles ne se dessèchent", wrongs: ["Pour empoisonner les vers de terre et les parasites souterrains", "Pour colorer les racines en rose fluo pour les retrouver", "Pour chauffer l'arbre et simuler l'été en plein hiver"], exp: "Le pralinage protège la jeune plante contre la déshydratation et stimule le départ des radicelles.", wiki: "https://fr.wikipedia.org/wiki/Pralinage" },
        { q: "Un client demande : 'Pourquoi faut-il veiller à ne pas enterrer le collet de mon arbre ?'", correct: "Pour éviter que l'humidité ne fasse pourrir la base du tronc", wrongs: ["Pour que l'arbre puisse marcher s'il se sent mal placé", "Parce que l'arbre ne produira sinon que des fruits carrés", "Pour que le vent puisse arracher plus facilement les feuilles"], exp: "Le collet (jonction racines-tronc) doit toujours rester au niveau de l'air libre pour respirer.", wiki: "https://fr.wikipedia.org/wiki/Collet_(botanique)" },

        // --- ARROSAGE ---
        { q: "Un client vous demande : 'À quel moment de la journée dois-je arroser mon potager en été ?'", correct: "Tôt le matin ou tard le soir après le coucher du soleil", wrongs: ["À midi pile sous le soleil le plus fort", "Entre 14h et 16h pour rafraîchir les feuilles", "En pleine nuit sous l'orage uniquement"], exp: "Cela limite l'évaporation de l'eau et évite l'effet loupe qui brûlerait le feuillage.", wiki: "https://fr.wikipedia.org/wiki/Arrosage" },
        { q: "Que répondre à un client qui se plaint de devoir arroser trop souvent ses massifs ?[cite: 1]", correct: "Installez un paillage organique au pied des plantes pour retenir l'humidité", wrongs: ["Recouvrez toute la terre avec du plastique noir étanche au soleil", "Arrêtez complètement d'arroser pour endurcir les plantes de force", "Arrosez avec de l'eau salée pour créer de l'énergie"], exp: "Le paillis (mulching) protège la terre du rayonnement direct et réduit l'évaporation de plus de 50%.", wiki: "https://fr.wikipedia.org/wiki/Paillis" },
        { q: "Un client demande comment arroser ses tomates sans attraper le mildiou :", correct: "Arrosez uniquement au pied, directement sur la terre, sans jamais mouiller les feuilles", wrongs: ["Immergez le plant entier dans l'eau tous les matins", "Aspergez vigoureusement le feuillage avec de l'eau glacée", "Utilisez un brumisateur sur les fruits deux fois par jour"], exp: "L'humidité stagnante sur le feuillage des tomates favorise le développement des champignons pathogènes.", wiki: "https://fr.wikipedia.org/wiki/Tomate" },

        // --- PARASITES ET MALADIES ---
        { q: "Un client inquiet vous montre des jeunes pousses couvertes de petits insectes collants et de miellat. Qu'est-ce que c'est ?[cite: 1]", correct: "Des pucerons", wrongs: ["Des mini-coccinelles carnivores géantes", "Des vers de terre volants", "Des graines de fleurs sauvages"], exp: "Les pucerons pullulent au printemps sur les tiges tendres et sucent la sève de la plante.", wiki: "https://fr.wikipedia.org/wiki/Aphidoidea" },
        { q: "Que conseiller à un client dont les feuilles de rosiers se couvrent d'une poudre blanche caractéristique ?[cite: 1]", correct: "Traiter contre l'oïdium (maladie du blanc) avec du purin de prêle ou un produit adapté", wrongs: ["Mettre de la farine blanche partout pour camoufler", "Couper immédiatement toutes les racines de la plante", "Arroser les feuilles avec de l'huile de vidange"], exp: "L'oïdium est un champignon favorisé par l'alternance de nuits fraîches et de journées chaudes.", wiki: "https://fr.wikipedia.org/wiki/O%C3%AFdium" },
        { q: "Un client s'aperçoit que sa haie de buis est dévorée par de petites chenilles vertes. De quel nuisible s'agit-il ?[cite: 1]", correct: "La pyrale du buis", wrongs: ["Le ver de terre lucifuge", "Le papillon de nuit inoffensif", "La coccinelle asiatique"], exp: "La pyrale du buis est un ravageur invasif redoutable pour les jardins de buis.", wiki: "https://fr.wikipedia.org/wiki/Pyrale_du_buis" },

        // --- EXPOSITION DES PLANTES ---
        { q: "Un client vous demande : 'Quelle plante puis-je installer dans un coin de jardin totalement ombragé ?'", correct: "Des fougères, des hostas ou des hortensias", wrongs: ["De la lavande officinale et du thym sauvage", "Des cactus du désert mexicain", "Des tournesols géants assoiffés de soleil"], exp: "Les hortensias et les hostas apprécient la mi-ombre et redoutent le plein soleil brûlant.", wiki: "https://fr.wikipedia.org/wiki/Hydrangea" },
        { q: "Un client souhaite créer un massif très ensoleillé et sec. Que lui suggérez-vous ?[cite: 1]", correct: "De la lavande, du romarin et du ciste", wrongs: ["Des plantes aquatiques de marécage", "Des fougères des sous-bois tropicaux", "Des mousses de forêt ombragée"], exp: "Ces plantes méditerranéennes supportent parfaitement la sécheresse et adorent le plein soleil.", wiki: "https://fr.wikipedia.org/wiki/Lavande" }
    ];

    let quizData = shuffleArray([...uniqueQuizPool]);
    let score = 0;
    let currentQuestionIndex = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let comboCount = 0;

    let jokers50Left = 2;
    let jokersTipLeft = 2;

    const avatars = ["👨‍🌾", "👩‍🌾", "👷‍♂️", "🚜", "🌿", "🧑‍🌾", "🌻", "🌲", "🍄"];
    let currentAvatar = "👨‍🌾";
    let selectedAvatarInModal = "👨‍🌾";

    const ranks = [
        { min: 0, max: 150, title: "🌱 Graine de radis" },
        { min: 150, max: 400, title: "🌿 Pousse tendre" },
        { min: 400, max: 800, title: "🪴 Apprenti jardinier" },
        { min: 800, max: 1500, title: "🌻 Jardinier confirmé" },
        { min: 1500, max: 3000, title: "👑 Sage botaniste" }
    ];

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première Question Réussie", desc: "Donner votre première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Conseiller Vert", desc: "Atteindre 150 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Tenue", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "⚠️", title: "Diagnostic Difficile", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "⭐", title: "Main Verte", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "🔥", title: "En Feu !", desc: "Atteindre un combo de 5", unlocked: false },
        { id: "t7", icon: "🏆", title: "Maître Paysagiste", desc: "Atteindre 1000 points", unlocked: false }
    ];

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateRankDisplay() {
        let currentRank = ranks[0];
        for (let r of ranks) {
            if (score >= r.min) currentRank = r;
        }
        document.getElementById("rank-display").innerText = currentRank.title;

        let nextRankObj = ranks.find(r => r.min > score);
        let progressPercent = 100;
        let progressLabelText = "Niveau Max Atteint ! 👑";

        if (nextRankObj) {
            let span = nextRankObj.min - currentRank.min;
            let currentProgress = score - currentRank.min;
            progressPercent = Math.min(100, Math.max(0, Math.floor((currentProgress / span) * 100)));
            progressLabelText = `Suivant : ${nextRankObj.title}`;
        }

        document.getElementById("progress-text-label").innerText = progressLabelText;
        document.getElementById("progress-percent-label").innerText = progressPercent + "%";
        document.getElementById("progress-fill").style.width = progressPercent + "%";
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_client_score_500')) score = parseInt(localStorage.getItem('jardin_client_score_500'));
        
        let savedPseudo = localStorage.getItem('jardin_client_pseudo_500') || "JardinierExpert";
        document.getElementById("profile-name-view").innerText = savedPseudo;
        document.getElementById("modal-username-input").value = savedPseudo;

        if (localStorage.getItem('jardin_client_avatar_500')) {
            currentAvatar = localStorage.getItem('jardin_client_avatar_500');
            document.getElementById("avatar-display").innerText = currentAvatar;
        }
        selectedAvatarInModal = currentAvatar;

        if (localStorage.getItem('jardin_client_trophies_500')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_client_trophies_500'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_client_avatar_count_500')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_client_avatar_count_500'));
        }
        if (localStorage.getItem('jardin_client_jokers_50_500')) jokers50Left = parseInt(localStorage.getItem('jardin_client_jokers_50_500'));
        if (localStorage.getItem('jardin_client_jokers_tip_500')) jokersTipLeft = parseInt(localStorage.getItem('jardin_client_jokers_tip_500'));

        renderAvatarGrid();
        renderTrophiesList();
        updateScoreDisplay();
        updateJokersUI();
        loadNextQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_client_score_500', score);
        localStorage.setItem('jardin_client_pseudo_500', document.getElementById("profile-name-view").innerText);
        localStorage.setItem('jardin_client_avatar_500', currentAvatar);
        localStorage.setItem('jardin_client_avatar_count_500', avatarsChangesCount);
        localStorage.setItem('jardin_client_jokers_50_500', jokers50Left);
        localStorage.setItem('jardin_client_jokers_tip_500', jokersTipLeft);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_client_trophies_500', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function toggleProfileModal() {
        const modal = document.getElementById("profile-modal");
        if (modal.style.display === "flex") {
            modal.style.display = "none";
        } else {
            document.getElementById("modal-username-input").value = document.getElementById("profile-name-view").innerText;
            selectedAvatarInModal = currentAvatar;
            renderAvatarGrid();
            modal.style.display = "flex";
        }
    }

    function renderAvatarGrid() {
        const grid = document.getElementById("avatar-grid");
        grid.innerHTML = "";
        avatars.forEach(av => {
            const btn = document.createElement("button");
            btn.className = "avatar-option-btn " + (av === selectedAvatarInModal ? "selected" : "");
            btn.innerText = av;
            btn.onclick = () => {
                selectedAvatarInModal = av;
                renderAvatarGrid();
            };
            grid.appendChild(btn);
        });
    }

    function saveProfileChanges() {
        const newName = document.getElementById("modal-username-input").value.trim();
        if (newName) {
            document.getElementById("profile-name-view").innerText = newName;
        }

        if (currentAvatar !== selectedAvatarInModal) {
            currentAvatar = selectedAvatarInModal;
            document.getElementById("avatar-display").innerText = currentAvatar;
            avatarsChangesCount++;
            if (avatarsChangesCount >= 3) {
                unlockTrophy("t3");
            }
        }

        saveUserData();
        toggleProfileModal();
        showAchievement("✨ Profil mis à jour avec succès !");
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = score + " Pts";
        updateRankDisplay();
    }

    function updateJokersUI() {
        document.getElementById("count-50").innerText = jokers50Left;
        document.getElementById("count-tip").innerText = jokersTipLeft;
        document.getElementById("joker-50").disabled = (jokers50Left <= 0);
        document.getElementById("joker-tip").disabled = (jokersTipLeft <= 0);
    }

    function loadNextQuestion() {
        if (currentQuestionIndex >= quizData.length) {
            currentQuestionIndex = 0;
            quizData = shuffleArray([...uniqueQuizPool]);
        }

        currentQuestionObj = quizData[currentQuestionIndex];
        document.getElementById("question").innerText = currentQuestionObj.q;

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        allOptions = shuffleArray(allOptions);
        shuffledOptionsCache = allOptions;

        allOptions.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
    }

    function triggerAnimation(isSuccess) {
        const container = document.getElementById("main-container");
        container.classList.remove("success-anim", "error-anim");
        void container.offsetWidth;
        if (isSuccess) {
            container.classList.add("success-anim");
        } else {
            container.classList.add("error-anim");
        }
    }

    function selectAnswer(selectedIndex) {
        const selectedText = shuffledOptionsCache[selectedIndex];
        const isCorrect = (selectedText === currentQuestionObj.correct);

        triggerAnimation(isCorrect);

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            btn.disabled = true;
            if (shuffledOptionsCache[idx] === currentQuestionObj.correct) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex && !isCorrect) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        const wikiBtn = document.getElementById("wiki-btn");
        const nextBtn = document.getElementById("next-btn");
        const comboBadge = document.getElementById("combo-badge");

        explanationBox.style.display = "block";

        if (isCorrect) {
            consecutiveSuccess++;
            consecutiveErrors = 0;
            comboCount++;

            // +10 points de base + bonus combo
            let earnedPoints = 10 + (comboCount * 4);
            score += earnedPoints;

            pointsNotice.innerText = `✅ Bonne réponse ! (+${earnedPoints} Pts avec Combo x${comboCount})`;
            pointsNotice.style.color = "#4ade80";

            unlockTrophy("t1");
            if (score >= 150) unlockTrophy("t2");
            if (score >= 1000) unlockTrophy("t7");
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
            if (comboCount >= 5) {
                unlockTrophy("t6");
            }
        } else {
            consecutiveErrors++;
            consecutiveSuccess = 0;
            comboCount = 0;

            // -15 points pour mauvaise réponse demandée
            let penaltyPoints = 15;
            score = Math.max(0, score - penaltyPoints);

            pointsNotice.innerText = `❌ Mauvaise réponse ! (-${penaltyPoints} Pts)`;
            pointsNotice.style.color = "#f87171";

            if (consecutiveErrors >= 3) {
                unlockTrophy("t4");
            }
        }

        if (comboCount > 1) {
            comboBadge.style.display = "block";
            comboBadge.innerText = "🔥 x" + comboCount;
        } else {
            comboBadge.style.display = "none";
        }

        explanationText.innerText = currentQuestionObj.exp;

        if (currentQuestionObj.wiki) {
            wikiBtn.style.display = "flex";
            wikiBtn.href = currentQuestionObj.wiki;
        }

        nextBtn.style.display = "block";
        updateScoreDisplay();
        saveUserData();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadNextQuestion();
    }

    function useJoker50() {
        if (jokers50Left <= 0) return;
        jokers50Left--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        let hiddenCount = 0;

        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && hiddenCount < 2) {
                btn.classList.add("hidden-by-joker");
                hiddenCount++;
            }
        });
        saveUserData();
    }

    function useJokerTip() {
        if (jokersTipLeft <= 0) return;
        jokersTipLeft--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && !btn.classList.contains("hidden-by-joker")) {
                btn.style.opacity = "0.3";
            }
        });
        saveUserData();
    }

    function shareScore() {
        const text = `J'ai atteint ${score} points sur le Quiz Jardinier Pro ! Viens tester tes connaissances.`;
        if (navigator.share) {
            navigator.share({ title: 'Quiz Jardinier', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
    </html>
