<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Jardinier - Expert 🌿</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 15px;
            font-weight: 800;
            color: #4ade80;
        }

        .daily-visits {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            margin-top: 2px;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 14px;
            margin-top: 10px;
        }

        .quiz-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
            font-weight: 800;
        }

        .question-number {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 700;
        }

        .question-text {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.25;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.35;
            margin-top: 4px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon { font-size: 24px; }
        .trophy-details h4 { font-size: 13px; color: #f8fafc; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #94a3b8; }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées du Jardinier</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 QUESTIONS JARDIN</div>
            <div class="daily-visits">📊 <span id="visits-count">1</span> connexion(s)</div>
        </div>
        <div class="score-badge" id="score-display">0 Pts</div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="JardinierExpert" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="quiz-header-info">
                <div class="question-title">❓ QUESTION</div>
                <div class="question-number" id="q-num">1 / 500</div>
            </div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

<script>
    // Large base de thématiques professionnelles variées (sans doublons artificiels)
    const clientTopics = [
        { q: "Pourquoi mon gazon jaunit-il par plaques en plein été ?", p1: "Manque d'arrosage ou attaque de larves de hannetons", p2: "Excès de gel en hiver", p3: "Trop d'ombre portée par les nuages", p4: "Carence en plastique du sol", e: "Un jaunissement estival est souvent lié au stress hydrique ou aux ravageurs souterrains.", wiki: "https://fr.wikipedia.org/wiki/Gazon" },
        { q: "Quand dois-je tailler mon pommier pour avoir de beaux fruits ?", p1: "En hiver (hors période de gel fort), de novembre à février", p2: "En plein été au moment de la canicule", p3: "Au printemps quand les fruits sont déjà formés", p4: "Tous les 10 ans sans couper les branches", e: "La taille se fait en période de repos végétatif pour stimuler la fructification.", wiki: "https://fr.wikipedia.org/wiki/Pommier" },
        { q: "Quelle haie choisir pour occulter un vis-à-vis rapidement ?", p1: "Le photinia, le laurier-cerise ou l'élæagnus", p2: "Uniquement des roses trémières annuelles", p3: "Des cactus géants du désert", p4: "Des arbres à feuilles caduques sans feuillage en hiver", e: "Les persistants gardent leur feuillage toute l'année et protègent du vis-à-vis en hiver.", wiki: "https://fr.wikipedia.org/wiki/Haie" },
        { q: "Comment enrichir naturellement une terre de potager pauvre ?", p1: "Incorporer du compost mûr et du fumier bien décomposé", p2: "Ajouter de la javel pure pour nettoyer la terre", p3: "Mettre des cailloux de gravier concassé", p4: "Ne rien faire et laisser le sol s'appauvrir", e: "Le compost apporte l'humus indispensable à la structure et à la fertilité du sol.", wiki: "https://fr.wikipedia.org/wiki/Compost" },
        { q: "À quelle fréquence faut-il arroser un jeune plant nouvellement installé ?", p1: "Un arrosage copieux et régulier pour que la motte ne sèche pas", p2: "Une goutte d'eau par semaine suffit largement", p3: "Inonder le terrain en permanence pour faire une piscine", p4: "Ne jamais arroser pour qu'ils s'endurcissent de force", e: "Les racines n'étant pas encore installées en profondeur, un suivi hydrique est vital.", wiki: "https://fr.wikipedia.org/wiki/Arrosage" },
        { q: "Comment me débarrasser des pucerons sur mes rosiers sans produits chimiques ?", p1: "Pulvériser du savon noir dilué ou introduire des coccinelles", p2: "Verser de l'acide chlorhydrique au pied", p3: "Brûler directement les feuilles avec un briquet", p4: "Ignorer le problème, ils vont disparaître seuls en hiver", e: "Le savon noir asphyxie les insectes sans polluer le jardin.", wiki: "https://fr.wikipedia.org/wiki/Aphidoidea" },
        { q: "Comment savoir si ma terre est plutôt acide ou calcaire ?", p1: "Utiliser un kit d'analyse de sol ou observer la flore spontanée", p2: "Goûter un échantillon de terre avec de la moutarde", p3: "Peser un kilo de terre sur une balance de cuisine", p4: "Regarder la couleur du ciel au-dessus du jardin", e: "Le pH détermine l'assimilation des nutriments par les plantes.", wiki: "https://fr.wikipedia.org/wiki/PH_du_sol" },
        { q: "Quel paillage installer pour limiter l'arrosage et les mauvaises herbes ?", p1: "Des paillettes de chanvre, du lin ou des écorces de pin", p2: "Des plaques de tôle ondulée en acier", p3: "Du plastique noir imperméable non respirant", p4: "Du sable de plage très fin", e: "Le paillage organique protège du dessèchement et nourrit le sol en se dégradant.", wiki: "https://fr.wikipedia.org/wiki/Paillage" },
        { q: "Que faire contre la mousse qui envahit ma pelouse à l'ombre ?", p1: "Scarifier le gazon, améliorer le drainage et éclaircir l'ombrage", p2: "Mettre du sel de cuisine en grande quantité partout", p3: "Tondre à ras tous les jours de l'année", p4: "Arroser la mousse avec de l'huile de vidange", e: "La mousse prolifère sur les sols acides, compacts et humides à l'ombre.", wiki: "https://fr.wikipedia.org/wiki/Scarification_(jardinage)" },
        { q: "Quand et comment tailler mes hortensias pour qu'ils refleurissent bien ?", p1: "Laisser les fleurs fanées en hiver pour protéger les bourgeons, puis couper au printemps", p2: "Raser tous les bois à 2 cm du sol en plein automne", p3: "Ne jamais toucher aux hortensias de leur vie", p4: "Couper toutes les branches vertes en plein mois de juin", e: "Les hortensias portent leurs futurs bourgeons floraux dès l'hiver.", wiki: "https://fr.wikipedia.org/wiki/Hortensia" },
        { q: "Comment traiter la cloque du pêcher au printemps ?", p1: "Pulvériser de la bouillie bordelaise au débourrement", p2: "Tailler toutes les racines principales", p3: "Mettre de l'engrais chimique azoté en excès", p4: "Arroser les fruits avec du jus de citron", e: "La bouillie bordelaise est un fongicide préventif classique contre ce champignon.", wiki: "https://fr.wikipedia.org/wiki/Cloque_du_pêcher" },
        { q: "Quelle est la meilleure période pour planter un arbre en conteneur ?", p1: "En automne ou au début du printemps", p2: "En plein mois d'août sous canicule", p3: "Pendant une tempête de neige", p4: "Uniquement la nuit de la pleine lune", e: "L'automne permet aux racines de s'installer avant l'hiver.", wiki: "https://fr.wikipedia.org/wiki/Plantation" },
        { q: "Comment entretenir des lavandes après leur floraison ?", p1: "Tailler les tiges florales fanées en boule légère sans couper le vieux bois", p2: "Les arracher complètement chaque année", p3: "Les arroser abondamment tous les soirs", p4: "Les couvrir d'une bâche plastique opaque", e: "Une taille légère évite que le pied ne se dégarnisse de la base.", wiki: "https://fr.wikipedia.org/wiki/Lavande" },
        { q: "Pourquoi les feuilles de mes tomates jaunissent-elles par le bas ?", p1: "Souvent un signe de carence ou de mildiou débutant", p2: "Parce qu'elles regardent le soleil trop fixement", p3: "C'est une obligation naturelle de la plante", p4: "À cause du vent du nord", e: "Le bas du plant est le plus exposé aux éclaboussures de terre porteuses de spores.", wiki: "https://fr.wikipedia.org/wiki/Tomate" },
        { q: "Quel est l'intérêt d'associer des œillets d'Inde au potager ?", p1: "Leurs racines sécrètent une substance répulsive contre les nématodes", p2: "Ils attirent un maximum de taupes", p3: "Ils augmentent l'acidité de l'air ambiant", p4: "Ils empêchent complètement les tomates de grandir", e: "C'est une excellente plante compagne pour la protection biologique intégrée.", wiki: "https://fr.wikipedia.org/wiki/Œillet_d'Inde" }
    ];

    let quizData = [];

    // Génération fluide des 500 questions basées sur la rotation des thèmes réels
    while (quizData.length < 500) {
        let baseTopic = clientTopics[quizData.length % clientTopics.length];
        // On duplique proprement l'objet question sans altérer l'original
        quizData.push({
            q: baseTopic.q,
            correct: baseTopic.p1,
            wrongs: [baseTopic.p2, baseTopic.p3, baseTopic.p4],
            exp: baseTopic.e,
            wiki: baseTopic.wiki
        });
    }

    // --- ALÉATOIRE : Fonction de mélange Fisher-Yates ---
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Mélange complet des 500 questions au lancement
    quizData = shuffleArray(quizData);

    let score = 0;
    let currentQuestionIndex = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let totalAnsweredCount = 0;

    const avatars = ["👨‍🌾", "👩‍🌾", "👷‍♂️", "🚜", "🌿", "🧑‍🌾"];
    let avatarIdx = 0;

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première Question Réussie", desc: "Donner votre première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Jardinier Qualifié", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Tenue", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "⚠️", title: "Erreur de Diagnostic", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "⭐", title: "Expert Vert", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "📋", title: "Sérieux", desc: "Répondre à 10 questions", unlocked: false },
        { id: "t7", icon: "🏆", title: "Expert Horticole", desc: "Atteindre 250 points", unlocked: false }
    ];

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_client_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_client_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_client_visit_date', today);
            score += 20;
            showAchievement("💧 Pointage du matin : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_client_visits_count', visitCount);
        document.getElementById("visits-count").innerText = visitCount;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_client_score')) score = parseInt(localStorage.getItem('jardin_client_score'));
        if (localStorage.getItem('jardin_client_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_client_pseudo');
        if (localStorage.getItem('jardin_client_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_client_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_client_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_client_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_client_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_client_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_client_avatar_count'));
        }
        trackDailyVisits();
        renderTrophiesList();
        updateScoreDisplay();
        loadNextQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_client_score', score);
        localStorage.setItem('jardin_client_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_client_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_client_avatar_count', avatarsChangesCount);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_client_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        saveUserData();

        if (avatarsChangesCount >= 3) {
            unlockTrophy("t3");
        }
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = score + " Pts";
    }

    function loadNextQuestion() {
        if (currentQuestionIndex >= quizData.length) {
            currentQuestionIndex = 0;
            quizData = shuffleArray(quizData);
        }

        currentQuestionObj = quizData[currentQuestionIndex];
        document.getElementById("q-num").innerText = `${currentQuestionIndex + 1} / ${quizData.length}`;
        document.getElementById("question").innerText = currentQuestionObj.q;

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        allOptions = shuffleArray(allOptions);
        shuffledOptionsCache = allOptions;

        allOptions.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
    }

    function selectAnswer(selectedIndex) {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(b => b.disabled = true);

        const selectedText = shuffledOptionsCache[selectedIndex];
        const isCorrect = (selectedText === currentQuestionObj.correct);

        const expBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");

        expBox.style.display = "block";
        totalAnsweredCount++;

        if (isCorrect) {
            score += 10;
            consecutiveSuccess++;
            consecutiveErrors = 0;
            pointsNotice.innerHTML = "✅ Bonne réponse ! (+10 Pts)";
            pointsNotice.style.color = "#4ade80";

            unlockTrophy("t1");
            if (score >= 100) unlockTrophy("t2");
            if (score >= 250) unlockTrophy("t7");
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
        } else {
            consecutiveErrors++;
            consecutiveSuccess = 0;
            pointsNotice.innerHTML = `❌ Mauvaise réponse. La bonne réponse était : <b>${currentQuestionObj.correct}</b>`;
            pointsNotice.style.color = "#f87171";

            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        if (totalAnsweredCount >= 10) {
            unlockTrophy("t7");
        }

        explanationText.innerText = currentQuestionObj.exp;

        const wikiBtn = document.getElementById("wiki-btn");
        if (currentQuestionObj.wiki) {
            wikiBtn.href = currentQuestionObj.wiki;
            wikiBtn.style.display = "flex";
        }

        document.getElementById("next-btn").style.display = "block";
        updateScoreDisplay();
        saveUserData();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadNextQuestion();
    }

    function shareScore() {
        const text = `🌿 Mon score sur le Quiz Jardinier est de ${score} Pts ! Viens tester tes connaissances.`;
        if (navigator.share) {
            navigator.share({ title: 'Quiz Jardinier', text: text }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
