<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Parasites du Jardin</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --base-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #ffffff;
            --success-color: #4e9f3d;
            --error-color: #e94560;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Arrière-plan, base et expression unifiés[cite: 1] */
        .quiz-container {
            background-color: var(--base-color);
            border: 3px solid var(--accent-color);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* En-tête : Profil (Image + Nom) et Score */
        .header-profile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--text-color);
            object-fit: cover;
            background-color: #fff;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        .user-name {
            font-size: 18px;
            font-weight: bold;
        }

        .score-board {
            text-align: right;
        }

        .score-board span {
            display: block;
            font-size: 14px;
            color: #b2bec3;
        }

        .score-board strong {
            font-size: 20px;
            color: #00cec9;
        }

        /* Barre de progression */
        .progress-bar-container {
            width: 100%;
            background-color: #0f3460;
            border-radius: 10px;
            height: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #00cec9;
            transition: width 0.4s ease;
        }

        /* Zone de question et expression faciale[cite: 1] */
        .question-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .facial-expression {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            min-height: 60px;
        }

        /* Options de réponses */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-option {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-align: left;
        }

        .btn-option:hover {
            background-color: #1f4068;
            transform: translateY(-2px);
        }

        /* Effets visuels Victoire / Échec */
        .quiz-container.victory {
            border-color: var(--success-color);
            box-shadow: 0 0 30px var(--success-color);
        }

        .quiz-container.failure {
            border-color: var(--error-color);
            box-shadow: 0 0 30px var(--error-color);
        }

        /* Lien Wikipédia */
        .wiki-link-container {
            text-align: center;
            margin-top: 15px;
        }

        .wiki-link {
            color: #74b9ff;
            text-decoration: none;
            font-size: 14px;
            font-style: italic;
        }

        .wiki-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="quiz-container" id="quizContainer">
        <!-- En-tête Profil & Score -->
        <div class="header-profile">
            <div class="user-info">
                <img src="https://via.placeholder.com/150" alt="Avatar" class="user-avatar" id="userAvatar" title="Cliquez pour changer d'avatar">
                <div class="user-name" id="userName">Utilisateur</div>
            </div>
            <div class="score-board">
                <span>Score</span>
                <strong id="scoreDisplay">0 pts</strong>
            </div>
        </div>

        <!-- Barre de progression -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Zone Question & Expression[cite: 1] -->
        <div class="question-section">
            <div class="facial-expression" id="facialExpression">😐</div>
            <div class="question-text" id="questionText">Chargement de la question...</div>
        </div>

        <!-- Options -->
        <div class="options-container" id="optionsContainer"></div>

        <!-- Lien Wikipédia -->
        <div class="wiki-link-container" id="wikiContainer"></div>
    </div>

    <script>
        // --- 1. GESTION DE LA MÉMOIRE DU JOUEUR (LOCALSTORAGE) ---
        let playerName = localStorage.getItem("quiz_player_name");
        if (!playerName) {
            playerName = prompt("Entrez votre nom de joueur :") || "Jardinier";
            localStorage.setItem("quiz_player_name", playerName);
        }
        document.getElementById("userName").innerText = playerName;

        let playerAvatar = localStorage.getItem("quiz_player_avatar");
        if (!playerAvatar) {
            playerAvatar = "https://via.placeholder.com/150";
            localStorage.setItem("quiz_player_avatar", playerAvatar);
        }
        const avatarImg = document.getElementById("userAvatar");
        avatarImg.src = playerAvatar;

        // Permettre de changer l'avatar en cliquant dessus
        avatarImg.onclick = () => {
            let newAvatar = prompt("Entrez l'URL de votre nouvelle image d'avatar :", playerAvatar);
            if (newAvatar) {
                playerAvatar = newAvatar;
                localStorage.setItem("quiz_player_avatar", playerAvatar);
                avatarImg.src = playerAvatar;
            }
        };

        // --- 2. BASE DE 50 QUESTIONS SUR LES PARASITES ---
        const questionsOriginales = [
            {

                wiki: "https://fr.wikipedia.org/wiki/Processionnaire_du_pin"
            },

                wiki: "https://fr.wikipedia.org/wiki/Cameraria_ohridella"

            {

            {

            },

                question: "Quelle petite mouche pond dans les cerises, rendant les fruits véreux à l'été ?",

                question: "Quelle petite drosophile asiatique pique les fruits rouges sains (fraises, framboises) en gâtant la récolte ?",

                correct: 0,
                wiki: "https://fr.wikipedia.org/wiki/Processionnaire_du_ch%C3%AAne"
            },
            {
                question: "Quel ravageur des serres, la noctuelle de la tomate (Helicoverpa armigera), cible particulièrement quelle partie ?",
                options: ["Les fruits et les bourgeons floraux", "Uniquement les racines", "Le tronc principal", "Les feuilles basses uniquement"],
                correct: 0,
                wiki: "https://fr.wikipedia.org/wiki/Helicoverpa_armigera"
            },
            {
                question: "Quel petit insecte sauteur transmet le virus de la mosaïque du concombre en piquant les potagers ?",
                options: ["Le puceron du melon et du cotonnier", "L'altise", "Le thrips", "L'aleurode"],
                correct: 0,
                wiki: "https://fr.wikipedia.org/wiki/Aphis_gossypii"
            },
            {
                question: "Quelle méthode biologique utilise-t-on fréquemment pour lutter contre la pyrale du buis de façon écologique ?",
                options: ["Bacillus thuringiensis (Bt)", "Un engrais chimique azoté", "Un fongicide cuprique", "Du désherbant total"],
                correct: 0,
                wiki: "https://fr.wikipedia.org/wiki/Bacillus_thuringiensis"
            }
        ];

        // Mélange aléatoire des questions pour qu'elles n'arrivent jamais dans le même ordre et ne se répètent pas
        let questions = [...questionsOriginales].sort(() => Math.random() - 0.5);

        let currentQuestionIndex = 0;
        let score = 0;
        let combo = 0;

        const quizContainer = document.getElementById("quizContainer");
        const questionText = document.getElementById("questionText");
        const optionsContainer = document.getElementById("optionsContainer");
        const scoreDisplay = document.getElementById("scoreDisplay");
        const progressBar = document.getElementById("progressBar");
        const facialExpression = document.getElementById("facialExpression");
        const wikiContainer = document.getElementById("wikiContainer");

        function afficherQuestion() {
            if (currentQuestionIndex >= questions.length) {
                questionText.innerHTML = `Quiz terminé !<br>${playerName}, votre score final : ${score} points`;
                optionsContainer.innerHTML = "";
                wikiContainer.innerHTML = "";
                facialExpression.innerText = "🏆";
                progressBar.style.width = "100%";
                return;
            }

            // Mise à jour de la barre de progression
            const progressPercent = (currentQuestionIndex / questions.length) * 100;
            progressBar.style.width = `${progressPercent}%`;

            const q = questions[currentQuestionIndex];
            questionText.innerText = q.question;
            facialExpression.innerText = "😐"; // Base neutre[cite: 1]
            optionsContainer.innerHTML = "";
            wikiContainer.innerHTML = "";

            q.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.add("btn-option");
                button.onclick = () => verifierReponse(index);
                optionsContainer.appendChild(button);
            });
        }

        function verifierReponse(selectedIndex) {
            const q = questions[currentQuestionIndex];
            
            // Affichage du lien Wikipédia pour approfondir
            if (q.wiki) {
                wikiContainer.innerHTML = `<a href="${q.wiki}" target="_blank" class="wiki-link">📚 En savoir plus sur Wikipédia</a>`;
            }

            if (selectedIndex === q.correct) {
                // Victoire : +10 points de base + bonus de combo, effet visuel vert et expression heureuse
                combo++;
                const pointsGagnes = 10 + (combo - 1) * 5;
                score += pointsGagnes;
                
                quizContainer.classList.add("victory");
                setTimeout(() => quizContainer.classList.remove("victory"), 600);
                
                facialExpression.innerText = "🎉";
            } else {
                // Échec : -15 points, réinitialisation du combo, effet visuel rouge et expression triste
                score -= 15;
                combo = 0;
                
                quizContainer.classList.add("failure");
                setTimeout(() => quizContainer.classList.remove("failure"), 600);
                
                facialExpression.innerText = "❌";
            }

            scoreDisplay.innerText = `${score} pts`;
            currentQuestionIndex++;

            // Passer à la question suivante après un court délai
            setTimeout(() => {
                afficherQuestion();
            }, 1500);
        }

        // Lancement initial
        afficherQuestion();
    </script>
</body>
</html>
