<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Jardin - Niveau</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --base-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #ffffff;
            --success-color: #4e9f3d;
            --error-color: #e94560;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .quiz-container { background-color: var(--base-color); border: 3px solid var(--accent-color); border-radius: 15px; padding: 25px; width: 100%; max-width: 600px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5); position: relative; }
        
        /* En-tête */
        .header-profile { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #00cec9; background-color: #fff; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .user-avatar svg { width: 35px; height: 35px; }
        .score-info { text-align: right; }
        .level-badge { background: #00cec9; color: #1a1a2e; padding: 2px 8px; border-radius: 10px; font-weight: bold; font-size: 12px; margin-bottom: 4px; display: inline-block; }

        .progress-bar-container { width: 100%; background-color: #0f3460; border-radius: 10px; height: 12px; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background-color: #00cec9; transition: width 0.4s ease; }

        .question-text { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 20px; min-height: 50px; }
        .btn-option { background-color: var(--accent-color); color: var(--text-color); border: none; padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 10px; cursor: pointer; transition: 0.2s; text-align: left; }
        .btn-option:hover { background-color: #1f4068; }

        .wiki-link { color: #74b9ff; text-decoration: underline; font-size: 14px; display: block; text-align: center; margin-top: 15px; }

        /* Modal */
        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); border-radius: 15px; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .avatar-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .avatar-choice { width: 60px; height: 60px; cursor: pointer; border: 2px solid transparent; border-radius: 10px; background: #fff; display: flex; justify-content: center; align-items: center; }
        .avatar-choice:hover { border-color: #00cec9; }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Modal -->
        <div class="modal" id="avatarModal">
            <h3>Choix de l'avatar</h3>
            <div class="avatar-choices" id="avatarGrid"></div>
        </div>

        <div class="header-profile">
            <div style="display:flex; align-items:center; gap:10px;">
                <div class="user-avatar" id="currentAvatar" onclick="openModal()"></div>
                <div id="userName">Joueur</div>
            </div>
            <div class="score-info">
                <div class="level-badge" id="levelDisplay">Niveau 1</div>
                <div id="scoreDisplay">0 pts</div>
            </div>
        </div>

        <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
        <div class="question-text" id="questionText">Chargement...</div>
        <div id="optionsContainer"></div>
        <div id="wikiContainer"></div>
    </div>

<script>
    // --- ICONES DESSINÉES (SVG) ---
    const icons = {
        tree: `<svg viewBox="0 0 24 24" fill="#2d3436"><path d="M12 2L4 12h3l-4 8h7v-4h2v4h7l-4-8h3L12 2z"/></svg>`,
        gardener: `<svg viewBox="0 0 24 24" fill="#2d3436"><path d="M12 2C9.24 2 7 4.24 7 7v2h10V7c0-2.76-2.24-5-5-5zM4 11v2h16v-2H4zm0 3v7h16v-7H4z"/></svg>`,
        boy: `<svg viewBox="0 0 24 24" fill="#2d3436"><circle cx="12" cy="8" r="4"/><path d="M12 14c-4.42 0-8 3.58-8 8h16c0-4.42-3.58-8-8-8z"/></svg>`,
        girl: `<svg viewBox="0 0 24 24" fill="#2d3436"><path d="M12 2a4 4 0 0 0-4 4v2H6a2 2 0 0 0-2 2v2h2v8h12v-8h2v-2a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z"/></svg>`,
        flower: `<svg viewBox="0 0 24 24" fill="#d63031"><circle cx="12" cy="12" r="3" fill="#fdcb6e"/><path d="M12 2c-1 0-2 1-2 2v3c0 1 1 2 2 2s2-1 2-2V4c0-1-1-2-2-2zM12 22c1 0 2-1 2-2v-3c0-1-1-2-2-2s-2 1-2 2v3c0 1 1 2 2 2zM4 12c0 1 1 2 2 2h3c1 0 2-1 2-2s-1-2-2-2H6c-1 0-2 1-2 2zM22 12c0-1-1-2-2-2h-3c-1 0-2 1-2 2s1 2 2 2h3c1 0 2-1 2-2z"/></svg>`,
        watering: `<svg viewBox="0 0 24 24" fill="#2d3436"><path d="M22 16h-2c0-3.31-2.69-6-6-6V8c2.76 0 5 2.24 5 5h1l-1 3zm-2-4h-2c0-2.21-1.79-4-4-4V6c3.31 0 6 2.69 6 6zM2 18l1.5-6h13l-1.5 6H2z"/></svg>`
    };

    let score = 0;
    let currentQuestionIndex = 0;
    // Base de questions (tronquée pour l'exemple)
    const questions = [
        { q: "Quel insecte vert ou noir sécrète du miellat ?", a: ["Puceron", "Hanneton", "Coccinelle"], c: 0, w: "https://fr.wikipedia.org/wiki/Puceron" },
        { q: "Quelle chenille dévore les feuilles de buis ?", a: ["Pyrale", "Processionnaire", "Mineuse"], c: 0, w: "https://fr.wikipedia.org/wiki/Pyrale_du_buis" }
    ];

    function updateUI() {
        // Calcul du niveau
        const level = Math.floor(score / 100) + 1;
        document.getElementById("levelDisplay").innerText = "Niveau " + level;
        document.getElementById("scoreDisplay").innerText = score + " pts";
        
        // Progression
        document.getElementById("progressBar").style.width = ((score % 100) / 100) * 100 + "%";
    }

    function initAvatars() {
        const grid = document.getElementById("avatarGrid");
        Object.entries(icons).forEach(([key, svg]) => {
            const div = document.createElement("div");
            div.className = "avatar-choice";
            div.innerHTML = svg;
            div.onclick = () => {
                document.getElementById("currentAvatar").innerHTML = svg;
                document.getElementById("avatarModal").style.display = "none";
            };
            grid.appendChild(div);
        });
        document.getElementById("currentAvatar").innerHTML = icons.tree; // Par défaut
    }

    function openModal() { document.getElementById("avatarModal").style.display = "flex"; }

    function showQuestion() {
        if(currentQuestionIndex >= questions.length) {
            document.getElementById("questionText").innerText = "Quiz terminé ! Score final : " + score;
            document.getElementById("optionsContainer").innerHTML = "";
            return;
        }

        const q = questions[currentQuestionIndex];
        document.getElementById("questionText").innerText = q.q;
        
        // Wiki Link
        if(currentQuestionIndex > 0) {
            document.getElementById("wikiContainer").innerHTML = `<a href="${questions[currentQuestionIndex-1].w}" target="_blank" class="wiki-link">Wikipedia</a>`;
        }

        const cont = document.getElementById("optionsContainer");
        cont.innerHTML = "";
        q.a.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "btn-option";
            btn.innerText = opt;
            btn.onclick = () => {
                if(i === q.c) score += 50; // Gain 50
                else score = Math.max(0, score - 20); // Perte, min 0
                currentQuestionIndex++;
                updateUI();
                showQuestion();
            };
            cont.appendChild(btn);
        });
    }

    initAvatars();
    showQuestion();
</script>
</body>
</html>
