<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Jardinier Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #1e293b;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #4ade80;
            font-weight: bold;
        }
        .question {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn:hover:not(:disabled) {
            border-color: #4ade80;
        }
        .correct {
            background: rgba(34, 197, 94, 0.2) !important;
            border-color: #22c55e !important;
            color: #4ade80 !important;
        }
        .wrong {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }
        #next-btn {
            display: none;
            width: 100%;
            padding: 12px;
            background: #22c55e;
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>🌿 QUIZ JARDINIER</span>
        <span id="score-display">Score : 0 Pts</span>
    </div>
    <div class="question" id="question">Chargement...</div>
    <div id="options"></div>
    <button id="next-btn" onclick="nextQuestion()">Question suivante 🚀</button>
</div>

<script>
    const quizData = [
        { q: "Quelle est la principale utilité du binage régulier ?", correct: "Rompre la capillarité pour limiter l'évaporation de l'eau", wrongs: ["Tasser la terre en surface", "Enrichir le sol en roche mère", "Augmenter l'acidité du sol"] },
        { q: "Comment diviser une touffe de ciboulette ?", correct: "En déterrant délicatement la souche pour la séparer en éclats", wrongs: ["En coupant toutes les tiges à ras", "En prélevant uniquement les fleurs", "En taillant les racines sans sortir la touffe"] },
        { q: "Quelle technique employer pour planter des pommes de terre ?", correct: "Les planter germe vers le haut dans des sillons à 10-15 cm", wrongs: ["Les enterrer à plus de 40 cm de profondeur", "Les orienter germe vers le bas", "Les repiquer en surface sans terre"] }
    ];

    let currentIndex = 0;
    let score = 0;

    function loadQuestion() {
        const currentObj = quizData[currentIndex];
        document.getElementById("question").innerText = currentObj.q;

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        const allOptions = [currentObj.correct, ...currentObj.wrongs].sort(() => Math.random() - 0.5);

        allOptions.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(btn, opt === currentObj.correct);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("next-btn").style.display = "none";
    }

    function selectAnswer(selectedBtn, isCorrect) {
        const buttons = document.querySelectorAll(".btn");
        buttons.forEach(btn => {
            btn.disabled = true;
            if (btn.innerText === quizData[currentIndex].correct) {
                btn.classList.add("correct");
            }
        });

        if (isCorrect) {
            score += 10;
        } else {
            selectedBtn.classList.add("wrong");
        }

        document.getElementById("score-display").innerText = `Score : ${score} Pts`;
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentIndex = (currentIndex + 1) % quizData.length;
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
