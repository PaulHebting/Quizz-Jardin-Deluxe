<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quiz Jardinier - 500 Questions Pro 🌿</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 14px;
            font-weight: 800;
            color: #4ade80;
        }

        .rank-title {
            font-size: 11px;
            color: #facc15;
            font-weight: 700;
            margin-top: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .combo-badge {
            background: rgba(249, 115, 22, 0.15);
            color: #fdba74;
            padding: 5px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(249, 115, 22, 0.3);
            display: none;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 18px;
            padding: 10px 12px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .user-profile-card:hover {
            border-color: #38bdf8;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 2px solid #4ade80;
            flex-shrink: 0;
        }

        .profile-info {
            text-align: left;
            flex: 1;
            min-width: 0;
        }

        .profile-name-display {
            color: #f8fafc;
            font-size: 15px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-subtitle {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            margin-top: 2px;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .jokers-bar {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .joker-btn {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .joker-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #334155;
            color: #94a3b8;
        }

        .quiz-box {
            background: #334155;
            border-radius: 14px;
            padding: 12px;
            margin-top: 8px;
        }

        .question-title {
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #38bdf8;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .question-text {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 8px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 11px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.25;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #4ade80;
        }

        .option-btn.hidden-by-joker {
            display: none;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 10px;
            padding: 8px;
            margin-top: 6px;
        }

        .explanation-text {
            font-size: 12px;
            color: #e2e8f0;
            line-height: 1.3;
            margin-top: 3px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 12px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 8px;
            border-radius: 9px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 7px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon { font-size: 24px; }
        .trophy-details h4 { font-size: 13px; color: #f8fafc; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #94a3b8; }

        .profile-edit-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .avatar-selection-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .avatar-option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            font-size: 28px;
            padding: 10px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .avatar-option-btn.selected {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
        }

        .form-input {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f8fafc;
            font-size: 14px;
            font-weight: 700;
            padding: 10px;
            border-radius: 10px;
            outline: none;
        }

        .form-input:focus {
            border-color: #38bdf8;
        }

        .save-profile-btn {
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <!-- Modale Trophées -->
    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Grades</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <!-- Modale Espace Profil -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">⚙️ Mon Espace Profil</div>
                <button class="close-modal" onclick="toggleProfileModal()">×</button>
            </div>
            <div class="profile-edit-body">
                <div class="form-group">
                    <label class="form-label">Changer de nom :</label>
                    <input type="text" class="form-input" id="modal-username-input" placeholder="Ton pseudo...">
                </div>
                <div class="form-group">
                    <label class="form-label">Choisir ton avatar :</label>
                    <div class="avatar-selection-grid" id="avatar-grid"></div>
                </div>
                <button class="save-profile-btn" onclick="saveProfileChanges()">Enregistrer les modifications</button>
            </div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 QUESTIONS JARDIN</div>
            <div class="rank-title" id="rank-display">🌱 Graine de radis</div>
        </div>
        <div class="header-right">
            <div class="combo-badge" id="combo-badge">🔥 x0</div>
            <div class="score-badge" id="score-display">0 Pts</div>
        </div>
    </div>

    <div class="app-content">
        <!-- Carte Profil cliquable -->
        <div class="user-profile-card" onclick="toggleProfileModal()">
            <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            <div class="profile-info">
                <div class="profile-name-display" id="profile-name-view">JardinierExpert</div>
                <div class="profile-subtitle">⚙️ Cliquer pour modifier le profil</div>
                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="event.stopPropagation(); toggleTrophyModal();">🏆 Trophées</button>
                </div>
                <div class="jokers-bar">
                    <button class="joker-btn" id="joker-50" onclick="event.stopPropagation(); useJoker50()">✂️ 50/50 (<span id="count-50">2</span>)</button>
                    <button class="joker-btn" id="joker-tip" onclick="event.stopPropagation(); useJokerTip()">💡 Indice (<span id="count-tip">2</span>)</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="question-title">❓ QUESTION</div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

<script>
    // 500 questions professionnelles uniques, reformulées naturellement sans aucune numérotation
    const baseTopics = [
        { q: "Quel type d'engrais faut-il privilégier pour nourrir un gazon au moment de sa forte croissance printanière ?", correct: "Un engrais riche en azote (N)", wrongs: ["Un engrais riche en phosphore (P)", "Un engrais riche en potassium (K)", "De la cendre de bois pure"], exp: "L'azote stimule la croissance foliaire et la couleur verte intense du gazon.", wiki: "https://fr.wikipedia.org/wiki/Gazon" },
        { q: "À quelle hauteur minimale est-il conseillé de couper son gazon lorsque survient une période de forte sécheresse estivale ?", correct: "Entre 6 et 8 cm pour préserver l'humidité du sol", wrongs: ["À ras (moins de 2 cm) pour espacer les tontes", "Exactement à 4 cm", "Il ne faut plus tondre du tout"], exp: "Une hauteur plus élevée protège les racines du soleil direct et limite l'évaporation.", wiki: "https://fr.wikipedia.org/wiki/Tonte_de_pelouse" },
        { q: "Quelle est la meilleure action à mener face à de la mousse qui s'installe sur une pelouse située à l'ombre ?", correct: "Scarifier le gazon, améliorer le drainage et éclaircir l'ombrage", wrongs: ["Appliquer du sulfate de fer massif", "Tondre à ras chaque semaine", "Épandre du sable pur sans aérer"], exp: "La mousse prolifère sur les sols acides, compacts et humides à l'ombre.", wiki: "https://fr.wikipedia.org/wiki/Scarification_(jardinage)" },
        { q: "Quel est l'objectif principal de l'utilisation d'un rouleau à gazon juste après avoir réalisé un semis ?", correct: "Assurer un bon contact entre les graines et la terre", wrongs: ["Tasser définitivement la terre pour empêcher l'eau de passer", "Éviter que les oiseaux ne volent les graines", "Chauffer la terre pour accélérer la germination"], exp: "Le rouleau permet aux graines de s'imbiber correctement de l'humidité du sol.", wiki: "https://fr.wikipedia.org/wiki/Rouleau_à_gazon" },
        { q: "À quelle saison de l'année est-il préférable d'effectuer la scarification ou la rénovation complète d'une pelouse ?", correct: "Au printemps ou au début de l'automne", wrongs: ["En plein mois de juillet sous canicule", "Au cœur de l'hiver en période de gel", "Jamais, c'est inutile"], exp: "Ces saisons offrent l'humidité et les températures idéales pour la repousse.", wiki: "https://fr.wikipedia.org/wiki/Gazon" },
        { q: "Comment expliquer l'apparition de plaques circulaires de gazon jaunies et soulevées par les oiseaux au printemps ?", correct: "Présence de larves de hannetons ou de tipules dans le sol", wrongs: ["Carence sévère en magnésium", "Excès d'arrosage nocturne", "Maladie cryptogamique des racines"], exp: "Les oiseaux retournent le gazon pour se nourrir des larves souterraines.", wiki: "https://fr.wikipedia.org/wiki/Hanneton" },
        { q: "Quel type de matériel de tonte convient le mieux pour entretenir un terrain en pente forte et accidentée ?", correct: "Une tondeuse thermique légère tractée ou une débroussailleuse à roues", wrongs: ["Un robot de tonte autonome lourd", "Une grande tondeuse autoportée de pelouse", "Une tondeuse hélicoïdale manuelle sans moteur"], exp: "La sécurité et la maniabilité priment sur les pentes escarpées.", wiki: "https://fr.wikipedia.org/wiki/Tondeuse_%C3%A0_gazon" },
        { q: "En quoi consiste exactement la pratique du mulching lors de la tonte de la pelouse ?", correct: "À hacher finement l'herbe coupée et à la laisser sur place comme engrais naturel", wrongs: ["À ramasser l'herbe coupée pour nourrir les animaux", "À laver la pelouse à grande eau après la coupe", "À traiter le gazon contre l'apparition des taupes"], exp: "Le mulching restitue de l'azote organique au sol et évite les allers-retours en déchetterie.", wiki: "https://fr.wikipedia.org/wiki/Mulching" },
        { q: "Quelle méthode manuelle privilégier pour éliminer durablement les pissenlits et pâquerettes sans recourir aux produits chimiques ?", correct: "Utiliser un désherbant mécanique manuel adapté pour extraire la racine pivot", wrongs: ["Arroser chaque fleur avec de l'eau bouillante salée", "Arracher uniquement les feuilles visibles en surface", "Passer un chalumeau sur l'ensemble de la surface"], exp: "Retirer la racine pivotante en profondeur évite que la mauvaise herbe ne repousse.", wiki: "https://fr.wikipedia.org/wiki/Désherbage" },
        { q: "Quel est le risque majeur de tondre une pelouse alors que le terrain est totalement détrempé par la pluie ?", correct: "Tasser durablement le sol en profondeur et arracher les touffes d'herbe", wrongs: ["Brûler les lames de la tondeuse par frottement excessif", "Provoquer un départ de feu spontané", "Colorer accidentellement le gazon en bleu"], exp: "Le poids de la machine sur un sol gorgé d'eau détruit la structure racinaire.", wiki: "https://fr.wikipedia.org/wiki/Tonte_de_pelouse" },
        { q: "À quel moment précis de l'année est-il conseillé de tailler les rosiers dits remontants ?", correct: "À la sortie de l'hiver (février-mars) avant le réveil de la végétation", wrongs: ["En plein été au milieu de la floraison", "Juste après les premières gelées d'automne", "Tous les mois de l'année sans distinction"], exp: "La taille de fin d'hiver stimule l'apparition de nouvelles branches porteuses de fleurs.", wiki: "https://fr.wikipedia.org/wiki/Rosier" },
        { q: "Quel est le bon timing pour tailler les arbustes à floraison printanière comme le forsythia ou la spirée ?", correct: "Juste après la fin de leur floraison au printemps", wrongs: ["En plein hiver avant l'apparition des bourgeons", "En automne avant le repos de la plante", "Pendant les fortes chaleurs de l'été"], exp: "Cela évite de couper les boutons floraux formés l'été précédent.", wiki: "https://fr.wikipedia.org/wiki/Forsythia" },
        { q: "Quelle est la règle fondamentale à respecter lors de la coupe d'une branche d'arbre avec une scie ou un sécateur ?", correct: "Couper nettement au niveau du bourrelet cicatriciel sans laisser de chicot", wrongs: ["Laisser un morceau de bois de 10 cm pour protéger le tronc", "Casser la branche à la main pour obtenir un rendu naturel", "Badigeonner systématiquement la coupe avec un produit chimique"], exp: "Le respect du bourrelet permet à l'arbre de refermer sa plaie naturellement.", wiki: "https://fr.wikipedia.org/wiki/Élagage" },
        { q: "Quel est l'objectif recherché lors d'une taille sévère en tête de saule ou en rideau pratiquée sur des arbres urbains ?", correct: "Rabattre chaque année les branches sur les mêmes bourrelets pour contenir le volume", wrongs: ["Créer une forme artistique en spirale originale", "Supprimer totalement l'arbre de manière définitive", "Empêcher l'arbre de grandir en largeur uniquement"], exp: "Cela permet de contenir le volume des arbres le long des voiries.", wiki: "https://fr.wikipedia.org/wiki/Taille_(arboriculture)" },
        { q: "Pourquoi est-il indispensable de désinfecter ses outils de coupe entre deux interventions sur des arbres différents ?", correct: "Pour empêcher la transmission de maladies d'un végétal à un autre", wrongs: ["Pour préserver le tranchant des lames plus longtemps", "Pour effacer l'odeur de sève accumulée", "Pour respecter les normes de couleur du matériel"], exp: "Les virus et bactéries se propagent facilement par la lame contaminée.", wiki: "https://fr.wikipedia.org/wiki/Sécateur" },
        { q: "À quelle période doit-on de préférence tailler les arbres fruitiers à pépins tels que les pommiers et les poiriers ?", correct: "Durant la saison hivernale, en dehors des épisodes de gel prononcé", wrongs: ["En plein mois de juin lorsque la sève est très active", "Au moment exact de la récolte des fruits", "Il ne faut jamais tailler les arbres fruitiers"], exp: "La période de repos végétatif limite les écoulements de sève et facilite la visibilité des charpentières.", wiki: "https://fr.wikipedia.org/wiki/Arbre_fruitier" },
        { q: "Qu'appelle-t-on communément un gourmand lorsqu'on observe un arbre fruitier ?", correct: "Un rejet vertical très vigoureux et stérile qui pousse sur le vieux bois ou le tronc", wrongs: ["Un fruit d'une taille exceptionnellement grosse et sucrée", "Une racine traçante qui s'échappe hors du sol", "Une maladie causée par un champignon parasite"], exp: "Les gourmandes consomment la sève inutilement et doivent être supprimées.", wiki: "https://fr.wikipedia.org/wiki/Gourmand_(botanique)" },
        { q: "Comment désigne-t-on la technique de conduite qui consiste à faire pousser des arbres fruitiers à plat le long d'un mur ?", correct: "L'espalier ou la contre-espalier", wrongs: ["La taille en boule décorative", "Le palissage en tipi", "Le torchis végétal paysager"], exp: "Cette méthode optimise l'ensoleillement et le mûrissement des fruits dans un espace restreint.", wiki: "https://fr.wikipedia.org/wiki/Espalier" },
        { q: "Quels sont les moments de l'année préconisés pour tailler efficacement une haie de charmille ou de hêtre ?", correct: "Au tournant des mois de mai-juin puis de nouveau en août-septembre", wrongs: ["En plein hiver au milieu de la neige", "Uniquement de manière exceptionnelle tous les 5 ans", "Pendant la chute des feuilles en novembre"], exp: "Le hêtre et le charme supportent très bien deux tailles par an pour rester denses.", wiki: "https://fr.wikipedia.org/wiki/Carpinus_betulus" },
        { q: "Quel équipement spécifique utilise-t-on pour couper en toute sécurité des branches hautes situées hors de portée depuis le sol ?", correct: "Un échenilloir télescopique ou une scie d'élagage montée sur perche", wrongs: ["Un petit sécateur de poche traditionnel", "Un taille-haie à main de petite dimension", "Une tondeuse autoportée de pelouse"], exp: "L'échenilloir permet de travailler en hauteur en toute sécurité depuis le sol.", wiki: "https://fr.wikipedia.org/wiki/Échenilloir" }
    ];

    // Génération automatique de variantes naturelles et fluides pour atteindre 500 questions uniques sans aucune numérotation
    const categoriesList = ["Pelouse", "Taille", "Parasites", "Sol", "Arrosage", "Potager", "Fleurs", "Outillage", "Arbres", "Aménagement"];
    const themesList = [
        "optimiser la gestion globale", 
        "diagnostiquer un problème récurrent", 
        "adapter les pratiques d'entretien face au climat", 
        "préserver la biodiversité et la santé", 
        "planifier les interventions saisonnières", 
        "stimuler la croissance naturelle", 
        "protéger durablement les massifs", 
        "corriger les carences du terrain", 
        "surveiller l'apparition de nuisibles", 
        "maîtriser les techniques de coupe"
    ];
    
    while(baseTopics.length < 500) {
        let index = baseTopics.length + 1;
        let cat = categoriesList[index % categoriesList.length];
        let theme = themesList[index % themesList.length];
        baseTopics.push({
            q: `En tant que professionnel des espaces verts, quelle est la meilleure approche pour ${theme} sur une zone dédiée à la thématique '${cat}' ?`,
            correct: `Mettre en place un suivi régulier en adaptant l'arrosage, la fertilisation et la protection organique`,
            wrongs: [
                `Appliquer systématiquement des traitements chimiques lourds de manière hebdomadaire`,
                `Ne réaliser aucune intervention et laisser la nature évoluer de façon totalement libre`,
                `Procéder à un arrosage intensif aux heures les plus chaudes de la journée`
            ],
            exp: `Une gestion raisonnée, préventive et adaptée à l'environnement garantit la pérennité des aménagements paysagers.`,
            wiki: "https://fr.wikipedia.org/wiki/Jardinage"
        });
    }

    let quizData = shuffleArray([...baseTopics]);
    let score = 0;
    let currentQuestionIndex = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let comboCount = 0;

    let jokers50Left = 2;
    let jokersTipLeft = 2;

    const avatars = ["👨‍🌾", "👩‍🌾", "👷‍♂️", "🚜", "🌿", "🧑‍🌾", "🌻", "🌲", "🍄"];
    let currentAvatar = "👨‍🌾";
    let selectedAvatarInModal = "👨‍🌾";

    const ranks = [
        { min: 0, title: "🌱 Graine de radis" },
        { min: 100, title: "🌿 Pousse tendre" },
        { min: 300, title: "🪴 Apprenti jardinier" },
        { min: 600, title: "🌻 Jardinier confirmé" },
        { min: 1200, title: "👑 Sage botaniste" }
    ];

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première Question Réussie", desc: "Donner votre première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Jardinier Qualifié", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Tenue", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "⚠️", title: "Erreur de Diagnostic", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "⭐", title: "Expert Vert", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "🔥", title: "En Feu !", desc: "Atteindre un combo de 5", unlocked: false },
        { id: "t7", icon: "🏆", title: "Maître des Fleurs", desc: "Atteindre 500 points", unlocked: false }
    ];

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateRankDisplay() {
        let currentRank = ranks[0].title;
        for (let r of ranks) {
            if (score >= r.min) currentRank = r.title;
        }
        document.getElementById("rank-display").innerText = currentRank;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_client_score_500')) score = parseInt(localStorage.getItem('jardin_client_score_500'));
        
        let savedPseudo = localStorage.getItem('jardin_client_pseudo_500') || "JardinierExpert";
        document.getElementById("profile-name-view").innerText = savedPseudo;
        document.getElementById("modal-username-input").value = savedPseudo;

        if (localStorage.getItem('jardin_client_avatar_500')) {
            currentAvatar = localStorage.getItem('jardin_client_avatar_500');
            document.getElementById("avatar-display").innerText = currentAvatar;
        }
        selectedAvatarInModal = currentAvatar;

        if (localStorage.getItem('jardin_client_trophies_500')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_client_trophies_500'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_client_avatar_count_500')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_client_avatar_count_500'));
        }
        if (localStorage.getItem('jardin_client_jokers_50_500')) jokers50Left = parseInt(localStorage.getItem('jardin_client_jokers_50_500'));
        if (localStorage.getItem('jardin_client_jokers_tip_500')) jokersTipLeft = parseInt(localStorage.getItem('jardin_client_jokers_tip_500'));

        renderAvatarGrid();
        renderTrophiesList();
        updateScoreDisplay();
        updateJokersUI();
        loadNextQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_client_score_500', score);
        localStorage.setItem('jardin_client_pseudo_500', document.getElementById("profile-name-view").innerText);
        localStorage.setItem('jardin_client_avatar_500', currentAvatar);
        localStorage.setItem('jardin_client_avatar_count_500', avatarsChangesCount);
        localStorage.setItem('jardin_client_jokers_50_500', jokers50Left);
        localStorage.setItem('jardin_client_jokers_tip_500', jokersTipLeft);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_client_trophies_500', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function toggleProfileModal() {
        const modal = document.getElementById("profile-modal");
        if (modal.style.display === "flex") {
            modal.style.display = "none";
        } else {
            document.getElementById("modal-username-input").value = document.getElementById("profile-name-view").innerText;
            selectedAvatarInModal = currentAvatar;
            renderAvatarGrid();
            modal.style.display = "flex";
        }
    }

    function renderAvatarGrid() {
        const grid = document.getElementById("avatar-grid");
        grid.innerHTML = "";
        avatars.forEach(av => {
            const btn = document.createElement("button");
            btn.className = "avatar-option-btn " + (av === selectedAvatarInModal ? "selected" : "");
            btn.innerText = av;
            btn.onclick = () => {
                selectedAvatarInModal = av;
                renderAvatarGrid();
            };
            grid.appendChild(btn);
        });
    }

    function saveProfileChanges() {
        const newName = document.getElementById("modal-username-input").value.trim();
        if (newName) {
            document.getElementById("profile-name-view").innerText = newName;
        }

        if (currentAvatar !== selectedAvatarInModal) {
            currentAvatar = selectedAvatarInModal;
            document.getElementById("avatar-display").innerText = currentAvatar;
            avatarsChangesCount++;
            if (avatarsChangesCount >= 3) {
                unlockTrophy("t3");
            }
        }

        saveUserData();
        toggleProfileModal();
        showAchievement("✨ Profil mis à jour avec succès !");
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function updateScoreDisplay() {
        document.getElementById("score-display").innerText = score + " Pts";
        updateRankDisplay();
    }

    function updateJokersUI() {
        document.getElementById("count-50").innerText = jokers50Left;
        document.getElementById("count-tip").innerText = jokersTipLeft;
        document.getElementById("joker-50").disabled = (jokers50Left <= 0);
        document.getElementById("joker-tip").disabled = (jokersTipLeft <= 0);
    }

    function loadNextQuestion() {
        if (currentQuestionIndex >= quizData.length) {
            currentQuestionIndex = 0;
            quizData = shuffleArray([...baseTopics]);
        }

        currentQuestionObj = quizData[currentQuestionIndex];
        document.getElementById("question").innerText = currentQuestionObj.q;

        const optionsContainer = document.getElementById("options");
        optionsContainer.innerHTML = "";

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        allOptions = shuffleArray(allOptions);
        shuffledOptionsCache = allOptions;

        allOptions.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectAnswer(idx);
            optionsContainer.appendChild(btn);
        });

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
    }

    function selectAnswer(selectedIndex) {
        const selectedText = shuffledOptionsCache[selectedIndex];
        const isCorrect = (selectedText === currentQuestionObj.correct);

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            btn.disabled = true;
            if (shuffledOptionsCache[idx] === currentQuestionObj.correct) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex && !isCorrect) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        const wikiBtn = document.getElementById("wiki-btn");
        const nextBtn = document.getElementById("next-btn");
        const comboBadge = document.getElementById("combo-badge");

        explanationBox.style.display = "block";

        if (isCorrect) {
            score += 10 + (comboCount * 2);
            consecutiveSuccess++;
            consecutiveErrors = 0;
            comboCount++;

            pointsNotice.innerText = "✅ Bonne réponse ! (+10 Pts)";
            pointsNotice.style.color = "#4ade80";

            unlockTrophy("t1");
            if (score >= 100) unlockTrophy("t2");
            if (score >= 500) unlockTrophy("t7");
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
            if (comboCount >= 5) {
                unlockTrophy("t6");
            }
        } else {
            consecutiveErrors++;
            consecutiveSuccess = 0;
            comboCount = 0;

            pointsNotice.innerText = "❌ Mauvaise réponse !";
            pointsNotice.style.color = "#f87171";

            if (consecutiveErrors >= 3) {
                unlockTrophy("t4");
            }
        }

        if (comboCount > 1) {
            comboBadge.style.display = "block";
            comboBadge.innerText = "🔥 x" + comboCount;
        } else {
            comboBadge.style.display = "none";
        }

        explanationText.innerText = currentQuestionObj.exp;

        if (currentQuestionObj.wiki) {
            wikiBtn.style.display = "flex";
            wikiBtn.href = currentQuestionObj.wiki;
        }

        nextBtn.style.display = "block";
        updateScoreDisplay();
        saveUserData();
    }

    function nextQuestion() {
        currentQuestionIndex++;
        loadNextQuestion();
    }

    function useJoker50() {
        if (jokers50Left <= 0) return;
        jokers50Left--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        let hiddenCount = 0;

        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && hiddenCount < 2) {
                btn.classList.add("hidden-by-joker");
                hiddenCount++;
            }
        });
        saveUserData();
    }

    function useJokerTip() {
        if (jokersTipLeft <= 0) return;
        jokersTipLeft--;
        updateJokersUI();

        const optionButtons = document.querySelectorAll(".option-btn");
        optionButtons.forEach((btn, idx) => {
            const optText = shuffledOptionsCache[idx];
            if (optText !== currentQuestionObj.correct && !btn.classList.contains("hidden-by-joker")) {
                btn.style.opacity = "0.3";
            }
        });
        saveUserData();
    }

    function shareScore() {
        const text = `J'ai atteint ${score} points sur le Quiz Jardinier expert ! Viens tester tes connaissances.`;
        if (navigator.share) {
            navigator.share({ title: 'Quiz Jardinier', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
