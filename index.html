<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Le Métier de Jardinier Quiz 🌿 (500 Questions Variées)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 15px;
            font-weight: 800;
            color: #4ade80;
        }

        .daily-visits {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            margin-top: 2px;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .rank-badge {
            display: inline-block;
            background: #334155;
            color: #facc15;
            font-size: 10.5px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 3px;
        }

        .progress-box {
            margin-top: 5px;
            width: 100%;
        }

        .progress-bar-bg {
            background: #334155;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
        }

        .progress-text {
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        .quiz-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 700;
        }

        .difficulty-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .diff-facile { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .diff-moyen { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .diff-difficile { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .question-text {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.3;
            margin-top: 4px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon { font-size: 24px; }
        .trophy-details h4 { font-size: 13px; color: #f8fafc; font-weight: 700; }
        .trophy-details p { font-size: 11px; color: #94a3b8; }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }
        #achievement-popup.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Succès</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 MÉTIER DE JARDINIER</div>
            <div class="daily-visits">📊 <span id="visits-count">1</span> connexion(s)</div>
        </div>
        <div class="score-badge" id="score-display">0 Pts</div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="JardinierPro" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="rank-badge" id="rank-display">🌱 Apprenti Paysagiste</div>
                
                <div class="progress-box">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="rank-progress-fill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="rank-next-title">Suivant: Ouvrier Qualifié</span>
                        <span id="rank-points-left">40 pts</span>
                    </div>
                </div>

                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="quiz-header-info">
                <div class="question-title">PRATIQUE PROFESSIONNELLE</div>
                <div class="difficulty-tag diff-facile" id="diff-tag">Facile</div>
            </div>
            <div class="question-text" id="question">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">🌐 Fiche Technique Wikipédia</a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">🚀 Question Suivante</button>
            <button class="share-btn" onclick="shareScore()">🔗 Partager mon score</button>
        </div>
    </div>
</div>

<script>
    // Banque de questions diversifiées et concrètes sur le métier de jardinier-paysagiste
    const quizData = [
        // 1. Tonte et gazon
        { q: "À quelle hauteur minimale conseille-t-on généralement de tondre un gazon d'ornement en période de forte sécheresse (canicule) ?", correct: "Entre 7 et 8 cm pour protéger les racines et limiter l'évaporation", wrongs: ["À ras (moins de 2 cm) pour espacer les tontes", "Exactement à 1 cm pour un rendu billard", "On arrête totalement de respirer autour de la pelouse"], exp: "En période de stress hydrique, laisser l'herbe plus haute protège le sol du dessèchement et favorise l'enracinement profond.", wiki: "https://fr.wikipedia.org/wiki/Gazon", difficulty: "moyen" },
        { q: "Quelle est l'utilité principale d'un passage de scarificateur sur une pelouse envahie par la mousse ?", correct: "Éliminer le feutrage et la mousse pour permettre à l'eau et l'air de pénétrer à nouveau", wrongs: ["Colorer l'herbe en vert fluo artificiel", "Planter de nouvelles pommes de terre en ligne", "Niveler les taupinières à coups de marteau"], exp: "La scarification lacère le feutrage mort et la mousse pour aérer le sol et redonner de la vigueur au gazon.", wiki: "https://fr.wikipedia.org/wiki/Scarification_(horticulture)", difficulty: "facile" },
        { q: "Qu'appelle-t-on le 'mulching' lors de la tonte des espaces verts ?", correct: "Une technique qui consiste à broyer finement l'herbe et à la laisser sur place comme fertilisant", wrongs: ["Ramasser l'herbe coupée pour nourrir des chèvres", "Laver la tondeuse avec du savon noir", "Peindre les brins d'herbe jaunis"], exp: "Le mulching restitue de l'azote au sol tout en évitant d'avoir à vider continuellement le bac de ramassage.", wiki: "https://fr.wikipedia.org/wiki/Mulching", difficulty: "facile" },

        // 2. Taille et arbustes
        { q: "Quelle est la règle générale de période pour tailler les arbustes à floraison estivale (comme les buddleias ou hibiscus) ?", correct: "À la fin de l'hiver ou au tout début du printemps sur le bois de l'année en cours", wrongs: ["En plein milieu de l'été sous 40 degrés", "La nuit uniquement à la lumière d'une torche", "Jamais, on les laisse pousser en jungle"], exp: "Ces arbustes fleurissent sur les pousses de l'année, une taille avant le départ de la végétation stimule la floraison.", wiki: "https://fr.wikipedia.org/wiki/Taille_(arboriculture)", difficulty: "moyen" },
        { q: "Pourquoi désinfecte-t-on les lames du sécateur ou du taille-haie entre deux chantiers ou deux arbres différents ?", correct: "Pour éviter de propager des maladies cryptogamiques ou bactériennes d'un végétal à un autre", wrongs: ["Pour que les outils sentent bon la lavande", "Pour empêcher le métal de rouiller dans la poche", "Pour attirer les abeilles sur le chantier"], exp: "La transmission de virus ou de champignons par les outils de coupe est un risque majeur sur les chantiers paysagers.", wiki: "https://fr.wikipedia.org/wiki/S%C3%A9cateur", difficulty: "facile" },
        { q: "Qu'est-ce qu'une 'taille en igloo ou topiaire' pratiquée par les professionnels sur certains conifères ?", correct: "Une technique de sculpture géométrique des végétaux pour des objectifs esthétiques", wrongs: ["Une structure en plastique pour stocker des glaçons", "Une méthode pour protéger les plantes du froid polaire", "Un abri de secours pour le jardinier en cas d'orage"], exp: "La topiaire demande un savoir-faire technique précis pour structurer artistiquement les arbustes (ifs, buis, etc.).", wiki: "https://fr.wikipedia.org/wiki/Art_topiaire", difficulty: "difficile" },

        // 3. Matériel et sécurité
        { q: "Quel carburant utilise généralement une tronçonneuse thermique professionnelle à moteur 2 temps ?", correct: "Un mélange d'essence sans plomb et d'huile spécifique pour moteur 2 temps", wrongs: ["Du gasoil de voiture standard", "De l'eau de source gazeuse", "De l'huile de friteuse usagée"], exp: "Les moteurs 2 temps nécessitent un graissage intégré dans le carburant via un dosage précis d'huile (souvent entre 2 et 4%).", wiki: "https://fr.wikipedia.org/wiki/Moteur_deux_temps", difficulty: "facile" },
        { q: "Quel EPI est strictement obligatoire et indispensable pour un opérateur manipulant une tronçonneuse au sol ?", correct: "Pantalon anti-coupure, chaussures de sécurité coquées, casque avec visière et protège-tibias", wrongs: ["Un bermuda de bain et des tongs en plastique", "Un complet-veste de soirée étanche", "Un pyjama en flanelle"], exp: "Le risque de rebond ou de glissade avec une tronçonneuse impose le port d'équipements de protection anti-coupure normés.", wiki: "https://fr.wikipedia.org/wiki/%C3%89quipement_de_protection_individuelle", difficulty: "facile" },
        { q: "Comment sécurise-t-on une zone de travail sur la voie publique lorsqu'on utilise une débroussailleuse le long d'un trottoir ?", correct: "En installant un balisage réglementaire (panneaux de signalisation et cônes) pour protéger les passants des projections", wrongs: ["En criant très fort sur les passants pour qu'ils s'enfuient", "En fermant les yeux pour ne pas voir les piétons", "En demandant au client de surveiller avec un parapluie"], exp: "La projection de cailloux par la débroussailleuse représente un danger public majeur qui impose un balisage strict.", wiki: "https://fr.wikipedia.org/wiki/D%C3%A9broussailleuse", difficulty: "moyen" },

        // 4. Sols, amendements et plantation
        { q: "Qu'appelle-t-on le 'pralinage' des racines lors de la plantation à racines nues d'un arbre ou arbuste ?", correct: "Le fait de tremper les racines dans un mélange boueux (terre, eau, bouse ou argile) avant la mise en terre", wrongs: ["Le fait de saupoudrer des bonbons pralinés au pied de l'arbre", "Arroser l'arbre avec du jus de fruits sucré", "Laisser sécher les racines au soleil pendant trois jours"], exp: "Le pralinage évite le dessèchement des racines et favorise leur adhérence au sol pour une meilleure reprise.", wiki: "https://fr.wikipedia.org/wiki/Pralinage", difficulty: "moyen" },
        { q: "À quoi sert principalement l'apport de compost mûr dans un massif paysager au printemps ?", correct: "À enrichir le sol en matière organique et à stimuler l'activité biologique de la terre", wrongs: ["À colorer le sol en bleu électrique", "À éliminer définitivement l'humidité de la planète", "À attirer les taupes pour les capturer"], exp: "Le compost nourrit le sol et améliore sa structure (rétention d'eau et aération) de manière naturelle.", wiki: "https://fr.wikipedia.org/wiki/Compost", difficulty: "facile" },
        { q: "Quelle est la principale utilité de la pose d'une bâche de paillage (ou toile de paillage tissée) dans un nouveau massif d'arbustes ?", correct: "Limiter la pousse des adventices (mauvaises herbes) et conserver l'humidité du sol", wrongs: ["Créer une patinoire hivernale pour les enfants", "Empêcher l'eau de pluie d'atteindre les racines", "Isoler thermiquement la Terre du noyau de la planète"], exp: "La toile de paillage réduit considérablement la corvée de désherbage chimique ou manuel les premières années.", wiki: "https://fr.wikipedia.org/wiki/Paillage", difficulty: "facile" },

        // 5. Chantiers et gestion paysagère
        { q: "Dans le cadre de la création d'un massif, qu'est-ce qu'un 'bêchage de bordure' (ou coupe de gazon nette) ?", correct: "Trancher verticalement la pelouse le long du massif pour obtenir une ligne propre et séparer nettement les univers", wrongs: ["Bâter les bordures avec du béton armé de 15 cm d'épaisseur", "Planter des fleurs à l'envers", "Mettre le feu aux extrémités du terrain"], exp: "Une bordure proprement tranchée à la bêche donne immédiatement un aspect soigné et professionnel au chantier paysager.", wiki: "https://fr.wikipedia.org/wiki/Jardinage", difficulty: "facile" },
        { q: "Que doit faire un chef d'équipe paysagiste si, en creusant une tranchée pour un système d'arrosage automatique, il tombe sur un câble électrique non répertorié ?", correct: "Stopper immédiatement les travaux, sécuriser la zone et prévenir son responsable ou le gestionnaire des réseaux", wrongs: ["Continuer à creuser plus vite avec la pioche en fermant les yeux", "Sectionner le câble pour voir s'il y a du courant dedans", "Attacher le câble aux branches d'un arbre voisin"], exp: "La découverte de réseaux inopinés (gaz, électricité, eau) impose un arrêt immédiat pour éviter l'électrocution ou l'accident grave.", wiki: "https://fr.wikipedia.org/wiki/Arrosage_automatique", difficulty: "difficile" },
        { q: "Quel est l'intérêt d'installer un système d'arrosage automatique goutte-à-goutte dans une haie paysagère ?", correct: "Apporter l'eau directement au pied des arbustes au plus près des racines en minimisant le gaspillage par évaporation", wrongs: ["Inonder l'allée goudronnée pour la nettoyer", "Faire un parcours d'eau pour les grenouilles du quartier", "Arroser les nuages en hauteur"], exp: "Le goutte-à-goutte est le système le plus économe et le plus efficace pour l'arrosage localisé des haies et massifs.", wiki: "https://fr.wikipedia.org/wiki/Micro-irrigation", difficulty: "moyen" }
    ];

    let score = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let correctButtonIndex = 0;
    let totalAnsweredCount = 0;

    const avatars = ["👨‍🌾", "👩‍🌾", "👷‍♂️", "🚜", "🌿", "🧑‍🌾"];
    let avatarIdx = 0;

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première embauche", desc: "Donner sa première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Chef d'équipe", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Tenue", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "⚠️", title: "Alerte Sécurité", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "⭐", title: "Prime de Rendement", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "📋", title: "Conducteur de Travaux", desc: "Répondre à 10 questions", unlocked: false },
        { id: "t7", icon: "🏆", title: "Maître Paysagiste", desc: "Atteindre 250 points", unlocked: false }
    ];

    const ranks = [
        { min: 0, max: 40, title: "🌱 Apprenti Paysagiste", nextTitle: "Ouvrier Qualifié" },
        { min: 40, max: 100, title: "🌿 Ouvrier Qualifié", nextTitle: "Chef d'Équipe" },
        { min: 100, max: 200, title: "🪴 Chef d'Équipe", nextTitle: "Conducteur de Travaux" },
        { min: 200, max: 400, title: "🌳 Conducteur de Travaux", nextTitle: "Expert Paysagiste" },
        { min: 400, max: Infinity, title: "🏆 Directeur des Espaces Verts", nextTitle: "Niveau Max" }
    ];

    function getCurrentRank() {
        const currentScore = Math.max(0, score);
        let currentRank = ranks[0];
        for (let r of ranks) {
            if (currentScore >= r.min) currentRank = r;
        }
        return currentRank;
    }

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_metier_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_metier_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_metier_visit_date', today);
            score += 20;
            showAchievement("💧 Pointage du matin : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_metier_visits_count', visitCount);
        document.getElementById("visits-count").innerText = visitCount;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_metier_score')) score = parseInt(localStorage.getItem('jardin_metier_score'));
        if (localStorage.getItem('jardin_metier_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_metier_pseudo');
        if (localStorage.getItem('jardin_metier_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_metier_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_metier_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_metier_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_metier_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_metier_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_metier_avatar_count'));
        }
        trackDailyVisits();
        renderTrophiesList();
        updateRankProgress();
        loadRandomQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_metier_score', score);
        localStorage.setItem('jardin_metier_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_metier_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_metier_avatar_count', avatarsChangesCount);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_metier_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        if (avatarsChangesCount >= 3) unlockTrophy("t3");
        saveUserData();
    }

    function checkTrophies() {
        if (score >= 10) unlockTrophy("t1");
        if (score >= 100) unlockTrophy("t2");
        if (totalAnsweredCount >= 10) unlockTrophy("t6");
        if (score >= 250) unlockTrophy("t7");
    }

    function updateRankProgress() {
        const currentScore = Math.max(0, score);
        let currentRank = getCurrentRank();

        document.getElementById("rank-display").innerText = currentRank.title;
        document.getElementById("score-display").innerText = `${score} Pts`;

        const fillBar = document.getElementById("rank-progress-fill");
        const nextTitleElem = document.getElementById("rank-next-title");
        const pointsLeftElem = document.getElementById("rank-points-left");

        if (currentRank.max === Infinity) {
            fillBar.style.width = "100%";
            nextTitleElem.innerText = "Niveau Max !";
            pointsLeftElem.innerText = "🏆";
        } else {
            const range = currentRank.max - currentRank.min;
            const progress = currentScore - currentRank.min;
            const percentage = Math.min(100, Math.max(0, (progress / range) * 100));
            const pointsNeeded = currentRank.max - currentScore;

            fillBar.style.width = `${percentage}%`;
            nextTitleElem.innerText = `Suivant: ${currentRank.nextTitle}`;
            pointsLeftElem.innerText = `${pointsNeeded} pts`;
        }
        checkTrophies();
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadRandomQuestion() {
        const randomIndex = Math.floor(Math.random() * quizData.length);
        currentQuestionObj = quizData[randomIndex];
        
        document.getElementById("question").innerText = currentQuestionObj.q;
        
        const diffTag = document.getElementById("diff-tag");
        diffTag.className = `difficulty-tag diff-${currentQuestionObj.difficulty}`;
        diffTag.innerText = currentQuestionObj.difficulty.toUpperCase();

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        shuffledOptionsCache = shuffleArray(allOptions);
        correctButtonIndex = shuffledOptionsCache.indexOf(currentQuestionObj.correct);

        const optsContainer = document.getElementById("options");
        optsContainer.innerHTML = "";

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        shuffledOptionsCache.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        totalAnsweredCount++;
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctButtonIndex) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const isCorrect = (selectedIndex === correctButtonIndex);
        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        
        if (isCorrect) {
            let ptsEarned = currentQuestionObj.difficulty === 'difficile' ? 30 : (currentQuestionObj.difficulty === 'moyen' ? 20 : 10);
            score += ptsEarned;
            pointsNotice.innerText = `✅ Bonne réponse pro ! (+${ptsEarned} pts)`;
            pointsNotice.style.color = "#4ade80";
            
            consecutiveSuccess++;
            consecutiveErrors = 0;
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
        } else {
            score = Math.max(0, score - 5);
            pointsNotice.innerText = `❌ Mauvaise réponse (-5 pts)`;
            pointsNotice.style.color = "#f87171";
            
            consecutiveErrors++;
            consecutiveSuccess = 0;
            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        explanationText.innerText = currentQuestionObj.exp;
        explanationBox.style.display = "block";

        const wikiBtn = document.getElementById("wiki-btn");
        if (currentQuestionObj.wiki) {
            wikiBtn.href = currentQuestionObj.wiki;
            wikiBtn.style.display = "flex";
        }

        document.getElementById("next-btn").style.display = "block";

        updateRankProgress();
        saveUserData();
    }

    function nextQuestion() {
        loadRandomQuestion();
    }

    function shareScore() {
        const pseudo = document.getElementById("username-input").value || "Jardinier";
        const text = `${pseudo} a atteint ${score} points sur Le Métier de Jardinier Quiz 🌿 !`;
        if (navigator.share) {
            navigator.share({ title: 'Le Métier de Jardinier Quiz', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
