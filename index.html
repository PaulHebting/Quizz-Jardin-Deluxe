<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardin Traditionnel Quiz 🌿 (500 Questions)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 16px;
            font-weight: 800;
            color: #4ade80;
        }

        .daily-visits {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            position: relative;
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
            overflow: hidden;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .rank-badge {
            display: inline-block;
            background: #334155;
            color: #facc15;
            font-size: 10.5px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 3px;
        }

        .progress-box {
            margin-top: 5px;
            width: 100%;
        }

        .progress-bar-bg {
            background: #334155;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        .quiz-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 700;
        }

        .difficulty-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .diff-facile { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .diff-moyen { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .diff-difficile { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .question-text {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.3;
            margin-top: 4px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon {
            font-size: 24px;
        }

        .trophy-details h4 {
            font-size: 13px;
            color: #f8fafc;
            font-weight: 700;
        }

        .trophy-details p {
            font-size: 11px;
            color: #94a3b8;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }

        #achievement-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Succès</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 JARDIN TRADITIONNEL</div>
            <div class="daily-visits">📊 <span id="visits-count">1</span> visites aujourd'hui</div>
        </div>
        <div class="score-badge" id="score-display">0 Pts</div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()" title="Changer l'avatar">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="Jardinier123" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="rank-badge" id="rank-display">🌱 Valet de Bêche</div>
                
                <div class="progress-box">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="rank-progress-fill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="rank-next-title">Suivant: Jardinier</span>
                        <span id="rank-points-left">40 pts restants</span>
                    </div>
                </div>

                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="quiz-header-info">
                <div class="question-title">JARDIN D'ORNEMENT & TERRAIN</div>
                <div class="difficulty-tag diff-facile" id="diff-tag">Facile</div>
            </div>
            <div class="question-text" id="question">Chargement de la question...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">
                🌐 En savoir plus sur Wikipédia
            </a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">
                🚀 Question Suivante
            </button>
            <button class="share-btn" onclick="shareScore()">
                🔗 Inviter des amis & Partager mon score
            </button>
        </div>
    </div>
</div>

<script>
    // Base de départ : jardinage traditionnel d'ornement, pelouse, fleurs, haies et entretien
    let baseQuiz = [
        { 
            q: "À quelle période de l'année effectue-t-on traditionnellement la grande taille des rosiers buissons pour favoriser une belle floraison ?", 
            correct: "À la sortie de l'hiver (février-mars), avant le départ de la végétation", 
            wrongs: ["En plein mois d'août pendant les fortes chaleurs", "Au milieu de l'hiver sous les grosses gelées", "Le jour de Noël sans sécateur"],
            exp: "La taille de fin d'hiver stimule l'apparition de nouvelles pousses vigoureuses sur les rosiers.",
            wiki: "https://fr.wikipedia.org/wiki/Rosier",
            difficulty: "facile"
        },
        { 
            q: "Quel est l'objectif principal de la scarification d'une pelouse au début du printemps ?", 
            correct: "Éliminer la mousse et le feutre accumulés pour laisser respirer le gazon", 
            wrongs: ["Repeindre l'herbe en vert fluo", "Planter de nouveaux massifs de cactus", "Niveler le terrain avec du ciment"],
            exp: "La scarification permet d'entailler légèrement le sol pour enlever la couche de déchets végétaux qui étouffe les racines du gazon.",
            wiki: "https://fr.wikipedia.org/wiki/Scarificateur",
            difficulty: "moyen"
        },
        { 
            q: "Pourquoi pose-t-on traditionnellement un lit de billes d'argile ou de graviers au fond d'un pot de fleurs percé ?", 
            correct: "Pour assurer un bon drainage et éviter que les racines ne pourrissent dans l'eau stagnante", 
            wrongs: ["Pour alourdir le pot et le rendre impossible à déplacer", "Pour nourrir chimiquement les feuilles en hauteur", "Pour attirer les vers de terre de balcon"],
            exp: "Le drainage au fond du pot empêche l'eau d'arrosage de stagner au contact direct des racines.",
            wiki: "https://fr.wikipedia.org/wiki/Drainage_(agriculture)",
            difficulty: "facile"
        }
    ];

    let quizData = [...baseQuiz];

    // Catalogue de plantes, fleurs, arbustes et éléments du jardin d'ornement
    const elementCatalogue = [
        { nom: "rosier", wiki: "Rosier" },
        { nom: "géranium", wiki: "Geranium" },
        { nom: "haie de thuyas", wiki: "Thuja" },
        { nom: "gazon", wiki: "Gazon" },
        { nom: "hortensia", wiki: "Hortensia" },
        { nom: "lavande", wiki: "Lavandula" },
        { nom: "bambou", wiki: "Bambusoideae" },
        { nom: "laurier-rose", wiki: "Laurier-rose" },
        { nom: "buis", wiki: "Buxus" },
        { nom: "orchidée", wiki: "Orchidaceae" },
        { nom: "tulipe", wiki: "Tulipa" },
        { nom: "rhododendron", wiki: "Rhododendron" },
        { nom: "camélia", wiki: "Camellia" },
        { nom: "glycine", wiki: "Wisteria" },
        { nom: "lierre", wiki: "Hedera_helix" },
        { nom: "chèvrefeuille", wiki: "Lonicera" },
        { nom: "catalpa", wiki: "Catalpa" },
        { nom: "érable du Japon", wiki: "Acer_palmatum" },
        { nom: "forsythia", wiki: "Forsythia" },
        { nom: "lilas", wiki: "Lilas" }
    ];

    // Modèles de questions axées sur le jardinage traditionnel (taille, entretien, sol, outillage, traitements)
    const typesQuestionsTraditionnelles = [
        {
            diff: "facile",
            q: (l) => `Quelle est la règle d'or lors de l'arrosage d'un ${l.nom} planté en pot en été ?`,
            correct: "Arroser abondamment lorsque la terre est sèche en surface, de préférence le soir", 
            wrongs: ["Laisser le pot immergé dans l'eau de mer en permanence", "Ne jamais lui donner une seule goutte d'eau de tout l'été", "Verser de l'eau bouillante pour stimuler les racines"],
            exp: (l) => `Un arrosage régulier et adapté évite le dessèchement rapide du ${l.nom} en pot lors des fortes chaleurs estivales.`
        },
        {
            diff: "moyen",
            q: (l) => `Quel soin d'entretien traditionnel applique-t-on sur un ${l.nom} à la fin de sa période de floraison ?`,
            correct: "Couper les fleurs fanées et nettoyer le bois mort pour stimuler la repousse", 
            wrongs: ["Le déraciner totalement pour le jeter à la poubelle", "Le repeindre avec de la peinture acrylique blanche", "Le recouvrir entièrement de briques en terre cuite"],
            exp: (l) => `Supprimer les inflorescences mortes évite que le ${l.nom} ne s'épuise à produire des graines inutiles.`
        },
        {
            diff: "difficile",
            q: (l) => `Quel problème phytosanitaire ou environnemental classique surveille-t-on de près sur un ${l.nom} en saison humide ?`,
            correct: "L'apparition de parasites ou de maladies cryptogamiques favorisées par l'humidité stagnante", 
            wrongs: ["Une invasion soudaine de manchots des glaciers", "La transformation instantanée de ses feuilles en verre", "Sa lévitation magique à deux mètres du sol"],
            exp: (l) => `L'excès d'humidité combiné à un manque d'aération rend le ${l.nom} vulnérable aux maladies traditionnelles du jardin.`
        },
        {
            diff: "moyen",
            q: (l) => `Comment prépare-t-on traditionnellement un ${l.nom} sensible pour l'aider à passer l'hiver en extérieur ?`,
            correct: "Installer un paillage épais au pied et éventuellement un voile d'hivernage", 
            wrongs: ["Le placer juste devant un radiateur branché à fond à l'extérieur", "Le badigeonner entièrement de goudron de route", "L'arroser copieusement avec de l'eau glacée tous les soirs"],
            exp: (l) => `Protéger le système racinaire et les parties aériennes du ${l.nom} prévient les dégâts causés par les fortes gelées.`
        }
    ];

    // Génération automatique des 500 questions de jardinage d'ornement et traditionnel
    for (let i = 1; i < 500; i++) {
        let randEl = elementCatalogue[Math.floor(Math.random() * elementCatalogue.length)];
        let randType = typesQuestionsTraditionnelles[Math.floor(Math.random() * typesQuestionsTraditionnelles.length)];
        
        quizData.push({
            q: randType.q(randEl),
            correct: randType.correct,
            wrongs: randType.wrongs,
            exp: randType.exp(randEl),
            wiki: `https://fr.wikipedia.org/wiki/${randEl.wiki}`,
            difficulty: randType.diff
        });
    }

    let score = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let correctButtonIndex = 0;

    const avatars = ["👨‍🌾", "👩‍🌾", "🌻", "🌵", "🌴", "🧑‍🌾"];
    let avatarIdx = 0;

    const trophies = [
        { id: "t1", icon: "🌱", title: "Premier Coup de Sécateur", desc: "Donner sa première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Main Verte", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Chapeau", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "🐹", title: "Taupe en Chef", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "🐞", title: "Chasseur de Nuisibles", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "🌻", title: "Chef Jardinier", desc: "Répondre à 10 questions", unlocked: false },
        { id: "t7", icon: "🌳", title: "Maître du Paysage", desc: "Atteindre 250 points", unlocked: false }
    ];

    const ranks = [
        { min: 0, max: 40, title: "🌱 Valet de Bêche", nextTitle: "Jardinier", allowedDiff: ["facile"] },
        { min: 40, max: 100, title: "🌿 Jardinier", nextTitle: "Chef Paysagiste", allowedDiff: ["facile", "moyen"] },
        { min: 100, max: 200, title: "🪴 Chef Paysagiste", nextTitle: "Maître Ouvrier", allowedDiff: ["facile", "moyen", "difficile"] },
        { min: 200, max: 400, title: "🌳 Maître Ouvrier", nextTitle: "Élite", allowedDiff: ["moyen", "difficile"] },
        { min: 400, max: Infinity, title: "🏆 Architecte Paysagiste", nextTitle: "Niveau Max", allowedDiff: ["difficile"] }
    ];

    function getCurrentRank() {
        const currentScore = Math.max(0, score);
        let currentRank = ranks[0];
        for (let r of ranks) {
            if (currentScore >= r.min) currentRank = r;
        }
        return currentRank;
    }

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_visit_date', today);
            score += 20;
            showAchievement("💧 Bonus quotidien : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_visits_count', visitCount);
        document.getElementById("visits-count").innerText = visitCount;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_score')) score = parseInt(localStorage.getItem('jardin_score'));
        if (localStorage.getItem('jardin_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_pseudo');
        if (localStorage.getItem('jardin_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_avatar_count'));
        }
        trackDailyVisits();
        renderTrophiesList();
        updateRankProgress();
        loadFilteredRandomQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_score', score);
        localStorage.setItem('jardin_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_avatar_count', avatarsChangesCount);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        if (avatarsChangesCount >= 3) unlockTrophy("t3");
        saveUserData();
    }

    let totalAnsweredCount = 0;
    function checkTrophies() {
        if (score >= 10) unlockTrophy("t1");
        if (score >= 100) unlockTrophy("t2");
        if (totalAnsweredCount >= 10) unlockTrophy("t6");
        if (score >= 250) unlockTrophy("t7");
    }

    function updateRankProgress() {
        const currentScore = Math.max(0, score);
        let currentRank = getCurrentRank();

        document.getElementById("rank-display").innerText = currentRank.title;
        document.getElementById("score-display").innerText = `${score} Pts`;

        const fillBar = document.getElementById("rank-progress-fill");
        const nextTitleElem = document.getElementById("rank-next-title");
        const pointsLeftElem = document.getElementById("rank-points-left");

        if (currentRank.max === Infinity) {
            fillBar.style.width = "100%";
            nextTitleElem.innerText = "Niveau Max !";
            pointsLeftElem.innerText = "🏆";
        } else {
            const range = currentRank.max - currentRank.min;
            const progress = currentScore - currentRank.min;
            const percentage = Math.min(100, Math.max(0, (progress / range) * 100));
            const pointsNeeded = currentRank.max - currentScore;

            fillBar.style.width = `${percentage}%`;
            nextTitleElem.innerText = `Suivant: ${currentRank.nextTitle}`;
            pointsLeftElem.innerText = `${pointsNeeded} pts restants`;
        }
        checkTrophies();
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadFilteredRandomQuestion() {
        const currentRank = getCurrentRank();
        let eligibleQuestions = quizData.filter(q => currentRank.allowedDiff.includes(q.difficulty));
        if (eligibleQuestions.length === 0) eligibleQuestions = quizData;

        const randomIndex = Math.floor(Math.random() * eligibleQuestions.length);
        currentQuestionObj = eligibleQuestions[randomIndex];
        
        document.getElementById("question").innerText = currentQuestionObj.q;
        
        const diffTag = document.getElementById("diff-tag");
        diffTag.className = `difficulty-tag diff-${currentQuestionObj.difficulty}`;
        diffTag.innerText = currentQuestionObj.difficulty.toUpperCase();

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        shuffledOptionsCache = shuffleArray(allOptions);
        correctButtonIndex = shuffledOptionsCache.indexOf(currentQuestionObj.correct);

        const optsContainer = document.getElementById("options");
        optsContainer.innerHTML = "";

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        shuffledOptionsCache.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        totalAnsweredCount++;
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctButtonIndex) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const isCorrect = (selectedIndex === correctButtonIndex);
        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        
        if (isCorrect) {
            let ptsEarned = currentQuestionObj.difficulty === 'difficile' ? 30 : (currentQuestionObj.difficulty === 'moyen' ? 20 : 10);
            score += ptsEarned;
            pointsNotice.innerText = `✅ Bonne réponse ! (+${ptsEarned} pts)`;
            pointsNotice.style.color = "#4ade80";
            
            consecutiveSuccess++;
            consecutiveErrors = 0;
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
        } else {
            score = Math.max(0, score - 5);
            pointsNotice.innerText = `❌ Mauvaise réponse (-5 pts)`;
            pointsNotice.style.color = "#f87171";
            
            consecutiveErrors++;
            consecutiveSuccess = 0;
            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        explanationText.innerText = currentQuestionObj.exp;
        explanationBox.style.display = "block";

        const wikiBtn = document.getElementById("wiki-btn");
        if (currentQuestionObj.wiki) {
            wikiBtn.href = currentQuestionObj.wiki;
            wikiBtn.style.display = "flex";
        }

        document.getElementById("next-btn").style.display = "block";

        updateRankProgress();
        saveUserData();
    }

    function nextQuestion() {
        loadFilteredRandomQuestion();
    }

    function shareScore() {
        const pseudo = document.getElementById("username-input").value || "Un jardinier";
        const text = `${pseudo} a atteint ${score} points sur Jardin Traditionnel Quiz 🌿 !`;
        if (navigator.share) {
            navigator.share({ title: 'Jardin Traditionnel Quiz', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
