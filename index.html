<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Le Métier de Jardinier Quiz 🌿 (500 Questions)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 94vh;
            max-height: 880px;
            background: #1e293b;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
            position: relative;
        }

        .app-header {
            padding: 14px 16px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-title-group {
            display: flex;
            flex-direction: column;
        }

        .app-title {
            font-size: 16px;
            font-weight: 800;
            color: #4ade80;
        }

        .daily-visits {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }

        .score-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .app-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .user-profile-card {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-picker {
            position: relative;
            cursor: pointer;
        }

        .user-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid #4ade80;
            overflow: hidden;
        }

        .profile-info {
            text-align: left;
            flex: 1;
        }

        .username-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #334155;
            color: #f8fafc;
            font-size: 15px;
            font-weight: 700;
            width: 100%;
            padding: 2px 0;
            outline: none;
        }

        .username-input:focus {
            border-bottom-color: #4ade80;
        }

        .rank-badge {
            display: inline-block;
            background: #334155;
            color: #facc15;
            font-size: 10.5px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            margin-top: 3px;
        }

        .progress-box {
            margin-top: 5px;
            width: 100%;
        }

        .progress-bar-bg {
            background: #334155;
            height: 6px;
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #4ade80, #22c55e);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease-in-out;
            border-radius: 10px;
        }

        .progress-text {
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 2px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .top-menu-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .trophy-btn-mini {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            color: #facc15;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .quiz-box {
            background: #334155;
            border-radius: 16px;
            padding: 12px;
            margin-top: 10px;
        }

        .quiz-header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .question-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 700;
        }

        .difficulty-tag {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .diff-facile { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .diff-moyen { background: rgba(234, 179, 8, 0.2); color: #facc15; }
        .diff-difficile { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .question-text {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
        }

        .option-btn {
            background: #0f172a;
            border: 2px solid #334155;
            color: #f1f5f9;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #4ade80;
        }

        .explanation-box {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
        }

        .explanation-text {
            font-size: 12.5px;
            color: #e2e8f0;
            line-height: 1.3;
            margin-top: 4px;
        }

        .points-notification {
            font-weight: 800;
            font-size: 12.5px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .wiki-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
        }

        .next-btn {
            display: none;
            background: #22c55e;
            color: #0f172a;
            border: none;
            padding: 9px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13.5px;
            cursor: pointer;
            width: 100%;
        }

        .share-btn {
            background: #334155;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12.5px;
            cursor: pointer;
            width: 100%;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            width: 100%;
            max-height: 80vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 800;
            color: #facc15;
        }

        .close-modal {
            background: #334155;
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .trophies-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .trophy-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .trophy-item.unlocked {
            opacity: 1;
            filter: grayscale(0%);
            border-color: rgba(250, 204, 21, 0.4);
            background: rgba(250, 204, 21, 0.05);
        }

        .trophy-icon {
            font-size: 24px;
        }

        .trophy-details h4 {
            font-size: 13px;
            color: #f8fafc;
            font-weight: 700;
        }

        .trophy-details p {
            font-size: 11px;
            color: #94a3b8;
        }

        #achievement-popup {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #facc15;
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
        }

        #achievement-popup.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div id="achievement-popup">🏆 Trophée débloqué !</div>

    <div class="modal-overlay" id="trophy-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Trophées & Succès</div>
                <button class="close-modal" onclick="toggleTrophyModal()">×</button>
            </div>
            <div class="trophies-list" id="trophies-list-container"></div>
        </div>
    </div>

    <div class="app-header">
        <div class="app-title-group">
            <div class="app-title">🌿 LE MÉTIER DE JARDINIER</div>
            <div class="daily-visits">📊 <span id="visits-count">1</span> visites aujourd'hui</div>
        </div>
        <div class="score-badge" id="score-display">0 Pts</div>
    </div>

    <div class="app-content">
        <div class="user-profile-card">
            <div class="avatar-picker" onclick="changeAvatar()" title="Changer l'avatar">
                <div class="user-avatar" id="avatar-display">👨‍🌾</div>
            </div>
            <div class="profile-info">
                <input type="text" class="username-input" id="username-input" value="JardinierPro" placeholder="Ton pseudo..." oninput="saveUserData()">
                <div class="rank-badge" id="rank-display">🌱 Apprenti Paysagiste</div>
                
                <div class="progress-box">
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="rank-progress-fill"></div>
                    </div>
                    <div class="progress-text">
                        <span id="rank-next-title">Suivant: Ouvrier Qualifié</span>
                        <span id="rank-points-left">40 pts restants</span>
                    </div>
                </div>

                <div class="top-menu-actions">
                    <button class="trophy-btn-mini" onclick="toggleTrophyModal()">🏆 Trophées</button>
                </div>
            </div>
        </div>

        <div class="quiz-box">
            <div class="quiz-header-info">
                <div class="question-title">PRATIQUE PROFESSIONNELLE</div>
                <div class="difficulty-tag diff-facile" id="diff-tag">Facile</div>
            </div>
            <div class="question-text" id="question">Chargement de la question...</div>
        </div>

        <div class="options-grid" id="options"></div>

        <div class="explanation-box" id="explanation-box">
            <div class="points-notification" id="points-notice"></div>
            <div class="explanation-text" id="explanation"></div>
        </div>

        <div class="action-buttons">
            <a href="#" target="_blank" class="wiki-btn" id="wiki-btn">
                🌐 En savoir plus sur Wikipédia
            </a>
            <button class="next-btn" id="next-btn" onclick="nextQuestion()">
                🚀 Question Suivante
            </button>
            <button class="share-btn" onclick="shareScore()">
                🔗 Inviter des collègues & Partager mon score
            </button>
        </div>
    </div>
</div>

<script>
    // Base initiale centrée purement sur le métier de jardinier (gestes professionnels, sécurité, organisation de chantier, matériel pro)
    let baseQuiz = [
        { 
            q: "Quel est l'équipement de protection individuelle (EPI) obligatoire impératif lors de l'utilisation d'une débroussailleuse thermique professionnelle ?", 
            correct: "Casque antibruit, visière grillagée (ou lunettes), chaussures de sécurité et vêtements résistants", 
            wrongs: ["Un simple short et des lunettes de soleil de plage", "Un costume de ville et des chaussures vernies", "Un tablier de cuisine en coton léger"],
            exp: "Le métier de jardinier impose des règles strictes de sécurité : la projection de pierres par la débroussailleuse exige une protection faciale et auditive complète.",
            wiki: "https://fr.wikipedia.org/wiki/%C3%89quipement_de_protection_individuelle",
            difficulty: "facile"
        },
        { 
            q: "Dans le cadre de l'entretien professionnel des espaces verts, qu'appelle-t-on la période de 'taille de formation' d'une haie ?", 
            correct: "L'intervention réalisée les premières années pour structurer et fortifier la charpente de l'arbuste", 
            wrongs: ["Le nettoyage des outils à l'eau de Javel après le chantier", "Le calcul de la facture à envoyer au client en fin de mois", "L'obligation légale de porter un gilet haute visibilité"],
            exp: "La taille de formation s'effectue sur les jeunes haies pour obtenir une densité correcte dès la base avant d'entamer les tailles d'entretien régulières.",
            wiki: "https://fr.wikipedia.org/wiki/Taille_(arboriculture)",
            difficulty: "moyen"
        },
        { 
            q: "Quel réflexe professionnel a un jardinier qualifié avant de ranger une tondeuse autoportée thermique après sa dernière utilisation de la journée ?", 
            correct: "Vérifier les niveaux d'huile, nettoyer le carter de coupe des accumulations d'herbe humide et couper le contact", 
            wrongs: ["La nettoyer au karcher directement dans le salon du client", "La laisser tourner au ralenti toute la nuit dans le camion", "Démonter entièrement le moteur pièce par pièce"],
            exp: "L'entretien quotidien du matériel (nettoyage du carter pour éviter la rouille et contrôle des fluides) fait partie intégrante du travail de l'ouvrier paysagiste.",
            wiki: "https://fr.wikipedia.org/wiki/Tondeuse_%C3%A0_gazon",
            difficulty: "moyen"
        }
    ];

    let quizData = [...baseQuiz];

    // Domaines d'intervention et tâches professionnelles du métier de jardinier-paysagiste
    const metierDomaines = [
        { theme: "la tonte et la gestion des gazons", wiki: "Tondeuse_%C3%A0_gazon" },
        { theme: "la taille des arbustes et des massifs", wiki: "Taille_(arboriculture)" },
        { theme: "l'entretien des massifs et le désherbage", wiki: "Jardinage" },
        { theme: "l'utilisation du matériel thermique et autoporté", wiki: "Espace_vert" },
        { theme: "la gestion des déchets verts et du broyage", wiki: "Déchet_vert" },
        { theme: "les chantiers d'aménagement paysager", wiki: "Paysagiste" },
        { theme: "le diagnostic phytosanitaire de terrain", wiki: "Protection_des_cultures" },
        { theme: "la sécurité et l'ergonomie sur chantier", wiki: "Sécurité_et_santé_au_travail" }
    ];

    // Générateurs de questions basées sur les gestes et situations du métier
    const typesQuestionsMetier = [
        {
            diff: "facile",
            q: (d) => `Lors d'un chantier d'entretien paysager axé sur ${d.theme}, quelle est la première chose qu'un jardinier professionnel vérifie en arrivant sur le site ?`,
            correct: "L'état des lieux, la présence de contraintes techniques et la sécurité de la zone de travail", 
            wrongs: ["La couleur des chaussettes du client", "Le nombre d'oiseaux migrateurs dans le ciel", "La température exacte de l'eau du robinet"],
            exp: (d) => `L'analyse des risques et la vérification des consignes du client sont les réflexes de base de tout professionnel de ${d.theme}.`
        },
        {
            diff: "moyen",
            q: (d) => `Sur un chantier professionnel concernant ${d.theme}, pourquoi évite-t-on d'intervenir lors de conditions météorologiques extrêmes (fortes pluies ou canicule) ?`,
            correct: "Pour préserver la structure des sols, la santé des végétaux et garantir la sécurité des opérateurs", 
            wrongs: ["Parce que les camions de paysagistes fondent sous l'eau", "Pour obliger les salariés à rester à l'atelier à regarder la pluie", "Parce que l'herbe devient de l'or massif sous le soleil"],
            exp: (d) => `Travailler des sols gorgés d'eau les compacte irrémédiablement, ce qui nuit gravement à la qualité professionnelle de ${d.theme}.`
        },
        {
            diff: "difficile",
            q: (d) => `Quelle est la méthode professionnelle standard qu'utilise un jardinier-paysagiste pour optimiser le chargement et l'arrimage des déchets verts dans sa benne de camion ?`,
            correct: "Le tassement méthodique par strates successives et l'utilisation de filets de retenue réglementaires homologués", 
            wrongs: ["Tasser les végétaux à coups de masse de 10 kilos sur le capot", "Mettre le feu directement dans la benne sur la route", "Demander aux passants de s'asseoir sur les branches"],
            exp: (d) => `Le transport sécurisé des déchets issus de ${d.theme} est soumis à la réglementation routière et nécessite un arrimage rigoureux.`
        },
        {
            diff: "moyen",
            q: (d) => `Comment un jardinier qualifié gère-t-il la maintenance préventive de ses outils de coupe (sécateurs, cisailles, lames de taille-haies) au fil des chantiers ?`,
            correct: "Par un nettoyage régulier des résines, un affûtage périodique et une désinfection pour éviter les transmissions de maladies", 
            wrongs: ["En les plongeant dans de l'acide chlorhydrique pur tous les matins", "En les jetant dans un ruisseau pour les laver naturellement", "En les frottant avec du sable fin jusqu'à les faire fondre"],
            exp: (d) => `L'entretien rigoureux du matériel de coupe garantit la propreté des plaies de coupe sur les chantiers liés à ${d.theme}.`
        }
    ];

    // Génération automatique des 500 questions orientées métier de jardinier
    for (let i = 1; i < 500; i++) {
        let randDom = metierDomaines[Math.floor(Math.random() * metierDomaines.length)];
        let randType = typesQuestionsMetier[Math.floor(Math.random() * typesQuestionsMetier.length)];
        
        quizData.push({
            q: randType.q(randDom),
            correct: randType.correct,
            wrongs: randType.wrongs,
            exp: randType.exp(randDom),
            wiki: `https://fr.wikipedia.org/wiki/${randDom.wiki}`,
            difficulty: randType.diff
        });
    }

    let score = 0;
    let currentQuestionObj = null;
    let avatarsChangesCount = 0;
    let consecutiveErrors = 0;
    let consecutiveSuccess = 0;
    let shuffledOptionsCache = [];
    let correctButtonIndex = 0;

    const avatars = ["👨‍🌾", "👩‍🌾", "👷‍♂️", "🚜", "🌿", "🧑‍🌾"];
    let avatarIdx = 0;

    const trophies = [
        { id: "t1", icon: "🌱", title: "Première embauche", desc: "Donner sa première bonne réponse", unlocked: false },
        { id: "t2", icon: "🌿", title: "Chef d'équipe", desc: "Atteindre 100 points", unlocked: false },
        { id: "t3", icon: "👕", title: "Changement de Tenue", desc: "Changer 3 fois d'avatar", unlocked: false },
        { id: "t4", icon: "⚠️", title: "Alerte Sécurité", desc: "Faire 3 erreurs d'affilée", unlocked: false },
        { id: "t5", icon: "⭐", title: "Prime de Rendement", desc: "Faire 3 bonnes réponses d'affilée", unlocked: false },
        { id: "t6", icon: "📋", title: "Conducteur de Travaux", desc: "Répondre à 10 questions", unlocked: false },
        { id: "t7", icon: "🏆", title: "Maître Paysagiste", desc: "Atteindre 250 points", unlocked: false }
    ];

    const ranks = [
        { min: 0, max: 40, title: "🌱 Apprenti Paysagiste", nextTitle: "Ouvrier Qualifié", allowedDiff: ["facile"] },
        { min: 40, max: 100, title: "🌿 Ouvrier Qualifié", nextTitle: "Chef d'Équipe", allowedDiff: ["facile", "moyen"] },
        { min: 100, max: 200, title: "🪴 Chef d'Équipe", nextTitle: "Conducteur de Travaux", allowedDiff: ["facile", "moyen", "difficile"] },
        { min: 200, max: 400, title: "🌳 Conducteur de Travaux", nextTitle: "Expert Paysagiste", allowedDiff: ["moyen", "difficile"] },
        { min: 400, max: Infinity, title: "🏆 Directeur des Espaces Verts", nextTitle: "Niveau Max", allowedDiff: ["difficile"] }
    ];

    function getCurrentRank() {
        const currentScore = Math.max(0, score);
        let currentRank = ranks[0];
        for (let r of ranks) {
            if (currentScore >= r.min) currentRank = r;
        }
        return currentRank;
    }

    function trackDailyVisits() {
        const today = new Date().toDateString();
        let savedDate = localStorage.getItem('jardin_metier_visit_date');
        let visitCount = parseInt(localStorage.getItem('jardin_metier_visits_count')) || 0;

        if (savedDate !== today) {
            visitCount = 1;
            localStorage.setItem('jardin_metier_visit_date', today);
            score += 20;
            showAchievement("💧 Pointage du matin : +20 Pts !");
        } else {
            visitCount++;
        }
        localStorage.setItem('jardin_metier_visits_count', visitCount);
        document.getElementById("visits-count").innerText = visitCount;
    }

    function loadUserData() {
        if (localStorage.getItem('jardin_metier_score')) score = parseInt(localStorage.getItem('jardin_metier_score'));
        if (localStorage.getItem('jardin_metier_pseudo')) document.getElementById("username-input").value = localStorage.getItem('jardin_metier_pseudo');
        if (localStorage.getItem('jardin_metier_avatar')) {
            document.getElementById("avatar-display").innerText = localStorage.getItem('jardin_metier_avatar');
            avatarIdx = avatars.indexOf(localStorage.getItem('jardin_metier_avatar'));
            if (avatarIdx === -1) avatarIdx = 0;
        }
        if (localStorage.getItem('jardin_metier_trophies')) {
            const savedT = JSON.parse(localStorage.getItem('jardin_metier_trophies'));
            trophies.forEach(t => { if (savedT.includes(t.id)) t.unlocked = true; });
        }
        if (localStorage.getItem('jardin_metier_avatar_count')) {
            avatarsChangesCount = parseInt(localStorage.getItem('jardin_metier_avatar_count'));
        }
        trackDailyVisits();
        renderTrophiesList();
        updateRankProgress();
        loadFilteredRandomQuestion();
    }

    function saveUserData() {
        localStorage.setItem('jardin_metier_score', score);
        localStorage.setItem('jardin_metier_pseudo', document.getElementById("username-input").value);
        localStorage.setItem('jardin_metier_avatar', document.getElementById("avatar-display").innerText);
        localStorage.setItem('jardin_metier_avatar_count', avatarsChangesCount);
        
        const unlockedIds = trophies.filter(t => t.unlocked).map(t => t.id);
        localStorage.setItem('jardin_metier_trophies', JSON.stringify(unlockedIds));
    }

    function unlockTrophy(id) {
        const trophy = trophies.find(t => t.id === id);
        if (trophy && !trophy.unlocked) {
            trophy.unlocked = true;
            showAchievement(`🏆 Trophée débloqué : ${trophy.title} !`);
            renderTrophiesList();
            saveUserData();
        }
    }

    function showAchievement(text) {
        const popup = document.getElementById("achievement-popup");
        popup.innerText = text;
        popup.classList.add("show");
        setTimeout(() => { popup.classList.remove("show"); }, 3000);
    }

    function toggleTrophyModal() {
        const modal = document.getElementById("trophy-modal");
        modal.style.display = modal.style.display === "flex" ? "none" : "flex";
    }

    function renderTrophiesList() {
        const container = document.getElementById("trophies-list-container");
        container.innerHTML = "";
        trophies.forEach(t => {
            container.innerHTML += `
                <div class="trophy-item ${t.unlocked ? 'unlocked' : ''}">
                    <div class="trophy-icon">${t.icon}</div>
                    <div class="trophy-details">
                        <h4>${t.title}</h4>
                        <p>${t.desc}</p>
                    </div>
                </div>
            `;
        });
    }

    function changeAvatar() {
        avatarIdx = (avatarIdx + 1) % avatars.length;
        document.getElementById("avatar-display").innerText = avatars[avatarIdx];
        avatarsChangesCount++;
        if (avatarsChangesCount >= 3) unlockTrophy("t3");
        saveUserData();
    }

    let totalAnsweredCount = 0;
    function checkTrophies() {
        if (score >= 10) unlockTrophy("t1");
        if (score >= 100) unlockTrophy("t2");
        if (totalAnsweredCount >= 10) unlockTrophy("t6");
        if (score >= 250) unlockTrophy("t7");
    }

    function updateRankProgress() {
        const currentScore = Math.max(0, score);
        let currentRank = getCurrentRank();

        document.getElementById("rank-display").innerText = currentRank.title;
        document.getElementById("score-display").innerText = `${score} Pts`;

        const fillBar = document.getElementById("rank-progress-fill");
        const nextTitleElem = document.getElementById("rank-next-title");
        const pointsLeftElem = document.getElementById("rank-points-left");

        if (currentRank.max === Infinity) {
            fillBar.style.width = "100%";
            nextTitleElem.innerText = "Niveau Max !";
            pointsLeftElem.innerText = "🏆";
        } else {
            const range = currentRank.max - currentRank.min;
            const progress = currentScore - currentRank.min;
            const percentage = Math.min(100, Math.max(0, (progress / range) * 100));
            const pointsNeeded = currentRank.max - currentScore;

            fillBar.style.width = `${percentage}%`;
            nextTitleElem.innerText = `Suivant: ${currentRank.nextTitle}`;
            pointsLeftElem.innerText = `${pointsNeeded} pts restants`;
        }
        checkTrophies();
    }

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function loadFilteredRandomQuestion() {
        const currentRank = getCurrentRank();
        let eligibleQuestions = quizData.filter(q => currentRank.allowedDiff.includes(q.difficulty));
        if (eligibleQuestions.length === 0) eligibleQuestions = quizData;

        const randomIndex = Math.floor(Math.random() * eligibleQuestions.length);
        currentQuestionObj = eligibleQuestions[randomIndex];
        
        document.getElementById("question").innerText = currentQuestionObj.q;
        
        const diffTag = document.getElementById("diff-tag");
        diffTag.className = `difficulty-tag diff-${currentQuestionObj.difficulty}`;
        diffTag.innerText = currentQuestionObj.difficulty.toUpperCase();

        let allOptions = [currentQuestionObj.correct, ...currentQuestionObj.wrongs];
        shuffledOptionsCache = shuffleArray(allOptions);
        correctButtonIndex = shuffledOptionsCache.indexOf(currentQuestionObj.correct);

        const optsContainer = document.getElementById("options");
        optsContainer.innerHTML = "";

        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("wiki-btn").style.display = "none";
        document.getElementById("next-btn").style.display = "none";

        shuffledOptionsCache.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(idx);
            optsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        totalAnsweredCount++;
        const buttons = document.querySelectorAll(".option-btn");
        
        buttons.forEach((btn, idx) => {
            btn.disabled = true;
            if (idx === correctButtonIndex) {
                btn.style.borderColor = "#22c55e";
                btn.style.background = "rgba(34, 197, 94, 0.2)";
            } else if (idx === selectedIndex) {
                btn.style.borderColor = "#ef4444";
                btn.style.background = "rgba(239, 68, 68, 0.2)";
            }
        });

        const isCorrect = (selectedIndex === correctButtonIndex);
        const explanationBox = document.getElementById("explanation-box");
        const pointsNotice = document.getElementById("points-notice");
        const explanationText = document.getElementById("explanation");
        
        if (isCorrect) {
            let ptsEarned = currentQuestionObj.difficulty === 'difficile' ? 30 : (currentQuestionObj.difficulty === 'moyen' ? 20 : 10);
            score += ptsEarned;
            pointsNotice.innerText = `✅ Bonne réponse pro ! (+${ptsEarned} pts)`;
            pointsNotice.style.color = "#4ade80";
            
            consecutiveSuccess++;
            consecutiveErrors = 0;
            if (consecutiveSuccess >= 3) unlockTrophy("t5");
        } else {
            score = Math.max(0, score - 5);
            pointsNotice.innerText = `❌ Erreur de procédure (-5 pts)`;
            pointsNotice.style.color = "#f87171";
            
            consecutiveErrors++;
            consecutiveSuccess = 0;
            if (consecutiveErrors >= 3) unlockTrophy("t4");
        }

        explanationText.innerText = currentQuestionObj.exp;
        explanationBox.style.display = "block";

        const wikiBtn = document.getElementById("wiki-btn");
        if (currentQuestionObj.wiki) {
            wikiBtn.href = currentQuestionObj.wiki;
            wikiBtn.style.display = "flex";
        }

        document.getElementById("next-btn").style.display = "block";

        updateRankProgress();
        saveUserData();
    }

    function nextQuestion() {
        loadFilteredRandomQuestion();
    }

    function shareScore() {
        const pseudo = document.getElementById("username-input").value || "Un jardinier pro";
        const text = `${pseudo} a atteint ${score} points sur Le Métier de Jardinier Quiz 🌿 !`;
        if (navigator.share) {
            navigator.share({ title: 'Le Métier de Jardinier Quiz', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text);
            showAchievement("📋 Score copié dans le presse-papier !");
        }
    }

    window.onload = loadUserData;
</script>

</body>
</html>
